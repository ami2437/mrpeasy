<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AT-HUB — Batch Pack Shipments</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth-guard.js"></script>
</head>
<body>
  <div class="app-shell">
  <div id="sidebar"></div>
  <main>
    <div class="card">
      <p class="muted" style="margin-top:0;">Pack shipments one at a time or all at once. Each order line is split into boxes by its pack size
        (pre-filled from the item's default). Packed shipments stay listed so you can re-pack or print their labels.</p>
      <div class="row" style="align-items:center;">
        <select id="view-filter" style="max-width:240px;">
          <option value="unpacked">Needs packing</option>
          <option value="all">All open &amp; shipped (not invoiced)</option>
        </select>
        <label style="white-space:nowrap;"><input type="checkbox" id="select-all"> Select all shown</label>
        <button onclick="packAll()">Pack All Unpacked</button>
        <button class="secondary" onclick="printSelectedLabels()">Print Labels for Selected</button>
      </div>
      <div id="bulk-error" class="error"></div>
      <div id="bulk-result" class="muted"></div>
    </div>

    <div id="shipments-container"><div class="card">Loading...</div></div>
  </main>

  <script>
    AuthGuard.requireLogin();
    document.getElementById("sidebar").innerHTML = renderSidebar("pack-shipments.html");

    let shipments = [];
    let orders = [];
    let items = [];
    let customers = [];
    let lots = [];
    const selected = new Set();

    function order(id) { return orders.find(o => o.id === id); }
    function itemObj(id) { return items.find(i => i.id === id); }
    function itemLabel(id) { const i = itemObj(id); return i ? `${i.code} — ${i.title}` : id; }
    function customerName(id) { const c = customers.find(c => c.id === id); return c ? c.name : id; }

    // Everything is per order line: the same item on two lines is packed as two lines.
    function qtyByLine(shipment) {
      const byLine = {};
      shipment.lines.forEach(l => {
        byLine[l.order_line_id] = byLine[l.order_line_id] || { order_line_id: l.order_line_id, line_no: l.line_no, item_id: l.item_id, qty: 0 };
        byLine[l.order_line_id].qty += l.quantity;
      });
      return Object.values(byLine).sort((a, b) => (a.line_no || 0) - (b.line_no || 0));
    }

    function boxedByLine(shipment) {
      const totals = {};
      shipment.boxes.forEach(b => { totals[b.order_line_id] = (totals[b.order_line_id] || 0) + b.quantity_in_box; });
      return totals;
    }

    function isPacked(shipment) {
      const boxed = boxedByLine(shipment);
      return qtyByLine(shipment).every(e => Math.abs((boxed[e.order_line_id] || 0) - e.qty) < 1e-6);
    }

    // Mirrors the existing portal's calculate_boxes(): full boxes of pack_size, then one remainder box.
    function calculateBoxes(quantity, packSize) {
      if (!packSize || packSize <= 0) packSize = quantity || 1;
      const fullBoxes = Math.floor(quantity / packSize);
      const remaining = Math.round(quantity - fullBoxes * packSize);
      const boxes = [];
      for (let i = 0; i < fullBoxes; i++) boxes.push({ quantity_in_box: packSize });
      if (remaining > 0) boxes.push({ quantity_in_box: remaining });
      return boxes;
    }

    function lotCodeForLine(shipment, orderLineId) {
      const lotIds = [...new Set(shipment.lines.filter(l => l.order_line_id === orderLineId).map(l => l.lot_id).filter(Boolean))];
      return lotIds.map(id => { const lot = lots.find(l => l.id === id); return lot ? lot.lot_code : null; }).filter(Boolean).join(", ");
    }

    function boxBreakdown(shipment, orderLineId) {
      const byQty = {};
      shipment.boxes.filter(b => b.order_line_id === orderLineId).forEach(b => { byQty[b.quantity_in_box] = (byQty[b.quantity_in_box] || 0) + 1; });
      return formatBoxCounts(byQty);
    }

    // Pack size shown for an already-packed line = its largest box; otherwise the item default.
    function packSizeFor(shipment, entry) {
      const boxes = shipment.boxes.filter(b => b.order_line_id === entry.order_line_id);
      if (boxes.length) return Math.max(...boxes.map(b => b.quantity_in_box));
      const item = itemObj(entry.item_id);
      return item && item.default_pack_size ? item.default_pack_size : entry.qty;
    }

    function visibleShipments() {
      const view = document.getElementById("view-filter").value;
      return shipments.filter(s => view === "all" || !isPacked(s));
    }

    function renderShipments() {
      const container = document.getElementById("shipments-container");
      const shown = visibleShipments();
      if (!shown.length) {
        container.innerHTML = `<div class="card muted">${shipments.length
          ? "Every open shipment is packed. Switch the view to \"All\" to re-pack or print labels."
          : "No open or shipped (un-invoiced) shipments. Create a shipment from a customer order first."}</div>`;
        return;
      }
      container.innerHTML = shown.map(shipment => {
        const ord = order(shipment.order_id);
        const packed = isPacked(shipment);
        const pallet = (shipment.boxes.find(b => b.pallet_number) || {}).pallet_number || "";
        return `
          <div class="card" data-shipment="${shipment.id}">
            <div class="row" style="align-items:center;">
              <h3 style="margin:0;">
                <input type="checkbox" class="ship-select" data-id="${shipment.id}" ${selected.has(shipment.id) ? "checked" : ""}>
                <a class="link" href="shipments.html?id=${shipment.id}">${shipment.code}</a>
                <span class="tag ${shipment.status}">${shipment.status}</span>
                <span class="muted" style="font-weight:normal;">— Order ${ord ? ord.code : ""} (${customerName(ord ? ord.customer_id : null)})</span>
              </h3>
              <span class="tag ${packed ? "shipped" : "draft"}">${packed ? `packed · ${shipment.boxes.length} box${shipment.boxes.length === 1 ? "" : "es"}` : "not packed"}</span>
            </div>
            <div class="row" style="max-width:300px; margin-top:8px;">
              <div><label>Pallet # (applies to all boxes below)</label><input type="text" class="shipment-pallet" value="${pallet}"></div>
            </div>
            <table class="lines-table fit-table">
              <thead><tr><th>Line</th><th class="grow">Item</th><th class="num">Qty</th><th>Pack size</th><th>Boxes</th></tr></thead>
              <tbody>
                ${qtyByLine(shipment).map(e => `
                    <tr data-line="${e.order_line_id}" data-item="${e.item_id}" data-qty="${e.qty}">
                      <td class="line-no">#${e.line_no ?? ""}</td>
                      <td class="grow">${itemLabel(e.item_id)}</td>
                      <td class="num">${fmtQty(e.qty)}</td>
                      <td><input type="number" step="1" min="1" class="pack-size-input qty-input" value="${packSizeFor(shipment, e)}"></td>
                      <td class="box-preview">${boxBreakdown(shipment, e.order_line_id) || '<span class="muted">—</span>'}</td>
                    </tr>
                `).join("")}
              </tbody>
            </table>
            <button onclick="packShipment(${shipment.id})" style="margin-top:8px;">${packed ? "Re-pack" : "Pack"} This Shipment</button>
            <div class="error" id="error-${shipment.id}"></div>
          </div>
        `;
      }).join("");

      container.querySelectorAll(".ship-select").forEach(cb => cb.addEventListener("change", () => {
        const id = parseInt(cb.dataset.id);
        cb.checked ? selected.add(id) : selected.delete(id);
      }));
      // Live preview of the split as the pack size is edited.
      container.querySelectorAll(".pack-size-input").forEach(input => input.addEventListener("input", () => {
        const tr = input.closest("tr");
        const qty = parseFloat(tr.dataset.qty);
        const byQty = {};
        calculateBoxes(qty, parseFloat(input.value) || qty).forEach(b => { byQty[b.quantity_in_box] = (byQty[b.quantity_in_box] || 0) + 1; });
        tr.querySelector(".box-preview").innerHTML = formatBoxCounts(byQty);
      }));
    }

    function buildBoxes(shipmentEl, shipment) {
      const pallet = shipmentEl.querySelector(".shipment-pallet").value || null;
      const boxes = [];
      let boxNumber = 1;
      shipmentEl.querySelectorAll("tbody tr[data-line]").forEach(tr => {
        const lineId = parseInt(tr.dataset.line);
        const itemId = parseInt(tr.dataset.item);
        const qty = parseFloat(tr.dataset.qty);
        const packSize = parseInt(tr.querySelector(".pack-size-input").value) || qty;
        const lotCode = lotCodeForLine(shipment, lineId) || null;
        calculateBoxes(qty, packSize).forEach(b => boxes.push({
          order_line_id: lineId, item_id: itemId, box_number: boxNumber++, quantity_in_box: b.quantity_in_box, lot_code: lotCode, pallet_number: pallet,
        }));
      });
      return boxes;
    }

    async function saveBoxes(shipment) {
      const shipmentEl = document.querySelector(`[data-shipment="${shipment.id}"]`);
      await apiFetch(`/api/shipments/${shipment.id}/boxes`, {
        method: "PUT",
        body: JSON.stringify({ boxes: buildBoxes(shipmentEl, shipment) }),
      });
      selected.add(shipment.id);  // just packed -> ready to print
    }

    async function packShipment(shipmentId) {
      const errorEl = document.getElementById(`error-${shipmentId}`);
      errorEl.textContent = "";
      try {
        await saveBoxes(shipments.find(s => s.id === shipmentId));
        document.getElementById("bulk-result").textContent = "Packed and selected for printing.";
        await load();
      } catch (err) {
        errorEl.textContent = err.message;
      }
    }

    async function packAll() {
      const errorEl = document.getElementById("bulk-error");
      const resultEl = document.getElementById("bulk-result");
      errorEl.textContent = "";
      resultEl.textContent = "";
      const targets = shipments.filter(s => !isPacked(s) && document.querySelector(`[data-shipment="${s.id}"]`));
      if (!targets.length) {
        resultEl.textContent = "Nothing unpacked is shown.";
        return;
      }
      let packed = 0;
      const failed = [];
      for (const shipment of targets) {
        try {
          await saveBoxes(shipment);
          packed += 1;
        } catch (err) {
          failed.push(`${shipment.code}: ${err.message}`);
        }
      }
      resultEl.textContent = `Packed ${packed} shipment(s) — they're selected, hit "Print Labels for Selected" to print them together.`;
      if (failed.length) errorEl.innerHTML = failed.join("<br>");
      await load();
    }

    async function printSelectedLabels() {
      const errorEl = document.getElementById("bulk-error");
      errorEl.textContent = "";
      const ids = [...selected];
      if (!ids.length) {
        errorEl.textContent = "Select at least one shipment (tick its checkbox) to print labels.";
        return;
      }
      const chosen = await Promise.all(ids.map(id => apiFetch(`/api/shipments/${id}`)));
      const unpacked = chosen.filter(s => !s.boxes.length);
      if (unpacked.length) {
        errorEl.textContent = `Not packed yet, so no labels: ${unpacked.map(s => s.code).join(", ")}. Pack them first.`;
        return;
      }
      const labels = chosen.flatMap(shipment => {
        const ord = order(shipment.order_id);
        return shipment.boxes.map(b => {
          const item = itemObj(b.item_id) || {};
          return {
            customer: customerName(ord ? ord.customer_id : null), shipment: shipment.code,
            order: ord ? ord.code : "", po: ord ? ord.po_number : "", job: ord ? ord.job_number : "",
            item_code: item.code || b.item_id, item_title: item.title || "", qty: b.quantity_in_box,
          };
        });
      });
      printBoxLabels(labels, "Batch Labels");
    }

    async function load() {
      let all;
      [all, orders, items, customers, lots] = await Promise.all([
        apiFetch("/api/shipments/"),
        apiFetch("/api/customer-orders/"),
        apiFetch("/api/stock-items/"),
        apiFetch("/api/customers/"),
        apiFetch("/api/lots/"),
      ]);
      shipments = all.filter(s => !["cancelled", "invoiced"].includes(s.status) && s.lines.length);
      renderShipments();
    }

    document.getElementById("view-filter").addEventListener("change", renderShipments);
    document.getElementById("select-all").addEventListener("change", e => {
      visibleShipments().forEach(s => e.target.checked ? selected.add(s.id) : selected.delete(s.id));
      renderShipments();
    });
    load();
  </script>
  </div>
</body>
</html>
