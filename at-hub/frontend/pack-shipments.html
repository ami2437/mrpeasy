<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AT-HUB — Bulk Operations</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth-guard.js"></script>
  <script src="shipment-detail.js"></script>
</head>
<body>
  <div class="app-shell">
  <div id="sidebar"></div>
  <main>
    <div class="card page-toolbar bulk-head">
      <h1 class="page-title">Bulk Operations</h1>
      <div class="seg-tabs area-tabs" id="area-tabs">
        <button class="seg-tab active" data-area="shipments" onclick="setArea('shipments')">Shipments</button>
        <button class="seg-tab" data-area="invoices" onclick="setArea('invoices')" data-perm="invoices">Invoices</button>
      </div>
      <span class="muted small bulk-head-hint">The same action on many records at once — tick them, then pick what to do.</span>
    </div>
    <div id="area-shipments">
    <div class="card batch-toolbar">
      <div class="stage-tabs" id="stage-tabs" role="tablist"></div>
      <div class="stage-hint muted small" id="stage-hint"></div>
      <div class="filters">
        <input type="text" id="search" placeholder="Search shipment, order, customer, PO #, job # or item #...">
        <div class="sort-filters">
          <label class="check-label">Sort <select id="sort-by" onchange="prefChanged()">
            <option value="recent">Most recent</option><option value="oldest">Oldest first</option><option value="customer">Customer A–Z</option>
            <option value="order">Order #</option><option value="po">PO #</option><option value="job">Job #</option><option value="shipment">Shipment #</option>
            <option value="units">Most units</option></select></label>
          <label class="check-label">Customer <select id="f-customer" onchange="prefChanged()"><option value="">All</option></select></label>
          <label class="check-label">Packing <select id="f-packed" onchange="prefChanged()"><option value="">Any</option><option value="packed">Packed</option><option value="unpacked">Not packed</option></select></label>
          <label class="check-label">POD <select id="f-pod" onchange="prefChanged()"><option value="">Any</option><option value="missing">Missing</option><option value="has">Has POD</option></select></label>
          <a class="link small" id="f-clear" onclick="clearFilters()" style="display:none;">Clear filters</a>
        </div>
        <label id="period-wrap" class="check-label" style="display:none;">Shipped within
          <select id="period" onchange="renderAll()" style="width:auto;padding:5px 6px;font-size:13px;">
            <option value="30">30 days</option><option value="90" selected>90 days</option><option value="365">a year</option><option value="0">any time</option></select></label>
        <a class="link small" onclick="expandAll(true)">Expand all</a>
        <a class="link small" onclick="expandAll(false)">Collapse all</a>
        <span class="pack-tools">
          <label class="check-label" title="How the pack size boxes are pre-filled before you change them">Pre-fill <select id="pack-rule" onchange="setPackRule(this.value)" style="width:auto;max-width:190px;"></select></label>
          <button class="secondary small-btn" style="flex:0 0 auto;" onclick="openPackSizeManager(afterPackChange)">Pack Sizes</button>
        </span>
      </div>
      <div class="batch-actions">
        <label class="check-label"><input type="checkbox" id="select-all"> All shown</label>
        <span class="sel-count" id="sel-count">0 selected</span>
        <span class="stage-actions" id="stage-actions"></span>
      </div>
      <div class="small muted pack-tools" style="margin-top:6px;">Packing list prints:
        <label class="inline-check"><input type="checkbox" id="pl-all-boxes" checked> Box details</label>
        <label class="inline-check"><input type="checkbox" id="pl-all-pallets" checked> Pallet info</label>
        <label class="inline-check" title="How many boxes ride on each pallet, in the pallet table (off unless needed)"><input type="checkbox" id="pl-all-pallet-boxes"> Boxes per pallet</label>
        <label class="inline-check"><input type="checkbox" id="pl-all-lots"> Lot #</label>
        <label class="inline-check" title="Line notes from the order (a note marked 'don't print' never prints)"><input type="checkbox" id="pl-all-notes" checked> Line notes</label>
      </div>
      <div id="bulk-error" class="error"></div>
      <div id="bulk-result" class="small"></div>
    </div>

    <div id="shipments-container"><div class="card">Loading...</div></div>
    <div id="detail-holder" style="display:none;"><div class="card" id="detail-card" style="display:none;"></div></div>
    </div>

    <div id="area-invoices" style="display:none;">
      <div class="card batch-toolbar">
        <div class="filters">
          <input type="text" id="inv-search" placeholder="Search invoice, customer, PO #, job # or shipment #..." oninput="renderInvoices()">
          <label class="check-label">Sort <select id="inv-sort" onchange="renderInvoices()" style="width:auto;">
            <option value="recent">Most recent</option><option value="oldest">Oldest first</option><option value="customer">Customer A–Z</option>
            <option value="total">Largest total</option><option value="code">Invoice #</option></select></label>
          <label class="check-label">Customer <select id="inv-customer" onchange="renderInvoices()" style="width:auto;max-width:200px;"><option value="">All</option></select></label>
          <select id="inv-filter" onchange="renderInvoices()" style="max-width:220px;">
            <option value="unsent">Not sent yet (drafts)</option><option value="open">Unpaid (sent)</option><option value="all">All live invoices</option>
          </select>
        </div>
        <div class="batch-actions">
          <label class="check-label"><input type="checkbox" id="inv-select-all" onchange="invSelectAll(this.checked)"> All shown</label>
          <span class="sel-count" id="inv-sel-count">0 selected</span>
          <span class="stage-actions"><button class="next-step" data-icon="mail" onclick="openDocsDialog('invoices')">Send / Print</button></span>
        </div>
      </div>
      <div class="card"><table class="fit-table no-col-bands" id="inv-table">
        <thead><tr><th></th><th>Invoice</th><th class="grow">Customer</th><th>PO #</th><th>Shipments</th><th>Date</th><th class="num">Total</th><th>Status</th><th>Emailed</th></tr></thead>
        <tbody id="inv-body"></tbody></table></div>
    </div>
  </main>

  <script>
    AuthGuard.requirePerm("shipments.work", "invoices");
    document.getElementById("sidebar").innerHTML = renderSidebar("pack-shipments.html");

    // Globals the shared shipment-detail.js reads.
    let shipments = [];
    let orders = [];
    let items = [];
    let customers = [];
    let lots = [];
    let shipmentsById = {};
    let currentShipmentId = null;

    let packHistory = [];          // /api/stock-items/pack-sizes/history
    const selected = new Set();
    const openCards = new Set();
    let detailOpenId = null;

    const canManage = AuthGuard.can("shipments.deliver"), canBill = AuthGuard.can("invoices");

    function byId(id) { return shipments.find(s => s.id === id); }
    function cardEl(id) { return document.querySelector(`.ship-card[data-shipment="${id}"]`); }

    function boxedByLine(shipment) {
      const totals = {};
      shipment.boxes.forEach(b => { totals[b.order_line_id] = (totals[b.order_line_id] || 0) + b.quantity_in_box; });
      return totals;
    }
    function isPacked(shipment) {
      if (!shipment.boxes.length) return false;
      const boxed = boxedByLine(shipment);
      return shippedByLine(shipment).every(e => Math.abs((boxed[e.order_line_id] || 0) - e.qty) < 1e-6);
    }
    // packing accepted: the bulk pack-size tools leave it alone (change it in Process)
    // packing tag on a card; once it has left, "accepted" no longer matters (imported shipments never had the flag)
    function packTagHtml(s, packed) {
      const boxes = `${s.boxes.length} box${s.boxes.length === 1 ? "" : "es"}`, gone = !["new", "ready"].includes(s.status);
      if (s.packed_at || (gone && packed)) return `<span class="tag shipped">Packed · ${boxes}</span>`;
      if (gone) return `<span class="tag draft">No boxes</span>`;
      return `<span class="tag draft">${packed ? "Proposed · not accepted" : "Not Packed"}</span>`;
    }
    function hasPicks(s) { return s.status === "ready" && s.lines.some(l => (l.picked_quantity || 0) > 0); }
    function hasPacking(s) { return !!s.packed_at; }
    function lotCodesFor(shipment, lineId) {
      const ids = [...new Set(shipment.lines.filter(l => l.order_line_id === lineId).map(l => l.lot_id).filter(Boolean))];
      return ids.map(lotCode).filter(Boolean).join(", ");
    }
    function splitText(qty, pack) {
      const byQty = {};
      calculateBoxes(qty, pack || qty).forEach(b => { byQty[b.quantity_in_box] = (byQty[b.quantity_in_box] || 0) + 1; });
      return formatBoxCounts(byQty);
    }

    // ---- filtering ----
    function matches(s, q) {
      const ord = order(s.order_id) || {};
      return searchMatch(q, s.code, ord.code, ord.po_number, ord.job_number, customerName(ord.customer_id), s.carrier, s.tracking_number,
        s.lines.map(l => itemCode(l.item_id)));
    }
    // ---- stages: the same steps as one shipment (pick -> accept packing -> Ship Now -> delivered -> invoice) ----
    const STAGES = [
      { key: "pick", label: "To pick", test: s => ["new", "ready"].includes(s.status) && !allPicked(s),
        hint: "Booked and waiting on the floor. Tick them and <b>Process Selected</b> — or a card's <b>Process</b> for one.",
        empty: "Nothing to pick — new shipments land here once they're created on an order." },
      { key: "pack", label: "To pack", test: s => s.status === "ready" && allPicked(s) && !s.packed_at,
        hint: "Picked. Tick them and <b>Process Selected</b> to set pack sizes and pallets for all of them at once — or a card's <b>Process</b> for one.",
        empty: "Nothing waiting on packing." },
      { key: "ship", label: "Ready to ship", test: s => s.status === "ready" && allPicked(s) && !!s.packed_at,
        hint: "Picked and packed. Tick them and <b>Process Selected</b> to add carriers and ship them together.",
        empty: "Nothing ready to ship yet — accept packing on picked shipments first." },
      { key: "shipped", label: "Shipped", test: s => s.status === "shipped",
        hint: "On the truck. A driver's POD marks it delivered automatically; managers can <b>Mark Delivered</b> by hand.",
        empty: "Nothing out for delivery." },
      { key: "delivered", label: "To bill", test: s => s.status === "delivered",
        hint: "Delivered and not invoiced yet. <b>Create Invoices</b> — shipments of the same order share one invoice.",
        empty: "Everything delivered has been invoiced." },
      { key: "done", label: "Completed", test: s => s.status === "invoiced", history: true,
        hint: "Shipped and invoiced — here to <b>reprint</b>: packing lists, labels and Send / Print. Shipments packed before AT-HUB get labels from today's pack sizes (nothing on them changes).",
        empty: "Nothing completed in this period — widen <b>Shipped within</b> or search." },
      { key: "all", label: "All", history: true, test: s => true, hint: "Every shipment, invoiced ones included. Pick a stage to act on them.", empty: "No shipments yet." },
    ];
    let stage = null;
    function stageOf(s) { return STAGES.find(st => st.key !== "all" && st.test(s)) || null; }
    function inPlay(s) { return s.status !== "cancelled" && s.lines.length; }
    function visibleShipments(stageKey = stage) {
      const q = document.getElementById("search").value.trim();
      const st = STAGES.find(x => x.key === stageKey);
      const days = st.history ? parseInt(document.getElementById("period").value) : 0;
      const since = days ? Date.now() - days * 864e5 : 0;
      const cust = document.getElementById("f-customer").value, packed = document.getElementById("f-packed").value, pod = document.getElementById("f-pod").value;
      const list = shipments.filter(s => inPlay(s) && st.test(s) && matches(s, q)
        && (!since || q || !["invoiced", "delivered"].includes(s.status) || new Date(s.ship_date || s.created_at).getTime() >= since)
        && (!cust || String((order(s.order_id) || {}).customer_id) === cust)
        && (!packed || (packed === "packed") === isPacked(s))
        && (!pod || (pod === "has") === !!(s.pods && s.pods.length)));
      const sorted = sortShipments(list);
      // To pick: shipments whose packing is already accepted go last, under their own heading -- never mixed in
      return stageKey === "pick" ? sorted.filter(s => !hasPacking(s)).concat(sorted.filter(hasPacking)) : sorted;
    }
    function searching() { return !!document.getElementById("search").value.trim() || ["f-customer", "f-packed", "f-pod"].some(id => document.getElementById(id).value); }
    // ---- sort & filter (remembered); default: most recent first ----
    const when = s => new Date(s.ship_date || s.created_at || 0).getTime() || 0;
    const byText = f => (a, b) => String(f(a) || "~").localeCompare(String(f(b) || "~"), undefined, { numeric: true, sensitivity: "base" });
    function noMatchHere() {
      const elsewhere = STAGES.filter(x => x.key !== stage && x.key !== "all").map(x => [x, visibleShipments(x.key).length]).filter(([, n]) => n);
      return elsewhere.length ? `Nothing in <b>${escapeHtml(STAGES.find(x => x.key === stage).label)}</b> matches — found in ${elsewhere.map(([x, n]) =>
          `<a class="link" onclick="setStage('${x.key}', true)">${escapeHtml(x.label)} (${n})</a>`).join(", ")}.`
        : "No shipments match this search or these filters.";
    }
    function sortShipments(list) {
      const k = document.getElementById("sort-by").value, o = s => order(s.order_id) || {};
      const cmp = {
        recent: (a, b) => when(b) - when(a) || b.id - a.id,
        oldest: (a, b) => when(a) - when(b) || a.id - b.id,
        customer: byText(s => customerName(o(s).customer_id)),
        order: byText(s => o(s).code), po: byText(s => o(s).po_number), job: byText(s => o(s).job_number), shipment: byText(s => s.code),
        units: (a, b) => b.lines.reduce((t, l) => t + l.quantity, 0) - a.lines.reduce((t, l) => t + l.quantity, 0),
      }[k] || ((a, b) => when(b) - when(a));
      return list.slice().sort((a, b) => cmp(a, b) || when(b) - when(a) || b.id - a.id);
    }
    function fillCustomerFilter() {
      const sel = document.getElementById("f-customer"), cur = sel.value;
      const ids = [...new Set(shipments.filter(inPlay).map(s => (order(s.order_id) || {}).customer_id).filter(Boolean))];
      const opts = ids.map(id => [id, customerName(id)]).sort((a, b) => String(a[1]).localeCompare(String(b[1])));
      sel.innerHTML = `<option value="">All</option>` + opts.map(([id, n]) => `<option value="${id}">${escapeHtml(n)}</option>`).join("");
      sel.value = opts.some(([id]) => String(id) === cur) ? cur : "";
    }
    const PREF_IDS = ["sort-by", "f-customer", "f-packed", "f-pod"];
    function prefChanged() {
      try { localStorage.setItem("bulk_prefs", JSON.stringify(Object.fromEntries(PREF_IDS.map(id => [id, document.getElementById(id).value])))); } catch {}
      renderAll();
    }
    function loadPrefs() {
      let p = {};
      try { p = JSON.parse(localStorage.getItem("bulk_prefs")) || {}; } catch {}
      PREF_IDS.forEach(id => { if (p[id] != null) document.getElementById(id).value = p[id]; });
      if (!document.getElementById("sort-by").value) document.getElementById("sort-by").value = "recent";
    }
    function clearFilters() {
      ["f-customer", "f-packed", "f-pod"].forEach(id => { document.getElementById(id).value = ""; });
      prefChanged();
    }

    function drawStages() {
      // while searching / filtering, each tab counts its matches -- so a job # in another stage is one click away
      // history tabs (Completed, All) count what "Shipped within" shows, so the number always matches the list
      const counts = Object.fromEntries(STAGES.map(st => [st.key, searching() || st.history ? visibleShipments(st.key).length : shipments.filter(s => inPlay(s) && st.test(s)).length]));
      const st = STAGES.find(x => x.key === stage);
      document.getElementById("stage-tabs").innerHTML = STAGES.map((x, i) => `${i && x.key !== "all" ? `<span class="stage-arrow" aria-hidden="true">›</span>` : ""}
        <button role="tab" aria-selected="${x.key === stage}" class="stage-tab ${x.key === stage ? "on" : ""} ${x.key === "all" ? "stage-all" : ""}" onclick="setStage('${x.key}')">
          ${escapeHtml(x.label)}${x.key !== "all" ? `<span class="stage-count ${counts[x.key] ? "" : "zero"}" title="${x.history ? "Shipped within the period chosen below" : ""}">${counts[x.key]}</span>` : ""}</button>`).join("");
      document.getElementById("stage-hint").innerHTML = st.hint;
      document.querySelectorAll(".pack-tools").forEach(el => { el.style.display = ["pick", "pack", "ship", "all"].includes(stage) ? "" : "none"; });
      document.getElementById("period-wrap").style.display = st.history ? "" : "none";
      document.getElementById("f-clear").style.display = ["f-customer", "f-packed", "f-pod"].some(id => document.getElementById(id).value) ? "" : "none";
      drawStageActions();
    }
    function setStage(key, keepSelection = false) {
      stage = key;
      try { localStorage.setItem("batch_stage", key); } catch {}
      if (!keepSelection) selected.clear();
      renderAll();
    }
    // the one next step for this stage is the bright button; the rest are quieter
    function drawStageActions() {
      const today = todayISO();
      const print = `<button class="secondary" onclick="printSelectedLabels()">Labels</button>
        <button class="secondary" onclick="printSelectedPackingLists()" title="Every selected packing list -- one PDF, or one file each">Packing Lists</button>`
        + `<button class="secondary" onclick="openDocsDialog('shipments')" title="Email or print packing lists, labels, invoices and PODs for the selected shipments">${icon("mail")} Send / Print</button>`;
      const process = `<button class="next-step" onclick="openBulkProcess()" title="Pick, pack and ship the ticked shipments together -- same steps as one shipment">${icon("package")} Process Selected</button>`;
      const html = {
        pick: process + print,
        pack: process + print,
        ship: process + print,
        shipped: canManage ? `<button class="next-step" onclick="bulkDeliver()" title="Mark delivered without a POD">${icon("checkCircle")} Mark Delivered</button>
          <label class="stage-date-label" for="bulk-delivered-date">Delivered on</label><input type="date" id="bulk-delivered-date" value="${today}" max="${today}" class="stage-date">${print}`
          : `<span class="muted small">A driver's proof of delivery marks these delivered.</span>${print}`,
        delivered: (canBill ? `<button class="next-step" onclick="bulkInvoice()">${icon("receipt")} Create Invoices</button>`
          : `<span class="muted small">A manager creates the invoices.</span>`) + print,
        done: `${print}`,
        all: `${print}`,
      }[stage];
      document.getElementById("stage-actions").innerHTML = html;
    }

    // ---- rendering ----
    function headHtml(s) {
      const ord = order(s.order_id) || {};
      const packed = isPacked(s);
      const units = s.lines.reduce((t, l) => t + l.quantity, 0);
      const nLines = shippedByLine(s).length;
      const pallets = new Set(s.boxes.map(b => b.pallet_number).filter(Boolean)).size;
      return `
        <div class="ship-head" onclick="toggleCard(${s.id})">
          <input type="checkbox" class="ship-select" ${selected.has(s.id) ? "checked" : ""} onclick="event.stopPropagation()" onchange="toggleSelect(${s.id}, this.checked)">
          <span class="caret">▶</span>
          <span class="code">${escapeHtml(s.code)}</span>
          <span class="nowrap">${shipmentStatusHtml(s)}</span>
          <span class="who" title="${escapeHtml(customerName(ord.customer_id))}">${orderLinkHtml(ord, ord.code)} · <strong>${escapeHtml(customerName(ord.customer_id) || "")}</strong>${ord.po_number ? ` · ${orderLinkHtml(ord, `PO ${ord.po_number}`)}` : ""}</span>
          <span class="meta hide-sm">${nLines} line${nLines === 1 ? "" : "s"} · ${fmtQty(units)} units${pallets ? ` · ${pallets} pallet${pallets === 1 ? "" : "s"}` : ""} · ${podCellHtml(s)}</span>
          ${packTagHtml(s, packed)}
        </div>`;
    }

    // order # / PO # open the order (without opening or closing the card)
    function orderLinkHtml(ord, text) {
      return ord && ord.id ? `<a class="link" href="customer-orders.html?id=${ord.id}" onclick="event.stopPropagation()" title="Open order ${escapeHtml(ord.code || "")}">${escapeHtml(text || "")}</a>` : escapeHtml(text || "");
    }

    // Cards SHOW the shipment (what's saved); changing one happens in Process Shipment (openProcess) or with the bulk tools.
    function lineRowsHtml(s) {
      return shippedByLine(s).map(e => {
        const picked = s.lines.filter(l => l.order_line_id === e.order_line_id).reduce((t, l) => t + l.picked_quantity, 0);
        const saved = s.boxes.some(b => b.order_line_id === e.order_line_id), pack = packSizeFor(s, e);
        const sug = (packSuggest[s.id] || {})[e.order_line_id];
        const label = saved ? (s.packed_at ? "Accepted packing" : "Proposed — not accepted") : sug ? sug.label : "";
        return `<tr>
            <td class="line-no">#${e.line_no ?? ""}</td>
            <td class="grow">${escapeHtml(itemLabel(e.item_id))}</td>
            <td class="num">${fmtQty(e.qty)}</td>
            <td class="num">${fmtQty(picked)}${picked >= e.qty ? " ✓" : ""}</td>
            <td class="num">${saved ? `<b>${pack}</b>` : `<span class="muted" title="Not packed yet -- what it will pre-fill">${pack}</span>`}
              ${label ? `<div class="pack-src src-${saved ? "saved" : sug ? sug.source : "none"}" title="${escapeHtml(label)}">${escapeHtml(label)}</div>` : ""}</td>
            <td>${saved ? boxBreakdownFor(s, e.order_line_id) : `<span class="muted">${splitText(e.qty, pack)}</span>`}</td>
            <td>${escapeHtml(linePallet(s, e.order_line_id)) || `<span class="muted">—</span>`}</td>
          </tr>`;
      }).join("");
    }

    function boxBreakdownFor(s, lineId) {
      const byQty = {};
      s.boxes.filter(b => b.order_line_id === lineId).forEach(b => { byQty[b.quantity_in_box] = (byQty[b.quantity_in_box] || 0) + 1; });
      return formatBoxCounts(byQty);
    }
    function palletSummaryHtml(s) {
      const used = [...new Set(s.boxes.map(b => b.pallet_number).filter(Boolean))];
      if (!used.length) return "";
      return `<div class="small card-pallets"><b>Pallets:</b> ${used.map(pn => { const p = s.pallets.find(x => x.pallet_number === pn) || {};
        const miss = [p.weight == null && "weight", !p.dimensions && "size"].filter(Boolean);
        return `${escapeHtml(pn)} <span class="${miss.length ? "neg" : "muted"}">(${miss.length ? `no ${miss.join(" or ")}` : `${fmtQty(p.weight)} lbs · ${escapeHtml(p.dimensions)}`})</span>`; }).join(" · ")}</div>`;
    }

    function bodyHtml(s) {
      const nLines = shippedByLine(s).length, open = ["new", "ready"].includes(s.status), next = (stageOf(s) || {}).key;
      return `
        <table class="fit-table no-table-tools">
          <thead><tr><th>Line</th><th class="grow">Item (${nLines})</th><th class="num">Qty</th><th class="num">Picked</th><th class="num">Pack size</th><th>Boxes</th><th>Pallet #</th></tr></thead>
          <tbody>${lineRowsHtml(s)}</tbody>
        </table>
        ${palletSummaryHtml(s)}
        <div class="ship-actions">
          ${open ? `<button class="next-step" onclick="openProcess(${s.id})" title="Pick, pack and ship -- every change happens here">${icon("package")} Process</button>`
            : `<button class="secondary" onclick="openProcess(${s.id})" title="Carrier / tracking, or Undo Ship">${icon("pencil")} Modify</button>`}
          ${s.boxes.length ? `<button class="secondary" onclick="printLabels(${s.id})">Labels</button>
            <button class="secondary" onclick="packingListOne(${s.id})">Packing List</button>` : ""}
          ${next === "shipped" && canManage ? `<button class="secondary" onclick="deliverOne(${s.id})" title="Mark delivered today without a POD">Mark Delivered</button>` : ""}
          ${next === "delivered" && canBill ? `<button class="next-step" onclick="offerBilling([byId(${s.id})])">Create Invoice</button>` : ""}
          <span class="spacer"></span>
          <a class="link small" onclick="openDetail(${s.id})">Full details — timeline, POD, delivery, invoicing…</a>
        </div>

    // ---- bulk tools save straight to the shipment (packing NOT accepted until Accept Packing) ----
    // Lines given a new size (sizeOf) or never boxed are split fresh; the rest keep their saved boxes, uneven splits included.
    // palletOf(e) returns a pallet # to move the line's boxes to, or undefined to leave them.
    async function saveProposedPacking(s, sizeOf = () => null, palletOf = () => undefined) {
      const boxes = [];
      let n = 1;
      shippedByLine(s).forEach(e => {
        const saved = s.boxes.filter(b => b.order_line_id === e.order_line_id).sort((a, b) => a.box_number - b.box_number);
        const savedQty = saved.reduce((t, b) => t + b.quantity_in_box, 0);
        const want = sizeOf(e), pallet = palletOf(e);
        if (!want && saved.length && Math.abs(savedQty - e.qty) < 1e-6) {
          saved.forEach(b => boxes.push({ order_line_id: e.order_line_id, item_id: e.item_id, box_number: n++, quantity_in_box: b.quantity_in_box,
            lot_code: b.lot_code, pallet_number: pallet !== undefined ? pallet : b.pallet_number, pack_size: b.pack_size ?? null }));
          return;
        }
        const pack = want || packSizeFor(s, e), keep = pallet !== undefined ? pallet : (saved[0] ? saved[0].pallet_number : null);
        calculateBoxes(e.qty, pack).forEach(b => boxes.push({ order_line_id: e.order_line_id, item_id: e.item_id, box_number: n++,
          quantity_in_box: b.quantity_in_box, lot_code: lotCodesFor(s, e.order_line_id) || null, pallet_number: keep || null, pack_size: pack }));
      });
      await apiFetch(`/api/shipments/${s.id}/boxes`, { method: "PUT", body: JSON.stringify({ boxes }) });
    }

    async function bulkRun(label, eligible, action) {
      showError(""); showResult("");
      const chosen = selectedShipments();
      if (!chosen.length) { showError("Tick at least one shipment first."); return; }
      const targets = chosen.filter(eligible);
      const skipped = chosen.filter(s => !eligible(s));
      const ok = [], failed = [];
      for (const s of targets) {
        try { await action(s); ok.push(s); }
        catch (e) { failed.push(`${escapeHtml(s.code)}: ${escapeHtml(e.message)}`); }
      }
      await reloadList();
      if (failed.length) showError(failed.join("<br>"));
      return { ok: ok.map(s => s.id), msg: `${label}: ${ok.length} done${ok.length ? ` (${ok.map(s => s.code).join(", ")})` : ""}`
        + (skipped.length ? ` · ${skipped.length} skipped — not at that stage (${skipped.map(s => s.code).join(", ")})` : "") };
    }
    // after a bulk step: show where they went and follow them there, still selected
    function moveOn(res) {
      if (!res || !res.ok.length) { if (res) showResult(res.msg); return; }
      const where = stageOf(byId(res.ok[0]));
      selected.clear();
      res.ok.forEach(id => selected.add(id));
      if (where && where.key !== stage) setStage(where.key, true); else renderAll();
      showResult(res.msg + (where ? ` → now in ${where.label}` : ""));
    }

    // ---- presets: a named set of pack sizes ----

    async function loadPresets() { try { presets = await apiFetch("/api/stock-items/pack-sizes/presets"); } catch { presets = []; } }

    // ---- Set Pack Sizes: one row per item across the ticked shipments ----
    let sp = null;
    const normCode = c => String(c || "").trim().toLowerCase().replace(/-nuts$/, "-nut");
    // live box count for a row: boxes over all its lines at this size
    function spRow(input) {
      const tr = input.closest("tr"), r = sp.list[+tr.dataset.i], v = parseInt(input.value) || 0;
      const n = v ? r.lines.reduce((t, { e }) => t + calculateBoxes(e.qty, v).length, 0) : 0;
      tr.querySelector(".sp-boxes").textContent = v ? `${n} box${n === 1 ? "" : "es"}` : "";
      tr.classList.toggle("sp-changed", String(v || "") !== String(r.value || ""));
    }
    function spSet(map, label) {  // {item_id: size}
      let n = 0;
      document.querySelectorAll("#sp-table tbody tr").forEach(tr => {
        const v = map[tr.dataset.item];
        if (!v) return;
        const inp = tr.querySelector(".sp-val");
        inp.value = v;
        spRow(inp);
        n++;
      });
      document.getElementById("sp-msg").innerHTML = `${escapeHtml(label)}: filled <b>${n}</b> of ${sp.list.length} items.${n < sp.list.length ? " The rest kept what they had." : ""}`;
    }
    async function spFill(v) {
      document.getElementById("sp-del-preset").style.display = v.startsWith("preset:") ? "" : "none";
      const map = {};
      if (v === "suggested") {
        sp.list.forEach(r => { const sizes = [...new Set(r.lines.map(({ s, e }) => ((packSuggest[s.id] || {})[e.order_line_id] || {}).size).filter(Boolean))];
          if (sizes.length === 1) map[r.item_id] = sizes[0]; });
        spSet(map, "Pre-filled sizes");
      } else if (v === "default") {
        sp.list.forEach(r => { const d = (itemObj(r.item_id) || {}).default_pack_size; if (d) map[r.item_id] = d; });
        spSet(map, "Item defaults");
      } else if (v.startsWith("preset:")) {
        const p = presets.find(x => x.id === +v.slice(7));
        const byCode = Object.fromEntries(Object.entries(p.sizes).map(([c, n]) => [normCode(c), n]));
        sp.list.forEach(r => { const n = byCode[normCode(itemCode(r.item_id))]; if (n) map[r.item_id] = n; });
        spSet(map, `Preset “${p.name}”`);
      } else if (v.startsWith("ship:")) {
        const src = byId(+v.slice(5));
        const byItem = {};
        src.boxes.forEach(b => { const k = b.item_id; byItem[k] = Math.max(byItem[k] || 0, b.pack_size || b.quantity_in_box); });
        sp.list.forEach(r => { if (byItem[r.item_id]) map[r.item_id] = byItem[r.item_id]; });
        spSet(map, `Copied from ${src.code}`);
      }
    }
    function spClear() {
      document.querySelectorAll("#sp-table .sp-val").forEach(inp => { inp.value = ""; spRow(inp); });
      document.getElementById("sp-msg").textContent = "";
    }
    function spPaste() {
      const byCode = Object.fromEntries(sp.list.map(r => [normCode(itemCode(r.item_id)), r.item_id]));
      const map = {}, missing = [];
      document.getElementById("sp-paste").value.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach(row => {
        const cols = splitPasteRow(row), code = cols[0], size = cols[cols.length - 1];
        const n = parseInt(String(size || "").replace(/[^\d]/g, ""));
        if (!code || !n) return;  // header or blank
        const id = byCode[normCode(code)];
        if (id) map[id] = n; else missing.push(code);
      });
      spSet(map, "Pasted");
      if (missing.length) document.getElementById("sp-msg").insertAdjacentHTML("beforeend", ` <span class="neg">Not on these shipments: ${escapeHtml(missing.join(", "))}.</span>`);

          <p class="muted small">${Object.keys(vals).length} item sizes. A preset with the same name is replaced.</p>`,

    async function spDeletePreset() {

        buttons: [{ label: "Delete Preset", value: "go", cls: "danger" }, { label: "Cancel", value: null, cls: "secondary" }] });

    // ---- Process Selected: the bulk Process Shipment. Same steps (Pick -> Pack -> Ship, undo on each), applied to every
    // ticked shipment at once. Only opens on shipments from one stage tab; follows them while they move on together.
    let bp = null;  // { ids, step: pick | pack | ship, split: {stage: [shipments]} | null, msg }
    const BP_STEPS = [["pick", "Pick"], ["pack", "Pack"], ["ship", "Ship"]];
    const bpList = () => bp.ids.map(byId).filter(Boolean);
    function stageGroups(list) {
      const g = {};
      list.forEach(s => { const k = (stageOf(s) || {}).key || s.status; (g[k] = g[k] || []).push(s); });
      return g;
    }
    function stageLabel(k) { return (STAGES.find(x => x.key === k) || {}).label || k; }

    function openBulkProcess() {
      showError("");
      const chosen = selectedShipments().filter(inPlay);
      if (!chosen.length) { showError("Tick the shipments to process first."); return; }
      const groups = stageGroups(chosen), keys = Object.keys(groups);
      if (keys.length > 1 || !["pick", "pack", "ship"].includes(keys[0])) {
        showError(`Process Selected works on one stage at a time — the ticked shipments are in ${keys.map(k => `<b>${escapeHtml(stageLabel(k))}</b> (${groups[k].length})`).join(", ")}.
          Tick shipments from one tab.`);
        return;
      }
      bp = { ids: chosen.map(s => s.id), step: keys[0], split: null, msg: "", open: new Set(), stash: {} };
      let back = document.getElementById("bproc");
      if (!back) {
        back = document.createElement("div");
        back.className = "glass-back";
        back.id = "bproc";
        back.addEventListener("click", e => { if (e.target === back) closeBulk(); });
        document.body.appendChild(back);
        document.body.classList.add("glass-open");
      }
      renderBulk();
    }
    async function closeBulk(force = false) {
      if (!bp) return;
      if (!force && bp.dirty) {
        const { value } = await askDialog({ title: "Discard unsaved changes?", tone: "warn", body: "<p>The pack sizes / pallets you changed haven't been saved.</p>",
          buttons: [{ label: "Discard", value: "go", cls: "danger" }, { label: "Keep Editing", value: null, cls: "secondary" }] });
        if (value !== "go") return;
      }
      const back = document.getElementById("bproc");
      bp = null;
      sp = null;
      document.body.classList.remove("glass-open");
      if (back) { back.id = ""; back.classList.add("closing"); setTimeout(() => back.remove(), 180); }
      renderAll();
    }
    // one shipment needs something different: close this and open its own Process pop-up
    async function bulkOpenOne(id) {
      await closeBulk();
      if (!bp) openProcess(id);
    }

    // After every bulk step: follow the shipments. Same next stage -> carry on there; split -> say where each went.
    async function bulkAfter(msg) {
      await reloadList();
      if (!bp) return;
      const list = bpList().filter(inPlay);
      bp.ids = list.map(s => s.id);
      bp.dirty = false;
      bp.msg = msg || "";
      if (!list.length) { const m = bp.msg; await closeBulk(true); showResult(m, true); return; }
      const groups = stageGroups(list), keys = Object.keys(groups);
      if (keys.length === 1 && ["pick", "pack", "ship"].includes(keys[0])) { bp.step = keys[0]; bp.split = null; }
      else if (keys.length === 1) {  // all moved past shipping
        const m = bp.msg, ids = bp.ids;
        await closeBulk(true);
        selected.clear();
        ids.forEach(id => selected.add(id));
        setStage(keys[0], true);
        showResult(m, true);
        return;
      } else bp.split = groups;
      renderBulk();
    }
    function bulkContinue(stageKey) {
      bp.ids = bp.split[stageKey].map(s => s.id);
      bp.step = stageKey;
      bp.split = null;
      bp.msg = "";
      renderBulk();
    }

    // run one action per shipment; failures don't stop the rest
    async function bulkEach(list, action) {
      const ok = [], failed = [];
      for (const s of list) {
        try { await action(s); ok.push(s.code); } catch (e) { failed.push(`${s.code}: ${e.message}`); }
      }
      return `${ok.length ? `${ok.length} done` : "None done"}${failed.length ? ` · <span class="neg">${failed.map(escapeHtml).join("; ")}</span>` : ""}`;
    }

    // the shipments in the pop-up; click a row to show what's on it
    function bpRowsHtml(list) {

    function bpLinesHtml(s) {

    function bulkSplitHtml() {

    async function bpPick() {
      const err = document.getElementById("bp-error");

      const read = readPickInputs(document.getElementById("bp-body"), id => byId(id));
      if (read.error) { err.textContent = read.error; return; }
      if (!(await confirmShortPick(read.picks))) return;
      const units = shortUnits(read.picks), bySh = new Map(read.picks.map(p => [p.sh.id, p]));
      const msg = await bulkEach(read.picks.map(p => p.sh), s => savePick(bySh.get(s.id)));
      await bulkAfter(`Picked: ${msg}${units ? ` · ${fmtQty(units)} unbooked — back in stock, still open on the order` : ""}`);
      const waiting = bp ? bpList().filter(s => !s.packed_at && s.boxes.length) : [];
      if (bp && bp.step === "pack" && waiting.length) await askDialog({ title: "Re-check the packing", tone: "warn",
        body: `<p>${escapeHtml(waiting.map(s => s.code).join(", "))} ${waiting.length === 1 ? "was" : "were"} packed before going back a step. Check the sizes and pallets, then <b>Accept Packaging</b>.</p>`,
        buttons: [{ label: "Review Packing", value: "ok", cls: "confirm-btn" }] });
    }
    // Undo on many: unpick | unconfirm | unbook | unpack
    async function bpUndo(kind) {
      const list = bpList();
      const pick = { unpick: list.filter(hasPicks), unconfirm: list.filter(s => s.status === "ready" && !hasPicks(s)),
        unbook: list.filter(s => s.lines.some(l => l.quantity - (l.picked_quantity || 0) > 1e-9)), unpack: list.filter(s => s.packed_at || s.boxes.length) }[kind];
      const codes = pick.map(s => s.code);
      let ok;
      if (kind === "unpick") ok = await confirmUnpick(codes);
      else if (kind === "unconfirm") ok = await confirmUnconfirm(codes);
      else if (kind === "unpack") ok = await confirmUnpack(codes);
      else {
        const cancels = pick.filter(s => !hasPicks(s)).map(s => s.code);
        ok = (await askDialog({ title: `Unbook all on ${pick.length} shipment${pick.length === 1 ? "" : "s"}?`, tone: "warn",
          body: `<p>Every unpicked unit goes back to stock.${cancels.length ? ` Nothing is picked on <b>${escapeHtml(cancels.join(", "))}</b>, so ${cancels.length === 1 ? "it is" : "they are"} <b>cancelled</b>.` : ""}</p>`,
          buttons: [{ label: "Unbook All", value: "go", cls: "danger" }, { label: "Cancel", value: null, cls: "secondary" }] })).value === "go";
      }
      if (!ok) return;
      const action = { unpick: "unpick", unconfirm: "unconfirm-booking", unbook: "unbook-all", unpack: "unpack" }[kind];
      const label = { unpick: "Unpicked", unconfirm: "Bookings unconfirmed", unbook: "Unbooked", unpack: "Unpacked" }[kind];
      const msg = await bulkEach(pick, s => apiFetch(`/api/shipments/${s.id}/${action}`, { method: "POST" }));

    // ---- Pack: one grid of every item (sizes) + pallets per shipment; Accept Packaging accepts them all ----
    function spGridHtml(chosen) {

          </select></label>
          <a class="link small" id="sp-del-preset" style="display:none;" onclick="spDeletePreset()">Delete this preset</a>
          <span class="spacer"></span>
          <a class="link small" onclick="spSavePreset()">Save as preset…</a>

        </div>
        <details class="sp-paste" id="sp-paste-wrap">
          <summary class="link" style="cursor:pointer;">Paste pack sizes</summary>

          <textarea id="sp-paste" rows="4" placeholder="Item #   Pack size&#10;16713   50&#10;15420   100"></textarea>
          <div class="btn-row"><button type="button" class="secondary" onclick="spPaste()">Fill The Grid</button></div>
        </details>
        <table class="fit-table no-table-tools no-col-bands" id="sp-table">
          <thead><tr><th>Item</th><th class="grow">Description</th><th class="num">Ships</th><th class="num">Qty</th><th>Pack size</th><th>Boxes</th><th>Now</th></tr></thead>

    }
    // Pallets, shipment by shipment: a Pallet # at the end of every line (like one shipment), then each pallet's weight and

    const bpPalBlock = sid => document.querySelector(`#bp-pallets .bp-ship-pallets[data-sid="${sid}"]`);

          const v = Object.assign({ weight: saved.weight ?? "", dimensions: saved.dimensions ?? "" }, stash[pn] || {}, typed[pn] || {}, pending[pn] || {});

    async function init() {
      try { await loadAll(); } catch (e) {
        document.getElementById("shipments-container").innerHTML = `<div class="card error">Couldn't load shipments: ${escapeHtml(e.message)}</div>`;
      }
    }
    async function loadAll() {
      [shipments, orders, items, customers, lots, packHistory] = await Promise.all([
        apiFetch("/api/shipments/"),
        apiFetch("/api/customer-orders/"),
        apiFetch("/api/stock-items/"),
        apiFetch("/api/customers/"),
        apiFetch("/api/lots/"),
        // History is optional: a missing endpoint shouldn't leave the screen empty.
        apiFetch("/api/stock-items/pack-sizes/history").catch(() => []),
      ]);
      await Promise.all([refreshPackSuggestions(), loadPackRule(), loadPresets()]);
      fillCustomerFilter();
      loadPrefs();
      // where to start: ?stage=, a linked shipment's stage, the last stage used, else the first with work in it
      const params = new URLSearchParams(location.search), id = parseInt(params.get("id"));
      let saved = null;
      try { saved = localStorage.getItem("batch_stage"); } catch {}
      const count = k => shipments.filter(s => inPlay(s) && STAGES.find(x => x.key === k).test(s)).length;
      stage = (STAGES.some(x => x.key === params.get("stage")) && params.get("stage"))
        || (id && byId(id) && (stageOf(byId(id)) || {}).key)
        || (STAGES.some(x => x.key === saved) && saved)
        || ["pick", "pack", "ship"].find(count) || "ship";
      if (id && byId(id)) openCards.add(id);
      renderAll();
      let area = params.get("area");
      try { area = area || localStorage.getItem("bulk_area"); } catch {}
      if ((area === "invoices" || !AuthGuard.can("shipments.work")) && AuthGuard.can("invoices")) setArea("invoices");
    }

    document.getElementById("search").addEventListener("input", renderAll);
    document.getElementById("select-all").addEventListener("change", e => {
      visibleShipments().forEach(s => e.target.checked ? selected.add(s.id) : selected.delete(s.id));
      document.querySelectorAll(".ship-card").forEach(c => {
        const on = selected.has(parseInt(c.dataset.shipment));
        c.classList.toggle("selected", on);
        c.querySelector(".ship-select").checked = on;
      });
      updateSelectionUi();
    });
    init();
  </script>
  </div>
</body>
</html>
