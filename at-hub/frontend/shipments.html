<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AT-HUB — Shipments</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth-guard.js"></script>
  <script src="shipment-detail.js"></script>
</head>
<body>
  <div class="app-shell">
  <div id="sidebar"></div>
  <main>
    <div class="tabs" id="ship-tabs">
      <a class="tab active" data-tab="active">Active</a>
      <a class="tab" data-tab="cancelled">Cancelled <span id="cancelled-count" class="muted"></span></a>
      <span style="flex:1;"></span>
      <button class="secondary small-btn" style="margin-bottom:6px;" onclick="openPackSizeManager()">Pack Sizes</button>
    </div>
    <div class="card">
      <div class="row" style="align-items:center;">
        <input type="text" id="search" placeholder="Search shipment, order, customer, PO #, job #, item, carrier or tracking #...">
        <span class="period-filter" title="Only records whose date falls in this period"><select id="sh-by" class="period-by" title="Which date the period looks at" onchange="PeriodFilters.redraw()"><option value="shipped">Ship Date</option><option value="created">Created</option><option value="delivered">Delivered</option></select><span id="sh-period-slot"></span></span>
        <select id="status-filter" style="max-width:200px;">
          <option value="">All statuses</option>
          <option value="open">Open (new + ready)</option>
          <option value="new">New (booked)</option>
          <option value="ready">Ready (picking)</option>
          <option value="shipped">Shipped (not delivered)</option>
          <option value="delivered">Delivered</option>
          <option value="invoiced">Invoiced</option>
        </select>
      </div>
    </div>
    <div class="card">
      <table class="list-fit" id="shipments-table">
        <thead><tr><th>Code</th><th>Order</th><th>PO #</th><th>Created</th><th>Ship date</th><th>Delivered</th><th>Picked</th><th>Carrier</th><th>Tracking</th><th>POD</th><th>Status</th></tr></thead>
        <tbody id="shipments-body"><tr><td colspan="11">Loading...</td></tr></tbody>
      </table>
    </div>

    <div class="card" id="detail-card" style="display:none;"></div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => PeriodFilters.mount("sh", "renderShipments()"));
    AuthGuard.requirePerm("shipments.view");
    document.getElementById("sidebar").innerHTML = renderSidebar("shipments.html");

    let shipments = [];
    let orders = [];
    let items = [];
    let customers = [];
    let lots = [];
    let shipmentsById = {};
    let currentShipmentId = null;
    let currentTab = "active";

    function matchesSearch(s, q) {
      const o = order(s.order_id) || {};
      return searchMatch(q, s.code, o.code, o.po_number, o.job_number, customerName(o.customer_id), s.carrier, s.tracking_number,
        s.lines.map(l => itemCode(l.item_id)));
    }

    function renderShipments() {
      const tbody = document.getElementById("shipments-body");
      const q = document.getElementById("search").value.trim();
      const statusFilter = document.getElementById("status-filter").value;
      const cancelledTab = currentTab === "cancelled";
      document.getElementById("status-filter").style.display = cancelledTab ? "none" : "";
      const nCancelled = shipments.filter(s => s.status === "cancelled").length;
      document.getElementById("cancelled-count").textContent = nCancelled ? `(${nCancelled})` : "";
      const filtered = shipments.filter(s => matchesSearch(s, q) && PeriodFilters.ok("sh", { shipped: s.ship_date, created: s.created_at, delivered: s.delivered_at }) && (s.status === "cancelled") === cancelledTab && (
        cancelledTab || !statusFilter || (statusFilter === "open" ? ["new", "ready"].includes(s.status) : s.status === statusFilter)
      ));
      // work waiting on the floor first: ready, then new, then everything that has left
      const rank = { ready: 0, new: 1, shipped: 2, delivered: 3, invoiced: 4 };
      filtered.sort((a, b) => (rank[a.status] ?? 5) - (rank[b.status] ?? 5) || b.id - a.id);
      if (!filtered.length) {
        tbody.innerHTML = `<tr><td colspan="11" class="muted">${shipments.length ? (cancelledTab ? "No cancelled shipments." : "No shipments match this search/filter.") : "No shipments yet — create one from a customer order."}</td></tr>`;
        return;
      }
      tbody.innerHTML = filtered.map(s => `
        <tr class="${s.invoice_combined ? "row-combined" : ""}">
          <td class="nowrap">${shBulk.box(s)}<a class="link" onclick="showDetail(${s.id})">${s.code}</a></td>
          <td><a class="link" href="customer-orders.html?id=${s.order_id}">${escapeHtml(orderCode(s.order_id))}</a></td>
          <td>${(order(s.order_id) || {}).po_number ? `<a class="link" href="customer-orders.html?id=${s.order_id}" title="Open the order">${escapeHtml(order(s.order_id).po_number)}</a>` : ""}</td>
          <td>${fmtDate(s.created_at)}</td>
          <td>${fmtDate(s.ship_date)}</td>
          <td>${s.delivered_at ? deliveredDateHtml(s) : ""}</td>
          <td>${pickedSummary(s)}</td>
          <td>${escapeHtml(s.carrier || "")}</td>
          <td>${trackingLink(s.carrier, s.tracking_number)}</td>
          <td class="nowrap">${podCellHtml(s)}</td>
          <td class="nowrap">${shipmentStatusHtml(s)}</td>
        </tr>
      `).join("");
      limitRows(tbody, "shipments", renderShipments);
    }

    function pickedSummary(shipment) {
      const qty = shipment.lines.reduce((sum, l) => sum + l.quantity, 0);
      const picked = shipment.lines.reduce((sum, l) => sum + l.picked_quantity, 0);
      return `${picked} / ${qty}`;
    }

    // tick several shipments: Cancel / Delete them together (the same rules as one at a time)
    const shBulk = makeBulkPick({ name: "shBulk", table: "#shipments-table", word: "shipment", records: () => shipments, redraw: () => renderShipments(), reload: () => reloadList(),
      actions: () => [
        ...(AuthGuard.can("shipments.work") ? [{ label: n => `Cancel ${n} Shipment${n === 1 ? "" : "s"}`, cls: "danger", verb: "cancelled",
          pick: l => l.filter(s => ["new", "ready"].includes(s.status)), note: "Only shipments that haven't left can be cancelled; their booked stock is freed.",
          run: s => apiFetch(`/api/shipments/${s.id}/cancel`, { method: "POST" }) }] : []),
        ...(AuthGuard.can("shipments.undo") ? [{ label: n => `Delete ${n} Cancelled Shipment${n === 1 ? "" : "s"}`, cls: "danger", verb: "deleted",
          pick: l => l.filter(s => s.status === "cancelled"), note: "They go to the Recycle Bin, where they can be restored.",
          run: s => apiFetch(`/api/shipments/${s.id}`, { method: "DELETE" }) }] : []),
      ] });
    const renderShipmentsOnly = renderShipments;
    renderShipments = function () { renderShipmentsOnly(); shBulk.paint(); };
    async function reloadList() {
      shipments = await apiFetch("/api/shipments/");
      renderShipments();
    }

    async function init() {
      [shipments, orders, items, customers, lots] = await Promise.all([
        apiFetch("/api/shipments/"),
        apiFetch("/api/customer-orders/"),
        apiFetch("/api/stock-items/"),
        apiFetch("/api/customers/"),
        apiFetch("/api/lots/"),
      ]);
      document.getElementById("search").addEventListener("input", renderShipments);
      document.getElementById("status-filter").addEventListener("change", renderShipments);
      document.querySelectorAll("#ship-tabs .tab").forEach(t => t.addEventListener("click", () => {
        currentTab = t.dataset.tab;
        document.querySelectorAll("#ship-tabs .tab").forEach(x => x.classList.toggle("active", x === t));
        renderShipments();
      }));
      renderShipments();
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      if (id) showDetail(parseInt(id));
    }
    init();
  </script>
  </div>
</body>
</html>
