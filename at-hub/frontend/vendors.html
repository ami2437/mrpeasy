<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AT-HUB — Vendors</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth-guard.js"></script>
  <script src="contact-card.js"></script>
</head>
<body>
  <div class="app-shell">
  <div id="sidebar"></div>
  <main>
    <div class="card page-toolbar">
      <h1 class="page-title">Vendors</h1>
      <div class="row toolbar-row">
        <button class="secondary" onclick="ContactCards.exportCsv()">Export CSV</button>
        <button class="secondary" onclick="openImport('vendors', () => ContactCards.load())">Import CSV</button>
        <button onclick="ContactCards.create()">+ New Vendor</button>
      </div>
    </div>
    <div id="contacts"></div>
  </main>

  <script>
    AuthGuard.requireRole("manager");
    document.getElementById("sidebar").innerHTML = renderSidebar("vendors.html");
    document.getElementById("contacts").innerHTML = contactCardShell("+ New Vendor");

    let orders = [];
    function fmtDate(d) { return d ? new Date(d).toLocaleDateString() : ""; }

    ContactCards.init({
      endpoint: "/api/vendors/",
      labels: {
        phones: ["work", "main", "sales", "mobile", "shipping", "accounts receivable", "fax", "other"],
        emails: ["work", "purchasing / orders", "sales", "accounts receivable", "quality / MTRs", "shipping", "other"],
        addresses: ["billing", "remit to", "ship from", "pickup", "warehouse", "other"],
        websites: ["website", "customer portal", "other"],
        roles: ["sales rep", "inside sales", "accounts receivable", "shipping", "quality", "owner"],
      },
      hints: {
        emails: 'label one "purchasing / orders" to send our POs there',
        addresses: '"billing" is printed on POs; "ship from" / "pickup" = where goods leave from',
        phones: "the first one is printed on POs",
      },
      newDraft: () => ({ tags: [], phones: [{ label: "work", value: "" }], emails: [{ label: "purchasing / orders", value: "" }],
        addresses: [{ label: "billing", value: "" }], websites: [], people: [{ name: "", role: "sales rep", phone: "", email: "" }], notes: "" }),
      usedFor(v, key, r, i) {
        const n = [];
        if (key === "emails" && r.value === v.po_email) n.push("POs go here");
        if (key === "addresses" && r.value === v.address) n.push("on POs");
        if (key === "addresses" && r.value === v.shipping_address) n.push("ship-from");
        if ((key === "phones" || key === "emails") && i === 0) n.push("main");
        return n;
      },
      loadExtra: async () => { orders = await apiFetch("/api/purchase-orders/"); },
      headExtra: v => v.code ? `<div style="margin-bottom:8px;"><span class="tag draft">${escapeHtml(v.code)}</span></div>` : "",
      quickExtra: v => `<a href="purchase-orders.html?new=${v.id}"><b>＋</b>PO</a>`,
      body(v) {
        const mine = orders.filter(o => o.vendor_id === v.id).sort((a, b) => b.id - a.id);
        const open = mine.filter(o => !["received", "cancelled"].includes(o.status));
        return `
          <div class="stats">
            <div><strong>${mine.length}</strong><span>purchase orders</span></div>
            <div><strong>${open.length}</strong><span>open now</span></div>
            <div><strong>${fmtMoney(mine.filter(o => o.status !== "cancelled").reduce((s, o) => s + o.order_total, 0))}</strong><span>total spend</span></div>
            <div><strong>${mine[0] ? fmtDate(mine[0].order_date) : "—"}</strong><span>last PO</span></div>
          </div>
          <h4 style="margin-top:20px;">Part # Mapping (Our Item ↔ Vendor Part #)</h4>
          <p class="muted small" style="margin-top:0;">What ${escapeHtml(v.name)} calls our items. Learned automatically from every PO line with a vendor part #.
            On a new PO for this vendor, picking our item fills in their part #, description and last cost; typing their part # picks our item.</p>
          <div id="xref"></div>
          <h4 style="margin-top:20px;">Purchase orders</h4>
          ${mine.length ? `<div class="table-scroll"><table>
            <thead><tr><th>Code</th><th>Date</th><th>Status</th><th class="num sum">Total</th></tr></thead>
            <tbody>${mine.map(o => `<tr><td><a class="link" href="purchase-orders.html?id=${o.id}">${escapeHtml(o.code)}</a></td><td>${fmtDate(o.order_date)}</td>
              <td><span class="tag ${o.status}">${o.status.replace("_", " ")}</span></td><td class="num">${fmtMoney(o.order_total)}</td></tr>`).join("")}</tbody>
          </table></div>` : `<p class="muted">No purchase orders yet.</p>`}`;
      },
      afterRender: v => renderXref(v.id),
    });

    async function renderXref(vendorId) {
      const el = document.getElementById("xref");
      const [mappings, items] = await Promise.all([apiFetch(`/api/vendors/${vendorId}/items`), allItems()]);
      const byId = Object.fromEntries(items.map(i => [i.id, i]));
      el.innerHTML = `
        <table class="compact-table no-table-tools" style="max-width:860px;">
          <thead><tr><th>Our Item</th><th>Vendor Part #</th><th>Vendor Description</th><th class="num">Last Cost</th><th>Last Ordered</th><th></th></tr></thead>
          <tbody>
            ${mappings.map(m => {
              const it = byId[m.item_id] || {};
              return `<tr>
                <td><strong>${escapeHtml(it.code || m.item_id)}</strong> ${groupTag(it)} <div class="muted small">${escapeHtml(it.title || "")}</div></td>
                <td><strong>${escapeHtml(m.vendor_item_code)}</strong></td>
                <td>${escapeHtml(m.vendor_description || "")}</td>
                <td class="num">${m.last_unit_cost != null ? fmtPrice(m.last_unit_cost) : ""}</td>
                <td>${m.last_ordered_at ? new Date(m.last_ordered_at).toLocaleDateString() : ""}</td>
                <td class="line-actions">${trashBtn(`deleteXref(${vendorId}, ${m.id})`, "Remove this cross-reference")}</td>
              </tr>`;
            }).join("") || `<tr><td colspan="6" class="muted">No Part # Mappings Yet.</td></tr>`}
            <tr>
              <td style="min-width:240px;"><select id="xref-item" data-searchable><option value="">— pick an item —</option>${items.map(i => `<option value="${i.id}" ${itemPickAttr(i)} data-search="${escapeHtml([i.category, i.barcode].filter(Boolean).join(" "))}">${escapeHtml(i.code)} — ${escapeHtml(i.title)}${itemPickNote(i)}</option>`).join("")}</select></td>
              <td><input type="text" id="xref-code" placeholder="Vendor Part #" style="width:120px;"></td>
              <td><input type="text" id="xref-desc" placeholder="Optional"></td>
              <td colspan="3"><button class="secondary small-btn" onclick="addXref(${vendorId})">+ Add</button></td>
            </tr>
          </tbody>
        </table>
        <div id="xref-error" class="error"></div>`;
    }

    let itemsPromise = null;
    function allItems() {
      if (!itemsPromise) itemsPromise = apiFetch("/api/stock-items/");
      return itemsPromise;
    }

    async function addXref(vendorId) {
      const errorEl = document.getElementById("xref-error");
      errorEl.textContent = "";
      if (!document.getElementById("xref-item").value) { errorEl.textContent = "Pick our item first."; return; }
      try {
        await apiFetch(`/api/vendors/${vendorId}/items`, {
          method: "POST",
          body: JSON.stringify({
            item_id: parseInt(document.getElementById("xref-item").value),
            vendor_item_code: document.getElementById("xref-code").value,
            vendor_description: document.getElementById("xref-desc").value || null,
          }),
        });
        renderXref(vendorId);
      } catch (err) {
        errorEl.textContent = err.message;
      }
    }

    async function deleteXref(vendorId, id) {
      if (!confirm("Remove this cross-reference?")) return;
      try {
        await apiFetch(`/api/vendors/${vendorId}/items/${id}`, { method: "DELETE" });
        renderXref(vendorId);
      } catch (err) {
        document.getElementById("xref-error").textContent = err.message;
      }
    }
  </script>
  </div>
</body>
</html>
