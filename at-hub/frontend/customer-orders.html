<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AT-HUB — Customer Orders</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth-guard.js"></script>
</head>
<body>
  <div class="app-shell">
  <div id="sidebar"></div>
  <main>
    <div class="card">
      <div class="row" style="align-items:center;">
        <div></div>
        <button onclick="toggleForm()">+ New Order</button>
      </div>
    </div>

    <div class="card" id="form-card" style="display:none;">
      <h3>New Customer Order</h3>
      <div class="row">
        <div><label>Customer</label><select id="f-customer"></select></div>
        <div><label>Delivery date</label><input type="date" id="f-delivery"></div>
      </div>
      <div class="row">
        <div><label>PO number</label><input type="text" id="f-po-number" placeholder="customer's PO #"></div>
        <div><label>Job number</label><input type="text" id="f-job-number"></div>
      </div>
      <label>Notes</label><textarea id="f-notes" rows="2"></textarea>
      <h4>Lines</h4>
      <table class="lines-table">
        <thead><tr><th>Item</th><th>Qty</th><th>Unit price</th><th>Delivery date</th><th></th></tr></thead>
        <tbody id="lines-body"></tbody>
      </table>
      <button class="secondary" onclick="addLine()" style="margin-top:8px;">+ Add line</button>
      <div style="margin-top:14px;">
        <button onclick="saveOrder()">Create Order</button>
        <button class="secondary" onclick="toggleForm(false)">Cancel</button>
      </div>
      <div id="form-error" class="error"></div>
    </div>

    <div class="card">
      <table>
        <thead><tr><th>Code</th><th>Customer</th><th>Order date</th><th>Delivery</th><th>Status</th><th>Activity</th><th></th></tr></thead>
        <tbody id="orders-body"><tr><td colspan="7">Loading...</td></tr></tbody>
      </table>
    </div>

    <div class="card" id="detail-card" style="display:none;"></div>
  </main>

  <script>
    AuthGuard.requireLogin();
    document.getElementById("sidebar").innerHTML = renderSidebar("customer-orders.html");

    let customers = [];
    let items = [];
    let orders = [];
    let shipments = [];
    let invoices = [];

    function fmtDate(d) { return d ? new Date(d).toLocaleDateString() : ""; }

    function toggleForm(show = true) {
      document.getElementById("form-card").style.display = show ? "block" : "none";
      if (show) {
        document.getElementById("lines-body").innerHTML = "";
        addLine();
      }
    }

    function addLine() {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><select class="l-item">${items.map(i => `<option value="${i.id}" data-price="${i.selling_price || 0}">${i.code} — ${i.title}</option>`).join("")}</select></td>
        <td><input type="number" step="0.01" class="l-qty" value="1"></td>
        <td><input type="number" step="0.01" class="l-price" value="0"></td>
        <td><input type="date" class="l-delivery"></td>
        <td><a class="link" onclick="this.closest('tr').remove()">Remove</a></td>
      `;
      tr.querySelector(".l-item").addEventListener("change", (e) => {
        const price = e.target.selectedOptions[0].dataset.price;
        tr.querySelector(".l-price").value = price;
      });
      const firstOption = tr.querySelector(".l-item").selectedOptions[0];
      if (firstOption) tr.querySelector(".l-price").value = firstOption.dataset.price;
      document.getElementById("lines-body").appendChild(tr);
    }

    async function saveOrder() {
      const errorEl = document.getElementById("form-error");
      errorEl.textContent = "";
      const lines = Array.from(document.querySelectorAll("#lines-body tr")).map(tr => ({
        item_id: parseInt(tr.querySelector(".l-item").value),
        quantity: parseFloat(tr.querySelector(".l-qty").value) || 0,
        unit_price: parseFloat(tr.querySelector(".l-price").value) || 0,
        delivery_date: tr.querySelector(".l-delivery").value || null,
      }));
      try {
        await apiFetch("/api/customer-orders/", {
          method: "POST",
          body: JSON.stringify({
            customer_id: parseInt(document.getElementById("f-customer").value),
            delivery_date: document.getElementById("f-delivery").value || null,
            po_number: document.getElementById("f-po-number").value || null,
            job_number: document.getElementById("f-job-number").value || null,
            notes: document.getElementById("f-notes").value,
            lines,
          }),
        });
        toggleForm(false);
        loadOrders();
      } catch (err) {
        errorEl.textContent = err.message;
      }
    }

    function customerName(id) {
      const c = customers.find(c => c.id === id);
      return c ? c.name : id;
    }

    function renderOrders() {
      const tbody = document.getElementById("orders-body");
      if (!orders.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="muted">No orders yet.</td></tr>`;
        return;
      }
      tbody.innerHTML = orders.map(o => {
        const shipCount = shipments.filter(s => s.order_id === o.id).length;
        const invCount = invoices.filter(i => i.order_id === o.id).length;
        return `
        <tr>
          <td><a class="link" onclick="showDetail(${o.id})">${o.code}</a></td>
          <td>${customerName(o.customer_id)}</td>
          <td>${fmtDate(o.order_date)}</td>
          <td>${fmtDate(o.delivery_date)}</td>
          <td><span class="tag ${o.status}">${o.status}</span></td>
          <td class="muted">${shipCount} shipment${shipCount === 1 ? "" : "s"}, ${invCount} invoice${invCount === 1 ? "" : "s"}</td>
          <td>${o.status === "draft" ? `<a class="link" onclick="confirmOrder(${o.id})">Confirm</a>` : ""}</td>
        </tr>
      `;
      }).join("");
    }

    async function confirmOrder(id) {
      try {
        await apiFetch(`/api/customer-orders/${id}/confirm`, { method: "POST" });
        loadOrders();
      } catch (err) { alert(err.message); }
    }

    function itemLabel(id) {
      const i = items.find(i => i.id === id);
      return i ? `${i.code} — ${i.title}` : id;
    }

    async function showDetail(id) {
      const order = await apiFetch(`/api/customer-orders/${id}`);
      const card = document.getElementById("detail-card");
      card.style.display = "block";
      const canShip = !["shipped", "invoiced", "cancelled"].includes(order.status);
      const editable = order.status !== "cancelled";
      const canCancel = order.status !== "cancelled" && order.lines.every(l => l.shipped_quantity === 0);
      const orderShipments = shipments.filter(s => s.order_id === order.id);
      const orderInvoices = invoices.filter(i => i.order_id === order.id);

      card.innerHTML = `
        <h3>${order.code} <span class="tag ${order.status}">${order.status}</span></h3>

        <h4>Order details</h4>
        <div class="row">
          <div><label>Customer</label><select id="e-customer" ${editable ? "" : "disabled"}>
            ${customers.map(c => `<option value="${c.id}" ${c.id === order.customer_id ? "selected" : ""}>${c.name}</option>`).join("")}
          </select></div>
          <div><label>Delivery date</label><input type="date" id="e-delivery" value="${order.delivery_date ? order.delivery_date.substring(0,10) : ''}" ${editable ? "" : "disabled"}></div>
        </div>
        <div class="row">
          <div><label>PO number</label><input type="text" id="e-po-number" value="${order.po_number || ''}" ${editable ? "" : "disabled"}></div>
          <div><label>Job number</label><input type="text" id="e-job-number" value="${order.job_number || ''}" ${editable ? "" : "disabled"}></div>
        </div>
        <label>Notes</label><textarea id="e-notes" rows="2" ${editable ? "" : "disabled"}>${order.notes || ''}</textarea>
        ${editable ? `<button onclick="saveOrderHeader(${order.id})" style="margin-top:8px;">Save Order Details</button>` : ""}

        <h4 style="margin-top:20px;">Lines</h4>
        <table class="lines-table">
          <thead><tr><th>Item</th><th>Qty</th><th>Shipped</th><th>Unit price</th><th>Delivery</th>${editable ? "<th></th>" : ""}${canShip ? "<th>Ship now</th>" : ""}</tr></thead>
          <tbody>
            ${order.lines.map(l => `
              <tr data-line="${l.id}">
                <td>${itemLabel(l.item_id)}</td>
                <td>${editable && l.shipped_quantity === 0 ? `<input type="number" step="0.01" class="e-line-qty" value="${l.quantity}" style="width:80px;">` : l.quantity}</td>
                <td>${l.shipped_quantity}</td>
                <td>${editable ? `<input type="number" step="0.01" class="e-line-price" value="${l.unit_price}" style="width:80px;">` : l.unit_price.toFixed(2)}</td>
                <td>${editable ? `<input type="date" class="e-line-delivery" value="${l.delivery_date ? l.delivery_date.substring(0,10) : ''}" style="width:140px;">` : fmtDate(l.delivery_date)}</td>
                ${editable ? `<td>
                  <a class="link" onclick="saveLine(${order.id}, ${l.id})">Save</a>
                  ${l.shipped_quantity === 0 ? ` &nbsp; <a class="link" onclick="removeLine(${order.id}, ${l.id})">Remove</a>` : ""}
                </td>` : ""}
                ${canShip ? `<td><input type="number" step="0.01" class="ship-qty" data-line="${l.id}" value="${(l.quantity - l.shipped_quantity).toFixed(2)}" style="width:90px;"></td>` : ""}
              </tr>
            `).join("")}
          </tbody>
        </table>
        ${editable ? `
          <div class="row" style="margin-top:8px; max-width:600px;">
            <div><label>Add item</label><select id="new-line-item">${items.map(i => `<option value="${i.id}" data-price="${i.selling_price || 0}">${i.code} — ${i.title}</option>`).join("")}</select></div>
            <div><label>Qty</label><input type="number" step="0.01" id="new-line-qty" value="1"></div>
            <div><label>Unit price</label><input type="number" step="0.01" id="new-line-price" value="0"></div>
            <div style="flex:0;"><button class="secondary" onclick="addLineToOrder(${order.id})">+ Add line</button></div>
          </div>
        ` : ""}
        <div id="lines-error" class="error"></div>

        ${canShip ? `
          <h4 style="margin-top:20px;">Ship</h4>
          <div class="row" style="max-width:400px;">
            <div><label>Carrier</label><input type="text" id="ship-carrier"></div>
            <div><label>Tracking number</label><input type="text" id="ship-tracking"></div>
          </div>
          <button onclick="shipOrder(${order.id})" style="margin-top:8px;">Ship entered quantities</button>
        ` : ""}
        <div id="detail-error" class="error"></div>

        <h4 style="margin-top:20px;">Shipments (${orderShipments.length})</h4>
        ${orderShipments.length ? `
          <table>
            <thead><tr><th>Code</th><th>Ship date</th><th>Status</th></tr></thead>
            <tbody>${orderShipments.map(s => `
              <tr><td><a class="link" href="shipments.html?id=${s.id}">${s.code}</a></td><td>${fmtDate(s.ship_date)}</td><td><span class="tag ${s.status}">${s.status}</span></td></tr>
            `).join("")}</tbody>
          </table>
        ` : `<p class="muted">None yet.</p>`}

        <h4 style="margin-top:20px;">Invoices (${orderInvoices.length})</h4>
        ${orderInvoices.length ? `
          <table>
            <thead><tr><th>Code</th><th>Date</th><th>Status</th></tr></thead>
            <tbody>${orderInvoices.map(i => `
              <tr><td><a class="link" href="invoices.html?id=${i.id}">${i.code}</a></td><td>${fmtDate(i.invoice_date)}</td><td><span class="tag ${i.status === 'paid' ? 'shipped' : i.status === 'void' ? 'cancelled' : i.status === 'sent' ? 'confirmed' : 'draft'}">${i.status}</span></td></tr>
            `).join("")}</tbody>
          </table>
        ` : `<p class="muted">None yet.</p>`}

        <div style="margin-top:16px;">
          ${canCancel ? `<button class="danger" onclick="cancelOrder(${order.id})">Cancel Order</button>` : ""}
          <button class="secondary" onclick="document.getElementById('detail-card').style.display='none';">Close</button>
        </div>
      `;
    }

    async function saveOrderHeader(orderId) {
      const errorEl = document.getElementById("detail-error");
      errorEl.textContent = "";
      try {
        await apiFetch(`/api/customer-orders/${orderId}`, {
          method: "PUT",
          body: JSON.stringify({
            customer_id: parseInt(document.getElementById("e-customer").value),
            delivery_date: document.getElementById("e-delivery").value || null,
            po_number: document.getElementById("e-po-number").value || null,
            job_number: document.getElementById("e-job-number").value || null,
            notes: document.getElementById("e-notes").value,
          }),
        });
        loadOrders();
        showDetail(orderId);
      } catch (err) {
        errorEl.textContent = err.message;
      }
    }

    async function saveLine(orderId, lineId) {
      const errorEl = document.getElementById("lines-error");
      errorEl.textContent = "";
      const row = document.querySelector(`tr[data-line="${lineId}"]`);
      const qtyInput = row.querySelector(".e-line-qty");
      try {
        await apiFetch(`/api/customer-orders/${orderId}/lines/${lineId}`, {
          method: "PUT",
          body: JSON.stringify({
            quantity: qtyInput ? parseFloat(qtyInput.value) || 0 : undefined,
            unit_price: parseFloat(row.querySelector(".e-line-price").value) || 0,
            delivery_date: row.querySelector(".e-line-delivery").value || null,
          }),
        });
        loadOrders();
        showDetail(orderId);
      } catch (err) {
        errorEl.textContent = err.message;
      }
    }

    async function removeLine(orderId, lineId) {
      const errorEl = document.getElementById("lines-error");
      errorEl.textContent = "";
      try {
        await apiFetch(`/api/customer-orders/${orderId}/lines/${lineId}`, { method: "DELETE" });
        loadOrders();
        showDetail(orderId);
      } catch (err) {
        errorEl.textContent = err.message;
      }
    }

    async function addLineToOrder(orderId) {
      const errorEl = document.getElementById("lines-error");
      errorEl.textContent = "";
      try {
        await apiFetch(`/api/customer-orders/${orderId}/lines`, {
          method: "POST",
          body: JSON.stringify({
            item_id: parseInt(document.getElementById("new-line-item").value),
            quantity: parseFloat(document.getElementById("new-line-qty").value) || 0,
            unit_price: parseFloat(document.getElementById("new-line-price").value) || 0,
          }),
        });
        loadOrders();
        showDetail(orderId);
      } catch (err) {
        errorEl.textContent = err.message;
      }
    }

    async function cancelOrder(orderId) {
      if (!confirm("Cancel this order? This cannot be undone.")) return;
      try {
        await apiFetch(`/api/customer-orders/${orderId}/cancel`, { method: "POST" });
        loadOrders();
        showDetail(orderId);
      } catch (err) {
        alert(err.message);
      }
    }

    async function shipOrder(orderId) {
      const errorEl = document.getElementById("detail-error");
      errorEl.textContent = "";
      const lines = Array.from(document.querySelectorAll(".ship-qty"))
        .map(el => ({ line_id: parseInt(el.dataset.line), quantity: parseFloat(el.value) || 0 }))
        .filter(l => l.quantity > 0);
      try {
        const shipment = await apiFetch(`/api/customer-orders/${orderId}/ship`, {
          method: "POST",
          body: JSON.stringify({
            lines,
            carrier: document.getElementById("ship-carrier").value || null,
            tracking_number: document.getElementById("ship-tracking").value || null,
          }),
        });
        loadOrders();
        showDetail(orderId);
        window.location.href = `shipments.html?id=${shipment.id}`;
      } catch (err) {
        errorEl.textContent = err.message;
      }
    }

    async function loadOrders() {
      orders = await apiFetch("/api/customer-orders/");
      renderOrders();
    }

    async function init() {
      [customers, items, shipments, invoices] = await Promise.all([
        apiFetch("/api/customers/"),
        apiFetch("/api/stock-items/"),
        apiFetch("/api/shipments/"),
        apiFetch("/api/invoices/"),
      ]);
      document.getElementById("f-customer").innerHTML = customers.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
      await loadOrders();
    }
    init();
  </script>
  </div>
</body>
</html>
