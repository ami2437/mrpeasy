<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AT-HUB — Stock Items</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth-guard.js"></script>
</head>
<body>
  <div class="app-shell">
  <div id="sidebar"></div>
  <main>
    <div class="card">
      <div class="row" style="align-items:center;">
        <input type="text" id="search" placeholder="Search code or title...">
        <label style="margin:0;"><input type="checkbox" id="low-stock-only" style="width:auto;display:inline-block;"> Low stock only</label>
        <button onclick="toggleForm()">+ New Item</button>
      </div>
    </div>

    <div class="card" id="item-form-card" style="display:none;">
      <h3 id="form-title">New Stock Item</h3>
      <input type="hidden" id="edit-id">
      <div class="row">
        <div><label>Code</label><input type="text" id="f-code"></div>
        <div><label>Title</label><input type="text" id="f-title"></div>
        <div><label>Unit</label><input type="text" id="f-unit" placeholder="ea, kg, ..."></div>
      </div>
      <div class="row">
        <div><label>Cost price</label><input type="number" step="0.01" id="f-cost"></div>
        <div><label>Selling price</label><input type="number" step="0.01" id="f-sell"></div>
        <div><label>Reorder point</label><input type="number" step="0.01" id="f-reorder"></div>
      </div>
      <div style="margin-top:14px;">
        <button onclick="saveItem()">Save</button>
        <button class="secondary" onclick="toggleForm(false)">Cancel</button>
      </div>
      <div id="form-error" class="error"></div>
    </div>

    <div class="card">
      <table>
        <thead><tr><th>Code</th><th>Title</th><th>Unit</th><th>On hand</th><th>Cost</th><th>Selling</th><th>Reorder pt</th><th></th></tr></thead>
        <tbody id="items-body"><tr><td colspan="8">Loading...</td></tr></tbody>
      </table>
    </div>
  </main>

  <script>
    AuthGuard.requireLogin();
    document.getElementById("sidebar").innerHTML = renderSidebar("stock-items.html");

    let items = [];

    function toggleForm(show = true) {
      document.getElementById("item-form-card").style.display = show ? "block" : "none";
      if (!show) {
        document.getElementById("edit-id").value = "";
        document.getElementById("form-title").textContent = "New Stock Item";
        ["code", "title", "unit", "cost", "sell", "reorder"].forEach(f => document.getElementById(`f-${f}`).value = "");
      }
    }

    function editItem(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      toggleForm(true);
      document.getElementById("form-title").textContent = `Edit ${item.code}`;
      document.getElementById("edit-id").value = item.id;
      document.getElementById("f-code").value = item.code;
      document.getElementById("f-code").disabled = true;
      document.getElementById("f-title").value = item.title;
      document.getElementById("f-unit").value = item.unit || "";
      document.getElementById("f-cost").value = item.cost_price ?? "";
      document.getElementById("f-sell").value = item.selling_price ?? "";
      document.getElementById("f-reorder").value = item.reorder_point ?? "";
    }

    async function saveItem() {
      const errorEl = document.getElementById("form-error");
      errorEl.textContent = "";
      const id = document.getElementById("edit-id").value;
      try {
        if (id) {
          await apiFetch(`/api/stock-items/${id}`, {
            method: "PUT",
            body: JSON.stringify({
              title: document.getElementById("f-title").value,
              unit: document.getElementById("f-unit").value,
              cost_price: parseFloat(document.getElementById("f-cost").value) || 0,
              selling_price: parseFloat(document.getElementById("f-sell").value) || 0,
              reorder_point: parseFloat(document.getElementById("f-reorder").value) || 0,
            }),
          });
        } else {
          await apiFetch("/api/stock-items/", {
            method: "POST",
            body: JSON.stringify({
              code: document.getElementById("f-code").value,
              title: document.getElementById("f-title").value,
              unit: document.getElementById("f-unit").value,
              cost_price: parseFloat(document.getElementById("f-cost").value) || 0,
              selling_price: parseFloat(document.getElementById("f-sell").value) || 0,
              reorder_point: parseFloat(document.getElementById("f-reorder").value) || 0,
            }),
          });
        }
        document.getElementById("f-code").disabled = false;
        toggleForm(false);
        loadItems();
      } catch (err) {
        errorEl.textContent = err.message;
      }
    }

    function renderItems() {
      const tbody = document.getElementById("items-body");
      if (!items.length) {
        tbody.innerHTML = `<tr><td colspan="8" class="muted">No stock items yet.</td></tr>`;
        return;
      }
      tbody.innerHTML = items.map(item => `
        <tr>
          <td>${item.code}</td>
          <td>${item.title}</td>
          <td>${item.unit || ""}</td>
          <td style="${item.reorder_point && item.on_hand <= item.reorder_point ? 'color:#dc2626;font-weight:600;' : ''}">${item.on_hand}</td>
          <td>${(item.cost_price ?? 0).toFixed(2)}</td>
          <td>${(item.selling_price ?? 0).toFixed(2)}</td>
          <td>${item.reorder_point ?? 0}</td>
          <td><a class="link" onclick="editItem(${item.id})">Edit</a></td>
        </tr>
      `).join("");
    }

    async function loadItems() {
      try {
        const q = document.getElementById("search").value.trim();
        const lowOnly = document.getElementById("low-stock-only").checked;
        const params = new URLSearchParams();
        if (q) params.set("q", q);
        if (lowOnly) params.set("low_stock_only", "true");
        items = await apiFetch(`/api/stock-items/?${params.toString()}`);
        renderItems();
      } catch (err) {
        document.getElementById("items-body").innerHTML = `<tr><td colspan="8" class="error">${err.message}</td></tr>`;
      }
    }

    document.getElementById("search").addEventListener("input", () => loadItems());
    document.getElementById("low-stock-only").addEventListener("change", () => loadItems());
    loadItems();
  </script>
  </div>
</body>
</html>
