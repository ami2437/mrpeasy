<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AT-HUB — Accounting</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth-guard.js"></script>
  <style>
    .ac-top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .ac-top .tabs { margin: 0; flex-wrap: wrap; order: 3; flex-basis: 100%; width: auto; max-width: 100%; box-sizing: border-box; }
    .ac-top .tabs .tab { padding: 5px 11px; font-size: 13.5px; }
    .ac-period { display: inline-flex; gap: 6px; align-items: center; margin-left: auto; }
    .ac-period select, .ac-period input { width: auto; }
    .ac-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 0 0 14px; }
    .ac-tile { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; cursor: default; }
    .ac-tile.click { cursor: pointer; } .ac-tile.click:hover { border-color: var(--accent); }
    .ac-tile .l { font-size: 11.5px; color: var(--muted); font-weight: 600; text-transform: capitalize; }
    .ac-tile .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
    .ac-tile .s { font-size: 12px; color: var(--muted); }
    .pos { color: #16a34a; } .neg { color: #dc2626; }
    .ac-amt { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .ac-desc { font-size: 12px; color: var(--muted); word-break: break-word; }
    .ac-who { font-weight: 600; }
    .ac-chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 9px; background: var(--surface-3); color: var(--text-2); margin-left: 4px; white-space: nowrap; }
    .ac-chip.auto { background: #fef3c7; color: #92400e; } .ac-chip.typed { background: #dbeafe; color: #1e40af; } .ac-chip.exp { background: #ede9fe; color: #5b21b6; }
    :root[data-theme="dark"] .ac-chip.auto { background: #4a3a10; color: #fcd34d; } :root[data-theme="dark"] .ac-chip.typed { background: #1e3a5f; color: #93c5fd; }
    :root[data-theme="dark"] .ac-chip.exp { background: #3b2a5f; color: #c4b5fd; }
    .ac-sugg { white-space: nowrap; }
    .ac-pnl { width: 100%; font-size: 12px; table-layout: auto; }
    .ac-pnl td, .ac-pnl th { padding: 4px 5px; }
    .ac-pnl th.num, .ac-pnl td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .ac-pnl tr.sec td { font-weight: 700; background: var(--surface-2); }
    .ac-pnl tr.tot td { font-weight: 700; border-top: 1px solid var(--border); }
    .ac-pnl tr.profit td { font-weight: 700; font-size: 13.5px; border-top: 2px solid var(--border); }
    .ac-pnl tr.drill { cursor: pointer; } .ac-pnl tr.drill:hover td { background: var(--surface-2); }
    .ac-pnl td.name { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ac-bars { display: flex; align-items: flex-end; gap: 4px; height: 150px; padding: 8px 0 0; border-bottom: 1px solid var(--border); }
    .ac-bars .m { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; }
    .ac-bars .b { width: 42%; min-height: 1px; border-radius: 3px 3px 0 0; }
    .ac-bars .pair { display: flex; gap: 2px; align-items: flex-end; width: 100%; justify-content: center; height: 100%; }
    .ac-bars .in { background: #2f6fed; } .ac-bars .out { background: #eb6834; }
    .ac-bars-lab { display: flex; gap: 4px; } .ac-bars-lab span { flex: 1; text-align: center; font-size: 11px; color: var(--muted); }
    .ac-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 1100px) { .ac-grid2 { grid-template-columns: 1fr; } }
    .ac-steps td { padding: 5px 8px; } .ac-steps tr.total td { font-weight: 700; border-top: 2px solid var(--border); }
    .ac-form { display: grid; grid-template-columns: 130px 1fr; gap: 8px 10px; align-items: center; }
    .ac-form label { font-size: 12.5px; color: var(--text-2); font-weight: 600; }
    .ac-split { display: grid; grid-template-columns: 1fr 110px 1fr 28px; gap: 6px; margin-bottom: 6px; }
    .ac-map { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 8px 0; }
    .ac-map label { font-size: 12px; font-weight: 600; color: var(--text-2); display: block; }
    .ac-sample { font-size: 11.5px; } .ac-sample td { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ac-bulk { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 10px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
    .ac-bulk select { width: auto; max-width: 260px; }
    table.ac-list td { vertical-align: top; }
    table.ac-list td.tick { width: 22px; }
    .ac-list select.ac-pick { width: 100%; max-width: 230px; font-size: 12.5px; padding: 3px 6px; }
    .ac-filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
    .ac-filters select, .ac-filters input { width: auto; }
    .ac-filters input[type=search] { flex: 1; min-width: 200px; }
    .ac-help { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; }
    .ac-status-paid { text-decoration: line-through; color: var(--muted); }
  </style>
</head>
<body>
  <div class="app-shell">
  <div id="sidebar"></div>
  <main>
    <div class="card page-toolbar ac-top">
      <h1 class="page-title">Accounting</h1>
      <div class="tabs" id="ac-tabs"></div>
      <span class="ac-period" id="ac-period"></span>
    </div>
    <div id="ac-view"><div class="card"><p class="muted">Loading…</p></div></div>
  </main>
  </div>
  <script>
    AuthGuard.requirePerm("accounting");
    document.getElementById("sidebar").innerHTML = renderSidebar("accounting.html");
    const TABS = [["overview", "Overview"], ["inbox", "To File"], ["txns", "Transactions"], ["pnl", "P&L"], ["accounts", "Accounts & Rules"],
      ["loans", "Loans"], ["partners", "Partners"], ["apar", "AP / AR"], ["cash", "Cash Flow"], ["statements", "Statements"]];
    let META = null, TAB = "overview", PERIOD = { start: null, end: null, key: null };
    const store = { get(k, d) { try { return JSON.parse(localStorage.getItem("ac." + k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem("ac." + k, JSON.stringify(v)); } catch {} } };
    const $ = id => document.getElementById(id);
    const view = () => $("ac-view");
    const money = v => `<span class="${v < -0.004 ? "neg" : v > 0.004 ? "pos" : ""}">${fmtMoney(v)}</span>`;
    const money0 = v => { const r = Math.round(v || 0); return r === 0 ? `<span class="muted">–</span>` : `<span class="${r < 0 ? "neg" : ""}" title="${fmtMoney(v)}">${r < 0 ? "-" : ""}$${Math.abs(r).toLocaleString("en-US")}</span>`; };
    const day = s => s ? new Date(s + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "";
    const monthLabel = k => { const [y, m] = k.split("-"); return new Date(+y, +m - 1, 1).toLocaleDateString(undefined, { month: "short", year: "2-digit" }); };
    const colLabel = k => /^\d{4}-\d\d$/.test(k) ? monthLabel(k) : k;
    const qs = extra => new URLSearchParams({ start: PERIOD.start, end: PERIOD.end, ...(extra || {}) }).toString();
    const KIND_LABEL = () => Object.fromEntries(META.kinds.map(k => [k.key, k.label]));
    const acc = id => META.accounts.find(a => a.id === id);

    // ---- account picker: grouped by type, active ones only (plus the current one) ----
    function accountOptions(selected, { blank = "— Pick an account —", sign = 0 } = {}) {
      const order = sign > 0 ? ["income", "loan", "transfer", "owner", "other", "pending", "cogs", "expense"] : ["cogs", "expense", "owner", "loan", "transfer", "income", "other", "pending"];
      const kl = KIND_LABEL();
      return `<option value="">${blank}</option>` + order.map(k => {
        const list = META.accounts.filter(a => a.kind === k && (a.is_active || a.id === selected)).sort((a, b) => a.name.localeCompare(b.name));
        return list.length ? `<optgroup label="${escapeHtml(kl[k])}">${list.map(a => `<option value="${a.id}" ${a.id === selected ? "selected" : ""}>${escapeHtml(a.name)}</option>`).join("")}</optgroup>` : "";
      }).join("") + `<option value="new">+ New account…</option>`;
    }
    async function pickNew(sel, sign) {  // "+ New account…" in any picker
      const a = await accountDialog(null, sign > 0 ? "income" : "expense");
      if (!a) { sel.value = ""; return null; }
      await loadMeta();
      sel.innerHTML = accountOptions(a.id, { sign });
      return a.id;
    }

    // ---- period: a fiscal year or any range ----
    function drawPeriod() {
      const yrs = META.years;
      const saved = store.get("period", null);
      if (!PERIOD.start) {
        if (saved && saved.start) PERIOD = saved;
        else { const y = yrs.find(y => META.today >= y.start && META.today <= y.end) || yrs[0]; PERIOD = { start: y.start, end: y.end, key: y.label }; }
      }
      const custom = !yrs.some(y => y.start === PERIOD.start && y.end === PERIOD.end);
      $("ac-period").innerHTML = `<select id="ac-fy" onchange="pickFy(this.value)" title="Fiscal year (${["", "Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][META.settings.fy_start_month]} – )">
          ${yrs.map(y => `<option value="${y.label}" ${!custom && y.start === PERIOD.start ? "selected" : ""}>${y.label}</option>`).join("")}
          <option value="custom" ${custom ? "selected" : ""}>Dates…</option></select>
        ${custom ? `<input type="date" id="ac-s" value="${PERIOD.start}" onchange="pickDates()"><span class="muted">to</span><input type="date" id="ac-e" value="${PERIOD.end}" onchange="pickDates()">` : ""}`;
    }
    function pickFy(v) {
      if (v === "custom") { PERIOD = { ...PERIOD, key: "custom" }; drawPeriodCustom(); return; }
      const y = META.years.find(y => y.label === v); PERIOD = { start: y.start, end: y.end, key: y.label }; store.set("period", PERIOD); drawPeriod(); show(TAB);
    }
    function drawPeriodCustom() {
      $("ac-period").innerHTML = `<select id="ac-fy" onchange="pickFy(this.value)">${META.years.map(y => `<option value="${y.label}">${y.label}</option>`).join("")}<option value="custom" selected>Dates…</option></select>
        <input type="date" id="ac-s" value="${PERIOD.start}" onchange="pickDates()"><span class="muted">to</span><input type="date" id="ac-e" value="${PERIOD.end}" onchange="pickDates()">`;
    }
    function pickDates() { const s = $("ac-s").value, e = $("ac-e").value; if (s && e) { PERIOD = { start: s, end: e, key: "custom" }; store.set("period", PERIOD); show(TAB); } }

    async function loadMeta() { META = await apiFetch("/api/accounting/meta"); }
    function drawTabs() {
      $("ac-tabs").innerHTML = TABS.map(([k, l]) => `<div class="tab ${k === TAB ? "active" : ""}" onclick="show('${k}')">${l}${k === "inbox" && META.unfiled ? ` <span class="ac-chip auto">${META.unfiled}</span>` : ""}</div>`).join("");
    }
    async function show(tab) {
      TAB = tab; store.set("tab", tab); history.replaceState(null, "", "#" + tab); drawTabs();
      view().innerHTML = `<div class="card"><p class="muted">Loading…</p></div>`;
      try { await LOADERS[tab](); } catch (e) { view().innerHTML = `<div class="card error">${escapeHtml(e.message)}</div>`; }
    }
    async function refreshCount() {
      try { const r = await apiFetch(`/api/accounting/txns?status=unfiled&all_dates=true&limit=1`); META.unfiled = r.total; drawTabs(); } catch {}
    }

    // ================================================================ Overview
    async function tabOverview() {
      const d = await apiFetch(`/api/accounting/overview?${qs()}`);
      const max = Math.max(1, ...d.months.map(m => Math.max(m.in, -m.out)));
      const noData = !d.lines;
      view().innerHTML = `
        ${noData ? `<div class="card"><h3 style="margin-top:0;">Start Here</h3><p class="ac-help">No lines in ${escapeHtml(PERIOD.key || "this period")} yet. Bring in a bank
          statement (CSV or Excel) on <a class="link" href="#" onclick="show('statements');return false;">Statements</a> — or your categorized workbook
          (Date, Amount, Description, Account, Category) to bring the history in and teach AT-HUB how you file things.</p></div>` : ""}
        <div class="ac-tiles">
          <div class="ac-tile"><div class="l">Money In</div><div class="v pos">${fmtMoney(d.money_in)}</div><div class="s">${d.lines} lines</div></div>
          <div class="ac-tile"><div class="l">Money Out</div><div class="v neg">${fmtMoney(d.money_out)}</div><div class="s">net ${fmtMoney(d.money_in + d.money_out)}</div></div>
          <div class="ac-tile click" onclick="show('pnl')"><div class="l">Profit</div><div class="v ${d.profit < 0 ? "neg" : "pos"}">${fmtMoney(d.profit)}</div><div class="s">income − cost of goods − expenses</div></div>
          <div class="ac-tile click" onclick="show('inbox')"><div class="l">To File</div><div class="v ${d.unfiled ? "neg" : ""}">${d.unfiled}</div><div class="s">lines with no account (all dates)</div></div>
          <div class="ac-tile click" onclick="TXF={status:'auto'};show('txns')"><div class="l">Filed By AT-HUB</div><div class="v">${d.unreviewed}</div><div class="s">not looked at yet</div></div>
        </div>
        <div class="ac-grid2">
          <div class="card"><h3 style="margin-top:0;">In And Out By Month</h3>
            <div class="ac-bars">${d.months.map(m => `<div class="m" title="${monthLabel(m.month)}: in ${fmtMoney(m.in)}, out ${fmtMoney(m.out)}"><div class="pair">
              <div class="b in" style="height:${(m.in / max * 100).toFixed(1)}%"></div><div class="b out" style="height:${(-m.out / max * 100).toFixed(1)}%"></div></div></div>`).join("")}</div>
            <div class="ac-bars-lab">${d.months.map(m => `<span>${monthLabel(m.month).split(" ")[0]}</span>`).join("")}</div>
            <div class="rp-legend"><span><b style="background:#2f6fed"></b>Money In</span><span><b style="background:#eb6834"></b>Money Out</span></div>
          </div>
          <div class="card"><div class="ac-filters"><h3 style="margin:0;">Where The Money Went</h3><span style="flex:1"></span><button class="small-btn" onclick="exportXlsx()">${icon("download")} Output Excel</button></div>
            <table class="compact-table"><thead><tr><th>Account</th><th>Type</th><th class="num">Amount</th></tr></thead><tbody>
            ${d.top_spend.map(r => `<tr class="drill" style="cursor:pointer" onclick="drill(${r.account_id})"><td>${escapeHtml(r.name)}</td><td class="muted">${escapeHtml(KIND_LABEL()[r.kind] || "")}</td><td class="ac-amt">${money(r.amount)}</td></tr>`).join("")
              || `<tr><td colspan="3" class="muted">Nothing filed under cost of goods or expenses yet.</td></tr>`}</tbody></table>
            <h4 style="margin:14px 0 6px;">By Type</h4>
            <table class="compact-table"><tbody>${Object.entries(d.kinds).sort((a, b) => a[1] - b[1]).map(([k, v]) => `<tr><td>${escapeHtml(KIND_LABEL()[k] || "Not filed")}</td><td class="ac-amt">${money(v)}</td></tr>`).join("")}</tbody></table>
          </div>
        </div>
        <div class="card"><h3 style="margin-top:0;">Bank Accounts &amp; Cards</h3>
          <table class="compact-table"><thead><tr><th>Name</th><th>Type</th><th class="num">Lines</th><th>Last Line</th><th class="num">Balance</th></tr></thead><tbody>
          ${d.sources.map(s => `<tr><td>${escapeHtml(s.name)}${s.last4 ? ` <span class="muted">…${escapeHtml(s.last4)}</span>` : ""}</td><td>${s.kind === "book" ? "Book entries" : s.kind === "card" ? "Credit card" : "Bank"}</td>
            <td class="num">${s.lines}</td><td>${day(s.last_date)}</td><td class="ac-amt">${s.kind === "book" ? `<span class="muted">–</span>` : s.opening_date ? money(s.balance) : `<span class="muted" title="Set the opening balance on Statements to see a balance">set opening balance</span>`}</td></tr>`).join("")}</tbody></table>
        </div>`;
    }

    // ================================================================ lines (inbox + explorer)
    let TXF = {}, TXDATA = null, TICKED = new Set();
    function lineRow(t, { inbox = false } = {}) {
      const chips = [!t.reviewed && t.account_id ? `<span class="ac-chip auto" title="${t.how === "rule" ? "Filed by your rule" : "AT-HUB filed it from earlier lines"} -- nobody has looked yet">Auto</span>` : "",
        t.origin === "manual" ? `<span class="ac-chip typed">Typed In</span>` : "", t.expected ? `<span class="ac-chip exp" title="Not on a statement yet -- matched when it comes in">Expected</span>` : "",
        t.origin === "workbook" ? `<span class="ac-chip">Workbook</span>` : ""].join("");
      const filed = t.splits.length ? t.splits.map(s => `<div>${escapeHtml(s.account)} <span class="muted">${fmtMoney(s.amount)}</span></div>`).join("")
        : `<select class="ac-pick" onchange="fileOne(${t.id}, this, ${t.amount})">${accountOptions(t.account_id, { blank: t.account_id ? "— None —" : "— Pick an account —", sign: t.amount })}</select>`;
      const sugg = !t.account_id && !t.splits.length && t.suggest ? `<div style="margin-top:4px;"><button class="small-btn ac-sugg" onclick="fileTo(${t.id}, ${t.suggest.account_id})" title="${escapeHtml(t.suggest.why)}">${icon("check")} ${escapeHtml(t.suggest.account)}</button>
        <span class="muted small">${escapeHtml(t.suggest.why)}</span></div>` : "";
      return `<tr data-id="${t.id}"><td class="tick"><input type="checkbox" ${TICKED.has(t.id) ? "checked" : ""} onchange="tick(${t.id}, this.checked)"></td>
        <td class="nowrap">${day(t.date)}<div class="muted small">${escapeHtml(t.source)}</div></td>
        <td><span class="ac-who">${escapeHtml(t.payee || "")}</span>${chips}<div class="ac-desc">${escapeHtml(t.description)}</div>
          ${t.bank_description && t.bank_description !== t.description ? `<div class="ac-desc">Bank: ${escapeHtml(t.bank_description)}</div>` : ""}
          ${t.note ? `<div class="small">${icon("notePen")} ${escapeHtml(t.note)}</div>` : ""}</td>
        <td style="min-width:200px;">${filed}${sugg}</td>
        <td class="ac-amt">${money(t.amount)}</td>
        <td class="nowrap"><button class="small-btn icon-only" title="Open: split, note${t.origin === "manual" ? ", change, delete" : ""}" onclick="editLine(${t.id})">${icon("pencil")}</button></td></tr>`;
    }
    function tick(id, on) { on ? TICKED.add(id) : TICKED.delete(id); drawBulk(); }
    function tickAll(on) { (TXDATA?.rows || []).forEach(t => on ? TICKED.add(t.id) : TICKED.delete(t.id)); drawLines(); }
    function drawBulk() {
      const el = $("ac-bulk"); if (!el) return;
      el.style.display = TICKED.size ? "" : "none";
      el.innerHTML = `<strong>${TICKED.size} ticked</strong>
        <select id="bulk-acc">${accountOptions(null, { blank: "— Put in account —" })}</select><button class="small-btn" onclick="bulkDo('file')">File</button>
        <button class="small-btn" onclick="bulkDo('review')" title="Keep the account AT-HUB picked">Looks Right</button>
        <button class="small-btn" onclick="bulkDo('unfile')">Take Out Of Account</button>
        <button class="small-btn danger" onclick="bulkDo('delete')" title="Typed-in lines only">Delete</button>
        <button class="small-btn" onclick="TICKED.clear();drawLines()">Clear</button>`;
    }
    async function bulkDo(action) {
      const body = { ids: [...TICKED], action };
      if (action === "file") { const v = $("bulk-acc").value; if (!v || v === "new") { toast("Pick the account"); return; } body.account_id = +v; }
      if (action === "delete" && !(await askDialog({ title: `Delete ${TICKED.size} line(s)?`, body: `<p>Only typed-in lines are deleted; statement lines are skipped (undo their import on Statements).</p>`, buttons: [{ label: "Delete", value: true, cls: "danger" }, { label: "Cancel", value: false }] })).value) return;
      try {
        const r = await apiFetch("/api/accounting/txns/bulk", { method: "POST", body: JSON.stringify(body) });
        toast(`${r.done} done${r.skipped ? `, ${r.skipped} skipped (from a statement)` : ""}${r.filed_more ? ` · ${r.filed_more} more filed like them` : ""}`);
        TICKED.clear(); await reloadLines(); refreshCount();
      } catch (e) { alert(e.message); }
    }
    async function fileTo(id, accountId) {
      try {
        const r = await apiFetch(`/api/accounting/txns/${id}`, { method: "PUT", body: JSON.stringify({ account_id: accountId }) });
        toast(`Filed in ${r.account}${r.filed_more ? ` · ${r.filed_more} more like it filed too` : ""}`);
        await reloadLines(); refreshCount();
      } catch (e) { alert(e.message); }
    }
    async function fileOne(id, sel, amount) {
      let v = sel.value;
      if (v === "new") { v = await pickNew(sel, amount); if (!v) return; }
      fileTo(id, v ? +v : null);
    }
    let LINES_MODE = "txns";
    async function reloadLines() {
      const p = { limit: 300, offset: TXF.offset || 0 };
      if (LINES_MODE === "inbox") Object.assign(p, { status: "unfiled", all_dates: true });
      else { Object.assign(p, { start: PERIOD.start, end: PERIOD.end }); for (const k of ["source_id", "account_id", "kind", "status", "q"]) if (TXF[k]) p[k] = TXF[k]; }
      TXDATA = await apiFetch(`/api/accounting/txns?${new URLSearchParams(p)}`);
      drawLines();
    }
    function drawLines() {
      const d = TXDATA, el = $("ac-lines"); if (!el) return;
      el.innerHTML = `<div id="ac-bulk" class="ac-bulk" style="display:none"></div>
        <table class="compact-table ac-list no-table-tools"><thead><tr><th class="tick"><input type="checkbox" title="Tick all shown" onchange="tickAll(this.checked)"></th><th>Date</th><th>Payee / Description</th><th>Account</th><th class="num">Amount</th><th></th></tr></thead>
        <tbody>${d.rows.map(t => lineRow(t)).join("") || `<tr><td colspan="6" class="muted">${LINES_MODE === "inbox" ? "Nothing to file — every line is in an account." : "No lines match."}</td></tr>`}</tbody></table>
        <div class="muted small" style="margin-top:8px;">${d.rows.length} of ${d.total} shown · in ${fmtMoney(d.money_in)} · out ${fmtMoney(d.money_out)}
          ${d.total > (TXF.offset || 0) + d.rows.length ? ` · <a class="link" href="#" onclick="TXF.offset=(TXF.offset||0)+300;reloadLines();return false;">Next 300</a>` : ""}

        }
        toast("Saved"); tabApar();
      } catch (e) { alert(e.message); }

    // pick a file -> AT-HUB reads it and shows which column it thinks is which -> change any -> bring it in

    async function importDialog(sourceId) {
      const pick = Object.assign(document.createElement("input"), { type: "file", accept: ".csv,.xlsx,.xlsm,.txt" });
      pick.onchange = async () => {
        const file = pick.files[0]; if (!file) return;

      };
      pick.click();

    async function previewImport() {
      const fd = new FormData(); fd.append("source_id", IMP.sourceId); fd.append("file", IMP.file);
      if (IMP.layout) fd.append("layout", JSON.stringify(IMP.layout));
      let p;
      try { p = await apiUpload("/api/accounting/import/preview", fd); } catch (e) { alert(e.message); return; }
      IMP.layout = p.layout;
      IMP.first = p.first; IMP.last = p.last;
      const col = (key, label, optional) => `<div><label>${label}</label><select class="mp" data-k="${key}">${optional ? `<option value="">—</option>` : `<option value="">— pick —</option>`}${p.headers.map((h, i) => `<option value="${i}" ${p.layout[key] === i ? "selected" : ""}>${escapeHtml(h)}</option>`).join("")}</select></div>`;
      const src = META.sources.find(s => s.id === IMP.sourceId);
      const body = `<p class="ac-help">${escapeHtml(IMP.file.name)} → <strong>${escapeHtml(src.name)}</strong>. Check AT-HUB read the columns right (it remembers them for this account).</p>
        <label class="inline-check"><input type="checkbox" id="mp-head" ${p.layout.has_header ? "checked" : ""}> The first row is column names</label>
        <div class="ac-map">${col("date", "Date")}${col("description", "Description")}${col("amount", "Amount (+ in, − out)", true)}${col("debit", "Or: Debit (out)", true)}${col("credit", "And: Credit (in)", true)}
          ${col("account", "Account (your workbook)", true)}${col("category", "Category (your workbook)", true)}</div>
        <div class="table-scroll"><table class="compact-table ac-sample"><tbody>${p.sample.map(r => `<tr>${r.map(c => `<td title="${escapeHtml(c)}">${escapeHtml(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
        <div class="ac-tiles" style="margin-top:10px;"><div class="ac-tile"><div class="l">Lines Read</div><div class="v">${p.rows}</div><div class="s">${day(p.first)} – ${day(p.last)}</div></div>
          <div class="ac-tile"><div class="l">Already In</div><div class="v">${p.already}</div><div class="s">skipped</div></div>
          <div class="ac-tile"><div class="l">In / Out</div><div class="v" style="font-size:15px;">${fmtMoney(p.money_in)}<br>${fmtMoney(p.money_out)}</div></div></div>
        ${p.workbook ? `<p class="ac-help"><strong>Your workbook:</strong> every line comes in already filed under its Account (accounts made from your names, typed by Category: Payments → Income,
          COGS, Expense, Loans, Shares → Partner Draws, Wash → Transfers; Pending (AR / AP estimates) is kept but set aside — not counted). This also teaches AT-HUB how you file.</p>` : ""}
        ${p.bad_count ? `<p class="muted small">${p.bad_count} row(s) without a date or amount are left out: ${p.bad.slice(0, 3).map(escapeHtml).join(" · ")}</p>` : ""}
        <div class="table-scroll" style="max-height:220px;"><table class="compact-table ac-sample"><thead><tr><th>Date</th><th class="num">Amount</th><th>Description</th>${p.workbook ? "<th>Account</th><th>Category</th>" : ""}</tr></thead>
          <tbody>${p.parsed.map(r => `<tr><td>${r.date}</td><td class="ac-amt">${fmtMoney(r.amount)}</td><td>${escapeHtml(r.description)}</td>${p.workbook ? `<td>${escapeHtml(r.account || "")}</td><td>${escapeHtml(r.category || "")}</td>` : ""}</tr>`).join("")}</tbody></table></div>`;
      const dlg = askDialog({ title: "Bring In Statement", body, buttons: [{ label: `Bring In ${p.rows - p.already} Line(s)`, value: "go", cls: "primary" }, { label: "Cancel", value: null }], wide: true });
      setTimeout(() => {
        document.querySelectorAll(".mp, #mp-head").forEach(s => s.onchange = () => {
          const lay = { has_header: document.getElementById("mp-head").checked };
          document.querySelectorAll(".mp").forEach(x => { if (x.value !== "") lay[x.dataset.k] = +x.value; });
          if (lay.amount != null) { delete lay.debit; delete lay.credit; }
          IMP.layout = lay;
          IMP.again = true;
          [...document.querySelectorAll(".ask-dialog button")].find(b => b.textContent === "Cancel")?.click();
        });
      }, 0);
      const { value } = await dlg;
      if (IMP.again) { IMP.again = false; return previewImport(); }
      if (value !== "go") return;
      const fd2 = new FormData(); fd2.append("source_id", IMP.sourceId); fd2.append("file", IMP.file); fd2.append("layout", JSON.stringify(IMP.layout));
      try {
        const r = await apiUpload("/api/accounting/import", fd2);
        await askDialog({ title: "Brought In", body: `<p><strong>${r.added}</strong> new line(s)${r.skipped ? `, ${r.skipped} already in (skipped)` : ""}${r.matched ? `, ${r.matched} typed-in line(s) matched` : ""}.</p>
          ${r.auto ? `<p>${r.auto} filed by AT-HUB from earlier lines (marked Auto).</p>` : ""}${r.left ? `<p><strong>${r.left}</strong> to file.</p>` : ""}
          <p class="muted small">The output Excel covers ${day(IMP.first < IMP.last ? IMP.first : IMP.last)} – ${day(IMP.first < IMP.last ? IMP.last : IMP.first)}, this file's dates.</p>`,
          buttons: [...(r.left ? [{ label: "File Them Now", value: "file", cls: "primary" }] : []), { label: "Download Output Excel", value: "xlsx", cls: r.left ? "" : "primary" }, { label: "Close", value: null }] })
          .then(x => { if (x.value === "xlsx") { const [a, b] = [IMP.first, IMP.last].sort(); exportXlsx(a, b); show("statements"); } else if (x.value === "file") show("inbox"); else show("statements"); });
        await loadMeta(); refreshCount();
      } catch (e) { alert(e.message); }
    }

    const LOADERS = { overview: tabOverview, inbox: tabInbox, txns: tabTxns, pnl: tabPnl, accounts: tabAccounts, loans: tabLoans, partners: tabPartners, apar: tabApar, cash: tabCash, statements: tabStatements };
    (async () => {
      try { await loadMeta(); } catch (e) { view().innerHTML = `<div class="card error">${escapeHtml(e.message)}</div>`; return; }
      drawPeriod();
      const h = location.hash.slice(1);
      TAB = LOADERS[h] ? h : store.get("tab", "overview");
      if (!LOADERS[TAB]) TAB = "overview";
      await refreshCount();
      show(TAB);
    })();
  </script>
</body>
</html>
