<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AT-HUB — Accounting</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth-guard.js"></script>
  <script src="accounting-more.js"></script>
  <style>
    .ac-top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .ac-top .tabs { margin: 0; flex-wrap: wrap; order: 3; flex-basis: 100%; width: auto; max-width: 100%; box-sizing: border-box; }
    .ac-top .tabs .tab { padding: 5px 11px; font-size: 13.5px; }
    .ac-period { display: inline-flex; gap: 6px; align-items: center; margin-left: auto; }
    .ac-period select, .ac-period input { width: auto; }
    .ac-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 0 0 14px; }
    .ac-tile { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; cursor: default; }
    .ac-tile.click { cursor: pointer; } .ac-tile.click:hover { border-color: var(--accent); }
    .ac-tile .l { font-size: 11.5px; color: var(--muted); font-weight: 600; text-transform: capitalize; }
    .ac-tile .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
    .ac-tile .s { font-size: 12px; color: var(--muted); }
    .pos { color: #16a34a; } .neg { color: #dc2626; }
    .ac-amt { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .ac-desc { font-size: 12px; color: var(--muted); word-break: break-word; }
    .ac-who { font-weight: 600; }
    .ac-chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 9px; background: var(--surface-3); color: var(--text-2); margin-left: 4px; white-space: nowrap; }
    .ac-chip.auto { background: #fef3c7; color: #92400e; } .ac-chip.typed { background: #dbeafe; color: #1e40af; } .ac-chip.exp { background: #ede9fe; color: #5b21b6; }
    :root[data-theme="dark"] .ac-chip.auto { background: #4a3a10; color: #fcd34d; } :root[data-theme="dark"] .ac-chip.typed { background: #1e3a5f; color: #93c5fd; }
    :root[data-theme="dark"] .ac-chip.exp { background: #3b2a5f; color: #c4b5fd; }
    .ac-sugg { white-space: nowrap; }
    .ac-pnl { width: 100%; font-size: 12px; table-layout: auto; }
    .ac-pnl td, .ac-pnl th { padding: 4px 5px; }
    .ac-pnl th.num, .ac-pnl td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .ac-pnl tr.sec td { font-weight: 700; background: var(--surface-2); }
    .ac-pnl tr.tot td { font-weight: 700; border-top: 1px solid var(--border); }
    .ac-pnl tr.profit td { font-weight: 700; font-size: 13.5px; border-top: 2px solid var(--border); }
    .ac-pnl tr.drill { cursor: pointer; } .ac-pnl tr.drill:hover td { background: var(--surface-2); }
    .ac-pnl tr.sub td { color: var(--text-2); }
    .ac-pnl td.name { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ac-bars { display: flex; align-items: flex-end; gap: 4px; height: 150px; padding: 8px 0 0; border-bottom: 1px solid var(--border); }
    .ac-bars .m { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; }
    .ac-bars .b { width: 42%; min-height: 1px; border-radius: 3px 3px 0 0; }
    .ac-bars .pair { display: flex; gap: 2px; align-items: flex-end; width: 100%; justify-content: center; height: 100%; }
    .ac-bars .in { background: #2f6fed; } .ac-bars .out { background: #eb6834; }
    .ac-bars-lab { display: flex; gap: 4px; } .ac-bars-lab span { flex: 1; text-align: center; font-size: 11px; color: var(--muted); }
    .ac-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 1100px) { .ac-grid2 { grid-template-columns: 1fr; } }
    .ac-steps td { padding: 5px 8px; } .ac-steps tr.total td { font-weight: 700; border-top: 2px solid var(--border); }
    .ac-form { display: grid; grid-template-columns: 130px 1fr; gap: 8px 10px; align-items: center; }
    .ac-form label { font-size: 12.5px; color: var(--text-2); font-weight: 600; }
    .ac-split { display: grid; grid-template-columns: 1fr 110px 1fr 28px; gap: 6px; margin-bottom: 6px; }
    .ac-map { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 8px 0; }
    .ac-map label { font-size: 12px; font-weight: 600; color: var(--text-2); display: block; }
    .ac-sample { font-size: 11.5px; } .ac-sample td { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ac-bulk { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 10px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
    .ac-bulk select { width: auto; max-width: 260px; }
    table.ac-list td { vertical-align: top; }
    table.ac-list td.tick { width: 22px; }
    .ac-list select.ac-pick { width: 100%; max-width: 230px; font-size: 12.5px; padding: 3px 6px; }
    .ac-filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
    .ac-filters select, .ac-filters input { width: auto; }
    .ac-filters input[type=search] { flex: 1; min-width: 200px; }
    .ac-help { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; }
    .ac-status-paid { text-decoration: line-through; color: var(--muted); }
    .ac-grip { cursor: grab; color: var(--muted); margin-right: 6px; letter-spacing: -2px; user-select: none; }
    tr.dragging { opacity: .45; }
    tr.drop-on td { background: var(--surface-3) !important; box-shadow: inset 0 2px 0 var(--accent); }
    .rb-cond { display: grid; grid-template-columns: 200px 160px 1fr 110px 34px; gap: 6px; margin-bottom: 6px; align-items: center; }
    .rb-cond .rb-x, .rb-split .rb-x { width: 34px; }
    .rb-split { display: grid; grid-template-columns: 1fr 90px 60px 34px; gap: 6px; margin-bottom: 6px; align-items: center; }
    .ac-sugg-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; }
    .ac-sugg-card { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--surface-2); min-width: 0; }
    .ac-sugg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
    .ac-sugg-row input, .ac-sugg-row select { width: 100%; min-width: 0; font-size: 12.5px; }
    .ac-session { font-size: 12.5px; color: var(--text-2); }
    .ac-tabgrp { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); align-self: center; margin: 0 2px 0 8px; font-weight: 700; }
    .ac-tabgrp:first-child { margin-left: 2px; }
    .ac-top .tabs .tab { padding: 4px 9px; font-size: 13px; }
    .ac-totbar { position: sticky; top: 0; z-index: 3; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 7px 10px; margin: 0 0 8px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-variant-numeric: tabular-nums; box-shadow: var(--shadow); }
    .ac-totbar strong { font-size: 14px; }
    .ac-stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--text-2); margin: -2px 0 8px; }
    .ac-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: -2px 0 8px; }
    .ac-fchip { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; padding: 2px 8px; border-radius: 12px; background: var(--surface-3); }
    .ac-fchip a { cursor: pointer; color: var(--muted); }
    .ac-adv { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px 12px; margin: 8px 0; }
    .ac-adv label { font-size: 12px; font-weight: 600; color: var(--text-2); display: block; }
    .ac-adv input, .ac-adv select { width: 100%; }
    .ac-comment { padding: 6px 10px; border-left: 3px solid var(--border); margin: 6px 0; background: var(--surface-2); border-radius: 4px; }
    .ac-comment-new textarea { width: 100%; margin: 6px 0; }
    .pj-grid input, .pj-grid select { width: 100%; min-width: 0; font-size: 12.5px; padding: 3px 6px; }
    .rec-accs { max-height: 260px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
    .ac-chip.back { background: #fee2e2; color: #991b1b; } :root[data-theme="dark"] .ac-chip.back { background: #5f1e1e; color: #fecaca; }
  </style>
</head>
<body>
  <div class="app-shell">
  <div id="sidebar"></div>
  <main>
    <div class="card page-toolbar ac-top">
      <h1 class="page-title">Accounting</h1>
      <div class="tabs" id="ac-tabs"></div>
      <span class="ac-period" id="ac-period"></span>
    </div>
    <div id="ac-view"><div class="card"><p class="muted">Loading…</p></div></div>
  </main>
  </div>
  <script>
    AuthGuard.requirePerm("accounting");
    document.getElementById("sidebar").innerHTML = renderSidebar("accounting.html");
    const TAB_GROUPS = [["Work", [["review", "Review"], ["txns", "Transactions"], ["statements", "Statements"], ["ignored", "Ignored"]]],
      ["Reports", [["overview", "Overview"], ["pnl", "P&L"], ["cash", "Cash Flow"], ["payees", "Payees"], ["partneraccts", "Partner Accounts"], ["partners", "Partners Split"],
        ["loans", "Loans"], ["apar", "AP / AR"], ["tax", "1099"], ["recurring", "Recurring"]]],
      ["Check", [["check", "Check My Books"], ["reconcile", "Reconcile"]]], ["Plan", [["projections", "Projections"]]], ["Setup", [["accounts", "Accounts & Rules"], ["notes", "Notes"]]]];
    const TABS = TAB_GROUPS.flatMap(g => g[1]);
    window.TAB_LIST = TABS;
    let META = null, TAB = "overview", PERIOD = { start: null, end: null, key: null };
    const store = { get(k, d) { try { return JSON.parse(localStorage.getItem("ac." + k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem("ac." + k, JSON.stringify(v)); } catch {} } };
    const $ = id => document.getElementById(id);
    const view = () => $("ac-view");
    const money = v => `<span class="${v < -0.004 ? "neg" : v > 0.004 ? "pos" : ""}">${fmtMoney(v)}</span>`;
    const money0 = v => { const r = Math.round(v || 0); return r === 0 ? `<span class="muted">–</span>` : `<span class="${r < 0 ? "neg" : ""}" title="${fmtMoney(v)}">${r < 0 ? "-" : ""}$${Math.abs(r).toLocaleString("en-US")}</span>`; };
    const day = s => s ? new Date(s + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "";
    const monthLabel = k => { const [y, m] = k.split("-"); return new Date(+y, +m - 1, 1).toLocaleDateString(undefined, { month: "short", year: "2-digit" }); };
    const colLabel = k => /^\d{4}-\d\d$/.test(k) ? monthLabel(k) : k;
    const qs = extra => new URLSearchParams({ start: PERIOD.start, end: PERIOD.end, ...(extra || {}) }).toString();
    const KIND_LABEL = () => Object.fromEntries(META.kinds.map(k => [k.key, k.label]));
    const acc = id => META.accounts.find(a => a.id === id);

    // ---- account picker: grouped by type, active ones only (plus the current one) ----
    function accountOptions(selected, { blank = "— Pick an account —", sign = 0 } = {}) {
      const order = sign > 0 ? ["income", "loan", "transfer", "owner", "other", "pending", "cogs", "expense"] : ["cogs", "expense", "owner", "loan", "transfer", "income", "other", "pending"];
      const kl = KIND_LABEL();
      return `<option value="">${blank}</option>` + order.map(k => {
        const list = META.accounts.filter(a => a.kind === k && (a.is_active || a.id === selected));  // the server sends them parents-first
        return list.length ? `<optgroup label="${escapeHtml(kl[k])}">${list.map(a => `<option value="${a.id}" ${a.id === selected ? "selected" : ""}>${"\u00a0\u00a0\u00a0".repeat(a.depth || 0)}${escapeHtml(a.path || a.name)}</option>`).join("")}</optgroup>` : "";
      }).join("") + `<option value="new">+ New account…</option>`;
    }
    async function pickNew(sel, sign) {  // "+ New account…" in any picker
      const a = await accountDialog(null, sign > 0 ? "income" : "expense");
      if (!a) { sel.value = ""; return null; }
      await loadMeta();
      sel.innerHTML = accountOptions(a.id, { sign });
      return a.id;
    }

    // ---- period: a fiscal year or any range ----
    function drawPeriod() {
      const yrs = META.years;
      const saved = store.get("period", null);
      if (!PERIOD.start) {
        if (saved && saved.start) PERIOD = saved;
        else { const y = yrs.find(y => META.today >= y.start && META.today <= y.end) || yrs[0]; PERIOD = { start: y.start, end: y.end, key: y.label }; }
      }
      const custom = !yrs.some(y => y.start === PERIOD.start && y.end === PERIOD.end);
      $("ac-period").innerHTML = `<select id="ac-fy" onchange="pickFy(this.value)" title="Fiscal year (${["", "Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][META.settings.fy_start_month]} – )">
          ${yrs.map(y => `<option value="${y.label}" ${!custom && y.start === PERIOD.start ? "selected" : ""}>${y.label}</option>`).join("")}
          <option value="custom" ${custom ? "selected" : ""}>Dates…</option></select>
        ${custom ? `<input type="date" id="ac-s" value="${PERIOD.start}" onchange="pickDates()"><span class="muted">to</span><input type="date" id="ac-e" value="${PERIOD.end}" onchange="pickDates()">` : ""}`;
    }
    function pickFy(v) {
      if (v === "custom") { PERIOD = { ...PERIOD, key: "custom" }; drawPeriodCustom(); return; }
      const y = META.years.find(y => y.label === v); PERIOD = { start: y.start, end: y.end, key: y.label }; store.set("period", PERIOD); drawPeriod(); show(TAB);
    }
    function drawPeriodCustom() {
      $("ac-period").innerHTML = `<select id="ac-fy" onchange="pickFy(this.value)">${META.years.map(y => `<option value="${y.label}">${y.label}</option>`).join("")}<option value="custom" selected>Dates…</option></select>
        <input type="date" id="ac-s" value="${PERIOD.start}" onchange="pickDates()"><span class="muted">to</span><input type="date" id="ac-e" value="${PERIOD.end}" onchange="pickDates()">`;
    }
    function pickDates() { const s = $("ac-s").value, e = $("ac-e").value; if (s && e) { PERIOD = { start: s, end: e, key: "custom" }; store.set("period", PERIOD); show(TAB); } }

    async function loadMeta() { META = await apiFetch("/api/accounting/meta"); }
    function drawTabs() {
      $("ac-tabs").innerHTML = TAB_GROUPS.map(([g, tabs]) => `<span class="ac-tabgrp">${g}</span>` + tabs.map(([k, l]) => `<div class="tab ${k === TAB ? "active" : ""}" onclick="show('${k}')">${l}${k === "review" && META.unfiled ? ` <span class="ac-chip auto">${META.unfiled}</span>` : ""}</div>`).join("")).join("");
    }
    async function show(tab) {
      if (tab === "inbox") tab = "review";  // the old name ("To File")
      if (!LOADERS[tab]) tab = "overview";
      TAB = tab; store.set("tab", tab); history.replaceState(null, "", "#" + tab); drawTabs();
      view().innerHTML = `<div class="card"><p class="muted">Loading…</p></div>`;
      try {
        await LOADERS[tab]();
        if (!["projections", "notes"].includes(tab)) commentsCard(tab);  // a comment line on every tab (per period)
      } catch (e) { view().innerHTML = `<div class="card error">${escapeHtml(e.message)}</div>`; }
    }
    async function refreshCount() {
      try { const r = await apiFetch(`/api/accounting/txns?status=unfiled&all_dates=true&limit=1`); META.unfiled = r.total; drawTabs(); } catch {}
    }

    // ================================================================ Overview
    async function tabOverview() {
      const d = await apiFetch(`/api/accounting/overview?${qs()}`);
      const max = Math.max(1, ...d.months.map(m => Math.max(m.in, -m.out)));
      const noData = !d.lines;
      view().innerHTML = `
        ${noData ? `<div class="card"><h3 style="margin-top:0;">Start Here</h3><p class="ac-help">No lines in ${escapeHtml(PERIOD.key || "this period")} yet. Bring in a bank
          statement (CSV or Excel) on <a class="link" href="#" onclick="show('statements');return false;">Statements</a> — or your categorized workbook
          (Date, Amount, Description, Account, Category) to bring the history in and teach AT-HUB how you file things.</p></div>` : ""}
        <div class="ac-tiles">
          <div class="ac-tile"><div class="l">Money In</div><div class="v pos">${fmtMoney(d.money_in)}</div><div class="s">${d.lines} lines</div>${vsPrev(d.money_in, d.prev && d.prev.money_in, "period before")}</div>
          <div class="ac-tile"><div class="l">Money Out</div><div class="v neg">${fmtMoney(d.money_out)}</div><div class="s">net ${fmtMoney(d.money_in + d.money_out)}</div>${vsPrev(d.money_out, d.prev && d.prev.money_out, "period before")}</div>
          <div class="ac-tile click" onclick="show('pnl')"><div class="l">Profit</div><div class="v ${d.profit < 0 ? "neg" : "pos"}">${fmtMoney(d.profit)}</div><div class="s">income − cost of goods − expenses</div>${vsPrev(d.profit, d.prev && d.prev.profit, "period before")}</div>
          <div class="ac-tile click" onclick="show('check')"><div class="l">Check My Books</div><div class="v">${icon("check")}</div><div class="s">lines that may be in the wrong account</div></div>
          <div class="ac-tile click" onclick="show('review')"><div class="l">To Review</div><div class="v ${d.unfiled ? "neg" : ""}">${d.unfiled}</div><div class="s">lines with no account (all dates)</div></div>
          <div class="ac-tile click" onclick="TXF={status:'auto'};show('txns')"><div class="l">Filed By AT-HUB</div><div class="v">${d.unreviewed}</div><div class="s">not looked at yet</div></div>
        </div>
        <div class="ac-grid2">
          <div class="card"><h3 style="margin-top:0;">In And Out By Month</h3>
            <div class="ac-bars">${d.months.map(m => `<div class="m" title="${monthLabel(m.month)}: in ${fmtMoney(m.in)}, out ${fmtMoney(m.out)}"><div class="pair">
              <div class="b in" style="height:${(m.in / max * 100).toFixed(1)}%"></div><div class="b out" style="height:${(-m.out / max * 100).toFixed(1)}%"></div></div></div>`).join("")}</div>
            <div class="ac-bars-lab">${d.months.map(m => `<span>${monthLabel(m.month).split(" ")[0]}</span>`).join("")}</div>
            <div class="rp-legend"><span><b style="background:#2f6fed"></b>Money In</span><span><b style="background:#eb6834"></b>Money Out</span></div>
          </div>
          <div class="card"><div class="ac-filters"><h3 style="margin:0;">Where The Money Went</h3><span style="flex:1"></span><button class="small-btn" onclick="exportXlsx()">${icon("download")} Output Excel</button></div>
            <table class="compact-table"><thead><tr><th>Account</th><th>Type</th><th class="num">Amount</th></tr></thead><tbody>
            ${d.top_spend.map(r => `<tr class="drill" style="cursor:pointer" onclick="drill(${r.account_id})"><td>${escapeHtml(r.name)}</td><td class="muted">${escapeHtml(KIND_LABEL()[r.kind] || "")}</td><td class="ac-amt">${money(r.amount)}</td></tr>`).join("")
              || `<tr><td colspan="3" class="muted">Nothing filed under cost of goods or expenses yet.</td></tr>`}</tbody></table>
            <h4 style="margin:14px 0 6px;">By Type</h4>
            <table class="compact-table"><tbody>${Object.entries(d.kinds).sort((a, b) => a[1] - b[1]).map(([k, v]) => `<tr><td>${escapeHtml(KIND_LABEL()[k] || "Not filed")}</td><td class="ac-amt">${money(v)}</td></tr>`).join("")}</tbody></table>
          </div>
        </div>
        <div class="card"><h3 style="margin-top:0;">Bank Accounts &amp; Cards</h3>
          <table class="compact-table"><thead><tr><th>Name</th><th>Type</th><th class="num">Lines</th><th>Last Line</th><th class="num">Balance</th></tr></thead><tbody>
          ${d.sources.map(s => `<tr><td>${escapeHtml(s.name)}${s.last4 ? ` <span class="muted">…${escapeHtml(s.last4)}</span>` : ""}</td><td>${s.kind === "book" ? "Book entries" : s.kind === "card" ? "Credit card" : "Bank"}</td>
            <td class="num">${s.lines}</td><td>${day(s.last_date)}</td><td class="ac-amt">${s.kind === "book" ? `<span class="muted">–</span>` : s.opening_date ? money(s.balance) : `<span class="muted" title="Set the opening balance on Statements to see a balance">set opening balance</span>`}</td></tr>`).join("")}</tbody></table>
        </div>`;
    }

    // ================================================================ lines (inbox + explorer)
    let TXF = {}, TXDATA = null, TICKED = new Set();
    function lineRow(t, { inbox = false } = {}) {
      const chips = [!t.reviewed && t.account_id ? `<span class="ac-chip auto" title="${t.how === "rule" ? "Filed by your rule" : "AT-HUB filed it from earlier lines"} -- nobody has looked yet">Auto</span>` : "",
        t.origin === "manual" ? `<span class="ac-chip typed">Typed In</span>` : "", t.expected ? `<span class="ac-chip exp" title="Not on a statement yet -- matched when it comes in">Expected</span>` : "",
        t.origin === "workbook" ? `<span class="ac-chip">Workbook</span>` : "",
        t.sent_back ? `<span class="ac-chip back" title="Sent back by ${escapeHtml(t.sent_back_by || "")}${t.sent_back_reason ? ": " + escapeHtml(t.sent_back_reason) : ""}">Sent Back${t.sent_back_reason ? ": " + escapeHtml(t.sent_back_reason.slice(0, 40)) : ""}</span>` : ""].join("");
      const filed = t.splits.length ? t.splits.map(s => `<div>${escapeHtml(s.account)} <span class="muted">${fmtMoney(s.amount)}</span></div>`).join("")
        : `<select class="ac-pick" onchange="fileOne(${t.id}, this, ${t.amount})">${accountOptions(t.account_id, { blank: t.account_id ? "— None —" : "— Pick an account —", sign: t.amount })}</select>`;
      const sugg = !t.account_id && !t.splits.length && t.suggest ? `<div style="margin-top:4px;"><button class="small-btn ac-sugg" onclick="fileTo(${t.id}, ${t.suggest.account_id})" title="${escapeHtml(t.suggest.why)}">${icon("check")} ${escapeHtml(t.suggest.account)}</button>
        <span class="muted small">${escapeHtml(t.suggest.why)}</span></div>` : "";
      return `<tr data-id="${t.id}"><td class="tick"><input type="checkbox" ${TICKED.has(t.id) ? "checked" : ""} onchange="tick(${t.id}, this.checked)"></td>

          <td>${l.accounts.slice(0, 4).map(a => `${escapeHtml(a.account)} <span class="muted small">×${a.count}</span>`).join("<br>")}${l.accounts.length > 4 ? `<div class="muted small">+${l.accounts.length - 4} more</div>` : ""}</td>

    async function forgetPayee(key, on) {

    // ---- drag an account onto another (sub-account / merge) or onto a type heading (main account)
    function wireAccountDrag() {
      let dragId = null;
      const v = view();
      v.querySelectorAll("tr[data-acc]").forEach(tr => {
        tr.addEventListener("dragstart", e => { dragId = +tr.dataset.acc; e.dataTransfer.setData("text/plain", tr.dataset.acc); e.dataTransfer.effectAllowed = "move"; tr.classList.add("dragging"); });
        tr.addEventListener("dragend", () => { tr.classList.remove("dragging"); v.querySelectorAll(".drop-on").forEach(x => x.classList.remove("drop-on")); });
      });
      v.querySelectorAll(".ac-acc-table tr[data-acc], .ac-acc-table tr[data-kind]").forEach(tr => {
        tr.addEventListener("dragover", e => { if (dragId == null || +tr.dataset.acc === dragId) return; e.preventDefault(); tr.classList.add("drop-on"); });
        tr.addEventListener("dragleave", () => tr.classList.remove("drop-on"));
        tr.addEventListener("drop", e => {
          e.preventDefault(); tr.classList.remove("drop-on");
          const id = dragId; dragId = null;
          if (id == null) return;
          if (tr.dataset.acc) dropOnAccount(id, +tr.dataset.acc); else dropOnKind(id, tr.dataset.kind);
        });
      });
    }
    async function dropOnAccount(id, targetId) {
      const a = acc(id), t = acc(targetId), row = ACC_ROWS.find(r => r.id === id) || { count: 0, net: 0 };

      const kl = KIND_LABEL();
      const body = `<p>Put <strong>${escapeHtml(a.path)}</strong> under <strong>${escapeHtml(t.path)}</strong>. Its lines (${row.count} in this period, ${fmtMoney(row.net)}),
          rules and sub-accounts come with it, and it counts in ${escapeHtml(t.name)}'s totals.</p>
        ${a.kind !== t.kind ? `<p class="neg">It changes from ${escapeHtml(kl[a.kind])} to ${escapeHtml(kl[t.kind])} — in the P&L and the Excel too.</p>` : ""}
        <p class="muted small">Or merge it: all its lines move onto ${escapeHtml(t.name)} itself and ${escapeHtml(a.name)} is removed (can't be undone).</p>`;
      const { value } = await askDialog({ title: "Move Account", body, buttons: [{ label: `Put Under ${t.name}`, value: "under", cls: "primary" }, { label: `Merge Into ${t.name}`, value: "merge" }, { label: "Cancel", value: null }] });
      if (value === "under") await moveAccount(id, { parent_id: targetId }, `${a.name} is now under ${t.name}`, { parent_id: a.parent_id || 0, kind: a.kind });
      else if (value === "merge") {
        try { const r = await apiFetch(`/api/accounting/accounts/${id}/merge?into_id=${targetId}`, { method: "POST" }); toast(`${r.moved} line(s) moved into ${t.name}`); await loadMeta(); show("accounts"); }
        catch (e) { alert(e.message); }
      }
    }
    async function dropOnKind(id, kind) {
      const a = acc(id), kl = KIND_LABEL();

      const { value } = await askDialog({ title: "Move Account", body: `<p>Make <strong>${escapeHtml(a.path)}</strong> a main account under ${escapeHtml(kl[kind])}${a.kind !== kind ? ` — it changes from ${escapeHtml(kl[a.kind])} to ${escapeHtml(kl[kind])}, in the P&L too` : ""}. Its lines come with it.</p>`,
        buttons: [{ label: "Move", value: true, cls: "primary" }, { label: "Cancel", value: null }] });
      if (value) await moveAccount(id, { parent_id: 0, kind }, `${a.name} is now a main account`, { parent_id: a.parent_id || 0, kind: a.kind });

    async function moveAccount(id, data, msg, old) {
      try {
        await apiFetch(`/api/accounting/accounts/${id}`, { method: "PUT", body: JSON.stringify(data) });
        await loadMeta(); show("accounts");
        toast(msg, { label: "Undo", run: async () => { try { await apiFetch(`/api/accounting/accounts/${id}`, { method: "PUT", body: JSON.stringify(old) }); await loadMeta(); show("accounts"); } catch (e) { alert(e.message); } } }, 9000);
      } catch (e) { alert(e.message); }

    // ---- pick lines: tick all / some / one, by group (rule Apply, "like this", Move Lines)
    function pickLines({ title, intro = "", groups, apply = "Apply", target = null, search = false }) {
      const row = (t, tickable, on) => `<tr data-text="${escapeHtml(((t.payee || "") + " " + t.description + " " + (t.note || "")).toLowerCase())}">${tickable ? `<td><input type="checkbox" class="pl-tick" data-id="${t.id}" data-amt="${t.amount}" ${on ? "checked" : ""}></td>` : "<td></td>"}
        <td class="nowrap">${day(t.date)}</td><td><span class="ac-who">${escapeHtml(t.payee || "")}</span><div class="ac-desc">${escapeHtml(t.description)}</div>${t.why ? `<div class="muted small">${escapeHtml(t.why)}</div>` : ""}</td>
        <td class="small" style="min-width:120px;">${escapeHtml(t.account || (t.splits && t.splits.length ? "split" : "—"))}</td><td class="ac-amt">${money(t.amount)}</td></tr>`;
      const shownGroups = groups.filter(g => g.lines.length);
      const body = `${intro ? `<p class="ac-help">${intro}</p>` : ""}
        ${target ? `<div class="ac-form" style="margin-bottom:8px;"><label>Move To</label><select id="pl-to">${accountOptions(target.selected || null)}</select></div>` : ""}
        <div class="ac-filters" style="margin-bottom:6px;">${search ? `<input type="search" id="pl-q" placeholder="Search these lines…">` : ""}
          <button type="button" class="small-btn" id="pl-all">Tick All${search ? " Shown" : ""}</button><button type="button" class="small-btn" id="pl-none">Tick None</button></div>
        <div style="max-height:52vh;overflow:auto;">${shownGroups.map((g, gi) => `
          <h4 style="margin:10px 0 4px;">${g.ticked !== null ? `<input type="checkbox" class="pl-grp" data-g="${gi}" ${g.ticked ? "checked" : ""} title="Tick all in this group"> ` : ""}${escapeHtml(g.label)} <span class="muted small">${g.lines.length}${g.hint ? " · " + escapeHtml(g.hint) : ""}</span></h4>
          <table class="compact-table no-table-tools" data-g="${gi}"><tbody>${g.lines.map(t => row(t, g.ticked !== null, g.ticked)).join("")}</tbody></table>`).join("") || `<p class="muted">No lines.</p>`}</div>`;
      const dlg = askDialog({ title, body, buttons: [{ label: apply, value: "apply", cls: "primary" }, { label: "Close", value: null }], wide: true });
      setTimeout(() => {
        const box = [...document.querySelectorAll(".ask-dialog")].pop();
        if (!box) return;
        const btn = box.querySelector('button[data-i="0"]');
        const upd = () => { const t = [...box.querySelectorAll(".pl-tick:checked")]; const sum = t.reduce((a, c) => a + (+c.dataset.amt || 0), 0); btn.textContent = `${apply} ${t.length} Ticked · ${fmtMoney(sum)}`; btn.disabled = !t.length; };
        const visible = () => [...box.querySelectorAll("tr[data-text]")].filter(r => r.style.display !== "none");
        box.querySelectorAll(".pl-tick").forEach(c => c.onchange = upd);
        box.querySelectorAll(".pl-grp").forEach(g => g.onchange = () => { box.querySelectorAll(`table[data-g="${g.dataset.g}"] .pl-tick`).forEach(c => c.checked = g.checked); upd(); });
        box.querySelector("#pl-all").onclick = () => { visible().forEach(r => { const c = r.querySelector(".pl-tick"); if (c) c.checked = true; }); upd(); };
        box.querySelector("#pl-none").onclick = () => { box.querySelectorAll(".pl-tick, .pl-grp").forEach(c => c.checked = false); upd(); };
        const q = box.querySelector("#pl-q");
        if (q) q.oninput = () => { const s = q.value.trim().toLowerCase(); box.querySelectorAll("tr[data-text]").forEach(r => r.style.display = !s || r.dataset.text.includes(s) ? "" : "none"); };
        const sel = box.querySelector("#pl-to");
        if (sel) sel.onchange = async () => {
          if (sel.value !== "new") return;
          const a = await accountDialog(null, target.kind || "expense", target.under || null);
          if (a) { await loadMeta(); sel.innerHTML = accountOptions(a.id); } else sel.value = "";
        };
        upd();
      }, 0);
      return dlg.then(({ value, el }) => {
        if (value !== "apply") return null;
        const ids = [...el.querySelectorAll(".pl-tick:checked")].map(c => +c.dataset.id);
        const to = el.querySelector("#pl-to") ? el.querySelector("#pl-to").value : null;
        return { ids, to: to && to !== "new" ? +to : null };
      });
    }
    async function moveLinesDialog(fromId, toId = null) {
      const from = acc(fromId);

      try { d = await apiFetch(`/api/accounting/txns?${new URLSearchParams({ account_id: fromId, all_dates: true, limit: 2000 })}`); } catch (e) { alert(e.message); return; }
      const res = await pickLines({ title: `Move Lines Out Of ${from.name}`, intro: `${d.rows.length} line(s) in <strong>${escapeHtml(from.path)}</strong> (with its sub-accounts), every date. Tick the ones to move and pick where they go.`,
        groups: [{ label: from.path, lines: d.rows, ticked: false }], apply: "Move", target: { selected: toId, kind: from.kind, under: fromId }, search: true });
      if (!res) { show(TAB); return; }
      if (!res.to) { alert("Pick where they go"); return; }
      if (!res.ids.length) return;
      try { const r = await apiFetch("/api/accounting/txns/bulk", { method: "POST", body: JSON.stringify({ ids: res.ids, action: "file", account_id: res.to }) }); toast(`${r.done} line(s) moved to ${acc(res.to).path}`); }

    // ---- rules
    async function ruleMeta() { return RMETA = RMETA || await apiFetch("/api/accounting/rules/meta"); }
    function ruleWords(desc) {  // a rule's words from a bank line: the first few words that aren't numbers / reference codes
      return (desc || "").toUpperCase().replace(/REF ?#\s?\S+|#\S+/g, " ").split(/\s+/).filter(w => w && !/\d/.test(w) && !["ON", "TO", "FROM"].includes(w)).slice(0, 3).join(" ");
    }
    async function exportRules() { try { await downloadFile("/api/accounting/rules-export.xlsx", "Accounting Rules.xlsx"); } catch (e) { alert(e.message); } }
    async function ruleOnOff(id, on) { await apiFetch(`/api/accounting/rules/${id}/enabled`, { method: "PUT", body: JSON.stringify({ enabled: on }) }); show("accounts"); }
    async function copyRule(id) { const r = await apiFetch(`/api/accounting/rules/${id}/copy`, { method: "POST" }); toast("Copied — the copy starts switched off"); await show("accounts"); newRule((await apiFetch("/api/accounting/rules")).find(x => x.id === r.id)); }
    async function saveRuleOrder(ids) { await apiFetch("/api/accounting/rules-order", { method: "PUT", body: JSON.stringify({ ids }) }); show("accounts"); }
    function moveRule(id, step) {
      const ids = RULES.map(r => r.id), i = ids.indexOf(id), j = i + step;
      if (j < 0 || j >= ids.length) return;
      [ids[i], ids[j]] = [ids[j], ids[i]];
      saveRuleOrder(ids);
    }
    function wireRuleDrag() {
      let dragId = null;
      view().querySelectorAll("#rules-table tr[data-rule]").forEach(tr => {
        tr.addEventListener("dragstart", e => { dragId = +tr.dataset.rule; e.dataTransfer.setData("text/plain", tr.dataset.rule); tr.classList.add("dragging"); });
        tr.addEventListener("dragend", () => { tr.classList.remove("dragging"); view().querySelectorAll(".drop-on").forEach(x => x.classList.remove("drop-on")); });
        tr.addEventListener("dragover", e => { if (dragId == null || +tr.dataset.rule === dragId) return; e.preventDefault(); tr.classList.add("drop-on"); });
        tr.addEventListener("dragleave", () => tr.classList.remove("drop-on"));
        tr.addEventListener("drop", e => {
          e.preventDefault(); tr.classList.remove("drop-on");
          const id = dragId; dragId = null;
          if (id == null) return;
          const ids = RULES.map(r => r.id).filter(x => x !== id);
          ids.splice(ids.indexOf(+tr.dataset.rule), 0, id);  // dropped above the row it's dropped on
          saveRuleOrder(ids);
        });
      });
    }
    // the rule builder: money in / out, bank accounts, ALL / ANY conditions, then account / split / payee / note, files or suggests
    async function newRule(r = {}) {
      const M = await ruleMeta();
      const fields = { ...M.text_fields, ...M.num_fields };
      const conds = r.conditions && r.conditions.length ? r.conditions : [{ field: "text", op: "contains", value: r.contains || "" }];
      const opsFor = f => f in M.num_fields ? M.num_ops : M.text_ops;
      const condRow = (c = { field: "text", op: "contains", value: "" }) => {
        const between = c.op === "between", v = between && Array.isArray(c.value) ? c.value : [c.value ?? "", ""];
        return `<div class="rb-cond"><select class="rb-f">${Object.entries(fields).map(([k, l]) => `<option value="${k}" ${k === c.field ? "selected" : ""}>${escapeHtml(l)}</option>`).join("")}</select>
          <select class="rb-op">${Object.entries(opsFor(c.field)).map(([k, l]) => `<option value="${k}" ${k === c.op ? "selected" : ""}>${escapeHtml(l)}</option>`).join("")}</select>
          <input class="rb-v" value="${escapeHtml(between ? v[0] : (Array.isArray(c.value) ? "" : c.value ?? ""))}" placeholder="${c.field in M.num_fields ? "number" : 'words, or "a phrase"'}">
          <input class="rb-v2" value="${escapeHtml(between ? v[1] : "")}" placeholder="and" style="${between ? "" : "visibility:hidden;"}">
          <button type="button" class="small-btn icon-only rb-x" title="Remove">${icon("x")}</button></div>`;
      };
      const splitRow = (x = {}) => `<div class="rb-split"><select class="rb-sa">${accountOptions(x.account_id || null)}</select>
        <input class="rb-sv" type="number" step="0.01" value="${x.pct ?? x.amount ?? ""}" placeholder="0"><select class="rb-st"><option value="pct" ${x.amount != null && x.pct == null ? "" : "selected"}>%</option><option value="amount" ${x.amount != null && x.pct == null ? "selected" : ""}>$</option></select>
        <button type="button" class="small-btn icon-only rb-x" title="Remove">${icon("x")}</button></div>`;
      const banks = META.sources.filter(s => s.kind !== "book");
      const body = `<div class="ac-form">
          <label>Name</label><input id="rb-name" value="${escapeHtml(r.name || "")}" placeholder="optional, e.g. Saul's pay">
          <label>Money</label><select id="rb-sign"><option value="">In or out</option><option value="out" ${r.sign === "out" ? "selected" : ""}>Money out</option><option value="in" ${r.sign === "in" ? "selected" : ""}>Money in</option></select>
          <label>Bank Accounts</label><div>${banks.map(s => `<label class="inline-check" style="margin-right:10px;"><input type="checkbox" class="rb-src" value="${s.id}" ${(r.source_ids || []).includes(s.id) ? "checked" : ""}> ${escapeHtml(s.name)}</label>`).join("")}<span class="muted small">none ticked = all</span></div>
          <label>When</label><select id="rb-match"><option value="all" ${r.match !== "any" ? "selected" : ""}>ALL of these are true (and)</option><option value="any" ${r.match === "any" ? "selected" : ""}>ANY of these is true (or)</option></select>
        </div>
        <div id="rb-conds" style="margin:8px 0 4px;">${conds.map(condRow).join("")}</div>
        <button type="button" class="small-btn" id="rb-addc">${icon("plus")} Condition</button>
        <p class="muted small" style="margin:6px 0 10px;">Whole words, any order — "SAUL" won't match "SAULT". Put words in "quotes" to need them side by side. "Contains any of" takes a comma list: SAUL, FAUSTINO.</p>
        <div class="ac-form">
          <label>Put It In</label><select id="rb-acc">${accountOptions(r.account_id || null)}</select>
          <label>Split</label><div><div id="rb-splits">${(r.splits || []).map(splitRow).join("")}</div><button type="button" class="small-btn" id="rb-adds">${icon("plus")} Split Part</button>
            <span class="muted small">% or $ of the line; the rest goes in "Put It In"</span></div>
          <label>Set Payee</label><input id="rb-payee" value="${escapeHtml(r.set_payee || "")}" placeholder="optional">
          <label>Add Note</label><input id="rb-note" value="${escapeHtml(r.set_note || "")}" placeholder="optional (only on lines without a note)">
          <label>Then</label><div><label class="inline-check"><input type="radio" name="rb-action" value="file" ${r.action !== "suggest" ? "checked" : ""}> File the line by itself</label>
            <label class="inline-check" style="margin-left:12px;"><input type="radio" name="rb-action" value="suggest" ${r.action === "suggest" ? "checked" : ""}> Only suggest it (one click in Review)</label></div>
          <label></label><label class="inline-check"><input type="checkbox" id="rb-on" ${r.enabled === false ? "" : "checked"}> Rule switched on</label>
          <label></label><div id="rb-count" class="muted small">…</div>
        </div>`;
      const dlg = askDialog({ title: r.id ? "Change Rule" : "New Rule", body, buttons: [{ label: "Save & See Matches", value: true, cls: "primary" }, { label: "Cancel", value: null }], wide: true });
      const read = (root = document) => {
        const q = s => root.querySelector(s);
        const a = q("#rb-acc").value;
        return {
          name: q("#rb-name").value.trim(), match: q("#rb-match").value, sign: q("#rb-sign").value || null,
          source_ids: [...root.querySelectorAll(".rb-src:checked")].map(c => +c.value),
          conditions: [...root.querySelectorAll(".rb-cond")].map(d => {
            const f = d.querySelector(".rb-f").value, op = d.querySelector(".rb-op").value, v1 = d.querySelector(".rb-v").value.trim(), v2 = d.querySelector(".rb-v2").value.trim();
            return { field: f, op, value: op === "between" ? (v1 && v2 ? [v1, v2] : "") : v1 };
          }).filter(c => c.value !== ""),
          account_id: a && a !== "new" ? +a : null,
          splits: [...root.querySelectorAll(".rb-split")].map(d => { const a2 = d.querySelector(".rb-sa").value, v = d.querySelector(".rb-sv").value, t = d.querySelector(".rb-st").value;
            return a2 && a2 !== "new" && v !== "" ? { account_id: +a2, [t]: parseFloat(v) } : null; }).filter(Boolean),
          set_payee: q("#rb-payee").value.trim() || null, set_note: q("#rb-note").value.trim() || null,
          action: (root.querySelector('input[name="rb-action"]:checked') || {}).value || "file", enabled: q("#rb-on").checked,
        };
      };
      let timer = null;
      const count = () => {
        clearTimeout(timer);
        timer = setTimeout(async () => {
          const box = document.getElementById("rb-count"); if (!box) return;
          const b = read();
          if (!b.conditions.length) { box.textContent = "Add a condition to see how many lines match."; return; }
          try {
            const d = await apiFetch("/api/accounting/rules/preview", { method: "POST", body: JSON.stringify(b) });
            const g = d.groups;
            box.innerHTML = `<strong>${d.count}</strong> line(s) match: ${g.unfiled.length} not filed, ${g.auto.length} filed by AT-HUB, ${g.elsewhere.length} filed elsewhere by a person, ${g.here.length} already there${g.split.length ? `, ${g.split.length} split (left alone)` : ""}.`;
          } catch (e) { box.textContent = e.message; }
        }, 350);
      };
      setTimeout(() => {
        const box = [...document.querySelectorAll(".ask-dialog")].pop();
        if (!box) return;
        const wire = () => {
          box.querySelectorAll(".rb-cond").forEach(d => {
            const f = d.querySelector(".rb-f"), op = d.querySelector(".rb-op"), v2 = d.querySelector(".rb-v2");
            f.onchange = () => { op.innerHTML = Object.entries(opsFor(f.value)).map(([k, l]) => `<option value="${k}">${escapeHtml(l)}</option>`).join(""); d.querySelector(".rb-v").placeholder = f.value in M.num_fields ? "number" : 'words, or "a phrase"'; v2.style.visibility = "hidden"; count(); };
            op.onchange = () => { v2.style.visibility = op.value === "between" ? "" : "hidden"; count(); };
          });
          box.querySelectorAll(".rb-x").forEach(x => x.onclick = () => { x.parentNode.remove(); count(); });
          box.querySelectorAll("select.rb-sa, #rb-acc").forEach(s => s.onchange = async () => { if (s.value === "new") await pickNew(s, -1); count(); });
        };
        box.querySelector("#rb-addc").onclick = () => { box.querySelector("#rb-conds").insertAdjacentHTML("beforeend", condRow()); wire(); };
        box.querySelector("#rb-adds").onclick = () => { box.querySelector("#rb-splits").insertAdjacentHTML("beforeend", splitRow()); wire(); };
        box.addEventListener("input", count);
        box.addEventListener("change", count);
        wire(); count();
      }, 0);
      const { value, el } = await dlg;
      if (!value) return;
      try {
        const out = await apiFetch(`/api/accounting/rules${r.id ? "/" + r.id : ""}`, { method: r.id ? "PUT" : "POST", body: JSON.stringify(read(el)) });
        await rulePreview(out.id);

    // every line a rule matches, grouped; tick all / some / one and put them where the rule says
    async function rulePreview(ruleId) {

      try { [d, rule] = await Promise.all([apiFetch(`/api/accounting/rules/${ruleId}/lines`), apiFetch("/api/accounting/rules").then(rs => rs.find(x => x.id === ruleId))]); }
      catch (e) { alert(e.message); return; }
      const where = rule.splits.length ? "the rule's split" : rule.account;
      const res = await pickLines({ title: "Apply Rule",
        intro: `${rule.name ? `<strong>${escapeHtml(rule.name)}</strong> · ` : ""}${escapeHtml(rule.summary)} → <strong>${escapeHtml(where)}</strong> · ${d.count} line(s) match (every date).
          Tick the ones to put there.${rule.enabled ? "" : " <span class='neg'>This rule is switched off — new lines won't be filed by it.</span>"}`,
        groups: [{ label: "Not Filed", lines: d.groups.unfiled, ticked: true }, { label: "Filed By AT-HUB, Not Looked At", lines: d.groups.auto, ticked: true },
          { label: "Filed Elsewhere By A Person", lines: d.groups.elsewhere, ticked: false, hint: "someone put these in another account — tick only the ones this rule should move" },
          { label: `Already ${rule.splits.length ? "Split This Way" : "In " + rule.account}`, lines: d.groups.here, ticked: null },
          { label: "Split Over Accounts (Left Alone)", lines: d.groups.split, ticked: null }], apply: "Apply To" });
      if (res && res.ids.length) {
        try { const r = await apiFetch(`/api/accounting/rules/${ruleId}/apply`, { method: "POST", body: JSON.stringify({ ids: res.ids }) }); toast(`${r.filed} line(s) put in ${where}`); }
        catch (e) { alert(e.message); }
      }
      refreshCount();
      show(TAB);
    }

          payments as Transfers / Wash and the card's lines carry the detail — nothing is counted twice.</p>
        <table class="compact-table"><thead><tr><th>Name</th><th>Type</th><th class="num">Lines</th><th>Last Line</th><th>Opening Balance</th><th class="num">Balance</th><th></th></tr></thead><tbody>
        ${META.sources.map(s => `<tr ${s.is_active ? "" : 'style="opacity:.55"'}><td><strong>${escapeHtml(s.name)}</strong>${s.last4 ? ` <span class="muted">…${escapeHtml(s.last4)}</span>` : ""}</td>
          <td>${s.kind === "book" ? "Book entries" : s.kind === "card" ? "Credit card" : "Bank"}</td><td class="num">${s.lines}</td><td>${day(s.last_date)}</td>
          <td>${s.kind === "book" ? "" : s.opening_date ? `${fmtMoney(s.opening_balance)} on ${day(s.opening_date)}` : `<span class="muted">not set</span>`}</td>
          <td class="ac-amt">${s.kind !== "book" && s.opening_date ? money(s.balance) : ""}</td>
          <td class="nowrap">${s.kind === "book" ? "" : `<button class="small-btn" onclick="importDialog(${s.id})">${icon("upload")} Bring In Statement</button>
            <button class="small-btn icon-only" title="Change" onclick="sourceDialog(${s.id})">${icon("pencil")}</button>
            <button class="small-btn icon-only" title="QuickBooks bank file (CSV) for the period" onclick="qbExport(${s.id})">${icon("download")}</button>`}</td></tr>`).join("")}</tbody></table></div>
      <div class="card"><div class="ac-filters"><h3 style="margin:0;">Files Brought In</h3><span style="flex:1"></span><button class="small-btn" onclick="show('ignored')">Ignored &amp; Possible Duplicates</button></div>
        <table class="compact-table"><thead><tr><th>When</th><th>Account</th><th>File</th><th class="num">Lines</th><th class="num">New</th><th class="num">Already In</th><th class="num">Matched</th><th class="num">Auto-Filed</th><th></th></tr></thead><tbody>
        ${imps.map(i => `<tr><td class="nowrap">${fmtWhen(i.created_at)}<div class="muted small">${escapeHtml(i.created_by || "")}</div></td><td>${escapeHtml(i.source)}</td>
          <td>${escapeHtml(i.filename || "")}${i.kind === "workbook" ? ` <span class="ac-chip">Workbook</span>` : ""}</td><td class="num">${i.rows}</td><td class="num">${i.added}</td>
          <td class="num">${i.skipped}</td><td class="num" title="Typed in earlier, found on the statement">${i.matched}</td><td class="num">${i.auto}</td>
          <td>${i.still_there ? `<button class="small-btn" onclick="undoImport(${i.id}, ${i.still_there})">Undo</button>` : `<span class="muted small">undone</span>`}</td></tr>`).join("")
          || `<tr><td colspan="9" class="muted">Nothing brought in yet.</td></tr>`}</tbody></table>
        <p class="ac-help" style="margin-top:8px;">Bringing in the same statement twice is safe: lines already in are skipped. A line you typed in ahead (same amount, within 7 days) is matched, not doubled.</p></div>`;
    }
    async function sourceDialog(id) {
      const s = id ? META.sources.find(x => x.id === id) : null;
      const body = `<div class="ac-form">
        <label>Name</label><input id="sd-name" value="${escapeHtml(s?.name || "")}" placeholder="e.g. Wells Fargo Checking">
        <label>Type</label><select id="sd-kind"><option value="bank" ${s?.kind !== "card" ? "selected" : ""}>Bank account</option><option value="card" ${s?.kind === "card" ? "selected" : ""}>Credit card</option></select>
        <label>Last 4</label><input id="sd-last4" value="${escapeHtml(s?.last4 || "")}" maxlength="4">
        <label>Opening Balance</label><input type="number" step="0.01" id="sd-open" value="${s?.opening_balance || ""}">
        <label>On Date</label><input type="date" id="sd-date" value="${s?.opening_date || ""}">
        ${s ? `<label></label><label class="inline-check"><input type="checkbox" id="sd-active" ${s.is_active ? "checked" : ""}> In use</label>` : ""}
      </div><p class="ac-help" style="margin-top:8px;">Opening balance = the balance at the start of that day; lines from that day on are added to it.</p>`;
      const buttons = [{ label: "Save", value: "save", cls: "primary" }, { label: "Cancel", value: null }];
      if (s && !s.lines) buttons.push({ label: "Delete", value: "delete", cls: "danger" });
      const { value, el } = await askDialog({ title: s ? s.name : "Add Bank Account / Card", body, buttons });
      if (!value) return;
      const q = x => el.querySelector(x);
      try {
        if (value === "delete") await apiFetch(`/api/accounting/sources/${id}`, { method: "DELETE" });
        else await apiFetch(`/api/accounting/sources${s ? "/" + id : ""}`, { method: s ? "PUT" : "POST", body: JSON.stringify({ name: q("#sd-name").value, kind: q("#sd-kind").value, last4: q("#sd-last4").value,
          opening_balance: parseFloat(q("#sd-open").value || 0), opening_date: q("#sd-date").value || "", ...(s ? { is_active: q("#sd-active").checked } : {}) }) });
        await loadMeta(); show("statements");
      } catch (e) { alert(e.message); }
    }
    async function qbExport(id) {
      const s = META.sources.find(x => x.id === id);
      try { await downloadFile(`/api/accounting/export/quickbooks.csv?${qs({ source_id: id })}`, `${s.name} QuickBooks.csv`); } catch (e) { alert(e.message); }
    }
    async function undoImport(id, n) {
      if (!(await askDialog({ title: "Undo this import?", body: `<p>${n} line(s) from this file are removed (typed-in lines it matched stay).</p>`, buttons: [{ label: "Undo Import", value: true, cls: "danger" }, { label: "Cancel", value: null }] })).value) return;
      try { const r = await apiFetch(`/api/accounting/imports/${id}`, { method: "DELETE" }); toast(`${r.removed} line(s) removed`); await loadMeta(); show("statements"); refreshCount(); } catch (e) { alert(e.message); }
    }
    // pick a file -> AT-HUB reads it and shows which column it thinks is which -> change any -> bring it in
    let IMP = null;
    async function importDialog(sourceId) {
      const pick = Object.assign(document.createElement("input"), { type: "file", accept: ".csv,.xlsx,.xlsm,.txt" });
      pick.onchange = async () => {
        const file = pick.files[0]; if (!file) return;
        IMP = { file, sourceId, layout: null };
        await previewImport();
      };
      pick.click();
    }
    async function previewImport() {
      const fd = new FormData(); fd.append("source_id", IMP.sourceId); fd.append("file", IMP.file);
      if (IMP.layout) fd.append("layout", JSON.stringify(IMP.layout));
      let p;
      try { p = await apiUpload("/api/accounting/import/preview", fd); } catch (e) { alert(e.message); return; }
      IMP.layout = p.layout;
      IMP.first = p.first; IMP.last = p.last;
      const col = (key, label, optional) => `<div><label>${label}</label><select class="mp" data-k="${key}">${optional ? `<option value="">—</option>` : `<option value="">— pick —</option>`}${p.headers.map((h, i) => `<option value="${i}" ${p.layout[key] === i ? "selected" : ""}>${escapeHtml(h)}</option>`).join("")}</select></div>`;
      const src = META.sources.find(s => s.id === IMP.sourceId);
      const body = `<p class="ac-help">${escapeHtml(IMP.file.name)} → <strong>${escapeHtml(src.name)}</strong>. Check AT-HUB read the columns right (it remembers them for this account).</p>
        <label class="inline-check"><input type="checkbox" id="mp-head" ${p.layout.has_header ? "checked" : ""}> The first row is column names</label>
        <div class="ac-map">${col("date", "Date")}${col("description", "Description")}${col("amount", "Amount (+ in, − out)", true)}${col("debit", "Or: Debit (out)", true)}${col("credit", "And: Credit (in)", true)}
          ${col("account", "Account (your workbook)", true)}${col("category", "Category (your workbook)", true)}</div>
        <div class="table-scroll"><table class="compact-table ac-sample"><tbody>${p.sample.map(r => `<tr>${r.map(c => `<td title="${escapeHtml(c)}">${escapeHtml(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
        <div class="ac-tiles" style="margin-top:10px;"><div class="ac-tile"><div class="l">Lines Read</div><div class="v">${p.rows}</div><div class="s">${day(p.first)} – ${day(p.last)}</div></div>
          <div class="ac-tile"><div class="l">New</div><div class="v">${p.new}</div><div class="s">come in</div></div>
          <div class="ac-tile"><div class="l">Already In</div><div class="v">${p.already}</div><div class="s">ignored (listed on Ignored)</div></div>
          ${p.possible ? `<div class="ac-tile"><div class="l">Possible Duplicates</div><div class="v neg">${p.possible}</div><div class="s">you decide on Ignored</div></div>` : ""}
          ${p.expected ? `<div class="ac-tile"><div class="l">Typed In Earlier</div><div class="v">${p.expected}</div><div class="s">matched, not doubled</div></div>` : ""}
          ${p.estimate ? `<div class="ac-tile"><div class="l">AR / AP Estimates</div><div class="v">${p.estimate}</div><div class="s">not brought in</div></div>` : ""}
          <div class="ac-tile"><div class="l">In / Out</div><div class="v" style="font-size:15px;">${fmtMoney(p.money_in)}<br>${fmtMoney(p.money_out)}</div></div></div>
        ${p.workbook ? `<p class="ac-help"><strong>Your workbook:</strong> every line comes in already filed under its Account (accounts made from your names, typed by Category: Payments → Income,
          COGS, Expense, Loans, Shares → Partner Draws, Wash → Transfers; Pending (AR / AP estimates) is kept but set aside — not counted). This also teaches AT-HUB how you file.</p>` : ""}
        ${p.bad_count ? `<p class="muted small">${p.bad_count} row(s) without a date or amount are left out: ${p.bad.slice(0, 3).map(escapeHtml).join(" · ")}</p>` : ""}
        <div class="table-scroll" style="max-height:220px;"><table class="compact-table ac-sample"><thead><tr><th>Date</th><th class="num">Amount</th><th>Description</th>${p.workbook ? "<th>Account</th><th>Category</th>" : ""}</tr></thead>
          <tbody>${p.parsed.map(r => `<tr><td>${r.date}</td><td class="ac-amt">${fmtMoney(r.amount)}</td><td>${escapeHtml(r.description)}</td>${p.workbook ? `<td>${escapeHtml(r.account || "")}</td><td>${escapeHtml(r.category || "")}</td>` : ""}</tr>`).join("")}</tbody></table></div>`;
      const dlg = askDialog({ title: "Bring In Statement", body, buttons: [{ label: `Bring In ${p.rows - p.already} Line(s)`, value: "go", cls: "primary" }, { label: "Cancel", value: null }], wide: true });
      setTimeout(() => {
        document.querySelectorAll(".mp, #mp-head").forEach(s => s.onchange = () => {
          const lay = { has_header: document.getElementById("mp-head").checked };
          document.querySelectorAll(".mp").forEach(x => { if (x.value !== "") lay[x.dataset.k] = +x.value; });
          if (lay.amount != null) { delete lay.debit; delete lay.credit; }
          IMP.layout = lay;
          IMP.again = true;
          [...document.querySelectorAll(".ask-dialog button")].find(b => b.textContent === "Cancel")?.click();
        });
      }, 0);
      const { value } = await dlg;
      if (IMP.again) { IMP.again = false; return previewImport(); }
      if (value !== "go") return;
      const fd2 = new FormData(); fd2.append("source_id", IMP.sourceId); fd2.append("file", IMP.file); fd2.append("layout", JSON.stringify(IMP.layout));
      try {
        const r = await apiUpload("/api/accounting/import", fd2);
        await askDialog({ title: "Brought In", body: `<p><strong>${r.added}</strong> new line(s)${r.skipped ? `, ${r.skipped} already in (ignored)` : ""}${r.matched ? `, ${r.matched} typed-in line(s) matched` : ""}.</p>
          ${r.possible ? `<p class="neg"><strong>${r.possible}</strong> look like lines already in — waiting on the <a class="link" href="#" onclick="document.querySelector('.ask-dialog button[data-i]').click();setTimeout(()=>show('ignored'),50);return false;">Ignored</a> tab for you to decide.</p>` : ""}
          ${r.estimates ? `<p>${r.estimates} AR / AP estimate row(s) weren't brought in (listed on Ignored).</p>` : ""}
          ${r.auto ? `<p>${r.auto} filed by AT-HUB from earlier lines (marked Auto).</p>` : ""}${r.left ? `<p><strong>${r.left}</strong> to file.</p>` : ""}
          <p class="muted small">The output Excel covers ${day(IMP.first < IMP.last ? IMP.first : IMP.last)} – ${day(IMP.first < IMP.last ? IMP.last : IMP.first)}, this file's dates.</p>`,
          buttons: [...(r.left ? [{ label: "File Them Now", value: "file", cls: "primary" }] : []), { label: "Download Output Excel", value: "xlsx", cls: r.left ? "" : "primary" }, { label: "Close", value: null }] })
          .then(x => { if (x.value === "xlsx") { const [a, b] = [IMP.first, IMP.last].sort(); exportXlsx(a, b); show("statements"); } else if (x.value === "file") show("review"); else show("statements"); });
        await loadMeta(); refreshCount();
      } catch (e) { alert(e.message); }
    }

    const LOADERS = { overview: tabOverview, review: tabInbox, inbox: tabInbox, txns: tabTxns, pnl: tabPnl, accounts: tabAccounts, loans: tabLoans, partners: tabPartners,
      apar: tabApar, cash: tabCash, statements: tabStatements, ...(window.MORE_LOADERS || {}) };
    (async () => {
      try { await loadMeta(); } catch (e) { view().innerHTML = `<div class="card error">${escapeHtml(e.message)}</div>`; return; }
      drawPeriod();
      const h = location.hash.slice(1);
      TAB = LOADERS[h] ? h : store.get("tab", "review");
      if (!LOADERS[TAB]) TAB = "overview";
      await refreshCount();
      show(TAB);
    })();
  </script>
</body>
</html>
