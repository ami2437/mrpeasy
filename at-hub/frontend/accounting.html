<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AT-HUB — Accounting</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth-guard.js"></script>
  <script src="accounting-more.js"></script>
  <script src="accounting-loans.js"></script>
  <style>
    .ac-top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .ac-top .tabs { margin: 0; flex-wrap: wrap; order: 3; flex-basis: 100%; width: auto; max-width: 100%; box-sizing: border-box; }
    .ac-top .tabs .tab { padding: 5px 11px; font-size: 13.5px; }
    .ac-period { display: inline-flex; gap: 6px; align-items: center; margin-left: auto; }
    .ac-period select, .ac-period input { width: auto; }
    .ac-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 0 0 14px; }
    .ac-tile { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; cursor: default; }
    .ac-tile.click { cursor: pointer; } .ac-tile.click:hover { border-color: var(--accent); }
    .ac-tile .l { font-size: 11.5px; color: var(--muted); font-weight: 600; text-transform: capitalize; }
    .ac-tile .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
    .ac-tile .s { font-size: 12px; color: var(--muted); }
    .pos { color: #16a34a; } .neg { color: #dc2626; }
    .ac-amt { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .ac-desc { font-size: 12px; color: var(--muted); word-break: break-word; }
    .ac-who { font-weight: 600; }
    .ac-chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 9px; background: var(--surface-3); color: var(--text-2); margin-left: 4px; white-space: nowrap; }
    .ac-chip.auto { background: #fef3c7; color: #92400e; } .ac-chip.typed { background: #dbeafe; color: #1e40af; } .ac-chip.exp { background: #ede9fe; color: #5b21b6; }
    :root[data-theme="dark"] .ac-chip.auto { background: #4a3a10; color: #fcd34d; } :root[data-theme="dark"] .ac-chip.typed { background: #1e3a5f; color: #93c5fd; }
    :root[data-theme="dark"] .ac-chip.exp { background: #3b2a5f; color: #c4b5fd; }
    .ac-sugg { white-space: nowrap; }
    .ac-pnl { width: 100%; font-size: 12px; table-layout: auto; }
    .ac-pnl td, .ac-pnl th { padding: 4px 5px; }
    .ac-pnl th.num, .ac-pnl td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .ac-pnl tr.sec td { font-weight: 700; background: var(--surface-2); }
    .ac-pnl tr.tot td { font-weight: 700; border-top: 1px solid var(--border); }
    .ac-pnl tr.profit td { font-weight: 700; font-size: 13.5px; border-top: 2px solid var(--border); }
    .ac-pnl tr.drill { cursor: pointer; } .ac-pnl tr.drill:hover td { background: var(--surface-2); }
    .ac-pnl tr.sub td { color: var(--text-2); }
    .ac-pnl td.name { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ac-bars { display: flex; align-items: flex-end; gap: 4px; height: 150px; padding: 8px 0 0; border-bottom: 1px solid var(--border); }
    .ac-bars .m { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; }
    .ac-bars .b { width: 42%; min-height: 1px; border-radius: 3px 3px 0 0; }
    .ac-bars .pair { display: flex; gap: 2px; align-items: flex-end; width: 100%; justify-content: center; height: 100%; }
    .ac-bars .in { background: #2f6fed; } .ac-bars .out { background: #eb6834; }
    .ac-bars-lab { display: flex; gap: 4px; } .ac-bars-lab span { flex: 1; text-align: center; font-size: 11px; color: var(--muted); }
    .ac-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 1100px) { .ac-grid2 { grid-template-columns: 1fr; } }
    .ac-steps td { padding: 5px 8px; } .ac-steps tr.total td { font-weight: 700; border-top: 2px solid var(--border); }
    .ac-form { display: grid; grid-template-columns: 130px 1fr; gap: 8px 10px; align-items: center; }
    .ac-form label { font-size: 12.5px; color: var(--text-2); font-weight: 600; }
    .ac-split { display: grid; grid-template-columns: 1fr 110px 1fr 28px; gap: 6px; margin-bottom: 6px; }
    .ac-map { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 8px 0; }
    .ac-map label { font-size: 12px; font-weight: 600; color: var(--text-2); display: block; }
    .ac-sample { font-size: 11.5px; } .ac-sample td { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ac-bulk { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 10px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
    .ac-bulk select { width: auto; max-width: 260px; }
    table.ac-list td { vertical-align: top; }
    table.ac-list td.tick { width: 22px; }
    .ac-list select.ac-pick { width: 100%; max-width: 230px; font-size: 12.5px; padding: 3px 6px; }
    .ac-filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
    .ac-filters select, .ac-filters input { width: auto; }
    .ac-filters input[type=search] { flex: 1; min-width: 200px; }
    .ac-help { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; }
    .ac-status-paid { text-decoration: line-through; color: var(--muted); }
    .ac-grip { cursor: grab; color: var(--muted); margin-right: 6px; letter-spacing: -2px; user-select: none; }
    tr.dragging { opacity: .45; }
    tr.drop-on td { background: var(--surface-3) !important; box-shadow: inset 0 2px 0 var(--accent); }
    .rb-cond { display: grid; grid-template-columns: 200px 160px 1fr 140px 34px; gap: 6px; margin-bottom: 6px; align-items: center; }
    .rb-cond .rb-x, .rb-split .rb-x { width: 34px; }
    .rb-split { display: grid; grid-template-columns: 1fr 90px 60px 34px; gap: 6px; margin-bottom: 6px; align-items: center; }
    .ac-sugg-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; }
    .ac-sugg-card { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--surface-2); min-width: 0; }
    .ac-sugg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
    .ac-sugg-row input, .ac-sugg-row select { width: 100%; min-width: 0; font-size: 12.5px; }
    .ac-session { font-size: 12.5px; color: var(--text-2); }
    .ac-top .tabs { display: flex; flex-wrap: wrap; gap: 6px; border: none; background: none; padding: 0; box-shadow: none; }
    .ac-tabbox { display: inline-flex; flex-direction: column; border: 1px solid var(--border); border-radius: 9px; background: var(--surface-2); padding: 2px 4px 4px; }
    .ac-tabbox .ac-tabgrp { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 1px 6px 2px; display: flex; gap: 5px; align-items: center; }
    .ac-tabbox .ac-tabgrp .ico { width: 12px; height: 12px; }
    .ac-tabbox .ac-tabrow { display: flex; flex-wrap: wrap; gap: 2px; }
    .ac-tabbox.has-active { border-color: var(--accent); }
    .ac-top .tabs .tab { padding: 3px 9px; font-size: 13px; border-radius: 6px; border: none; margin: 0; }
    .ac-top .tabs .tab.active { background: var(--accent); color: #fff; }
    #ac-view .card table:not(.no-sticky) > thead > tr > th { position: sticky; top: var(--ac-stick, 0px); z-index: 2; background: var(--surface); box-shadow: inset 0 -1px 0 var(--border); }
    #ac-view .ask-dialog table > thead > tr > th, .ask-dialog table > thead > tr > th { position: sticky; top: 0; z-index: 2; background: var(--surface); }
    th.ac-sort { cursor: pointer; user-select: none; } th.ac-sort:hover { color: var(--accent); }
    th.ac-sort[data-dir="asc"]::after { content: " ▲"; font-size: 9px; } th.ac-sort[data-dir="desc"]::after { content: " ▼"; font-size: 9px; }
    .ac-chip.flag { background: #fee2e2; color: #991b1b; font-weight: 600; } :root[data-theme="dark"] .ac-chip.flag { background: #5f1e1e; color: #fecaca; }
    .ac-chip.check { background: #ffedd5; color: #9a3412; } :root[data-theme="dark"] .ac-chip.check { background: #4a2a10; color: #fdba74; }
    .ac-memo { font-size: 11.5px; color: var(--muted); opacity: .75; text-decoration: line-through dotted; word-break: break-word; }
    .ac-conflict { margin-top: 4px; padding: 5px 8px; border: 1px solid #fca5a5; border-radius: 7px; background: #fff5f5; }
    :root[data-theme="dark"] .ac-conflict { background: #2a1414; border-color: #7f1d1d; }
    .ac-splitsum { font-size: 12.5px; margin: 4px 0 8px; } .ac-splitsum.bad { color: #dc2626; font-weight: 600; } .ac-splitsum.good { color: #16a34a; font-weight: 600; }
    .ac-err { color: #dc2626; font-weight: 600; margin: 6px 0; }
    .rb-group { border: 1px dashed var(--border); border-radius: 8px; padding: 6px 8px; margin-bottom: 6px; background: var(--surface-2); }
    .rb-group .rb-cond { grid-template-columns: 180px 150px 1fr 130px 34px; }
    .ac-x-ok { color: #16a34a; font-weight: 700; } .ac-x-no { color: #dc2626; font-weight: 700; }
    .ac-how { display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 9px; margin-left: 4px; vertical-align: 1px; }
    .ac-how .ico { width: 11px; height: 11px; }
    .ac-how.person { background: #dcfce7; color: #166534; } .ac-how.rule { background: #e0e7ff; color: #3730a3; } .ac-how.auto { background: #fef3c7; color: #92400e; }
    .ac-how.workbook { background: #f3e8ff; color: #6b21a8; } .ac-how.split { background: #cffafe; color: #155e75; }
    :root[data-theme="dark"] .ac-how.person { background: #14361f; color: #86efac; } :root[data-theme="dark"] .ac-how.rule { background: #23264d; color: #a5b4fc; }
    :root[data-theme="dark"] .ac-how.auto { background: #4a3a10; color: #fcd34d; } :root[data-theme="dark"] .ac-how.workbook { background: #3b1f52; color: #d8b4fe; }
    :root[data-theme="dark"] .ac-how.split { background: #123a42; color: #67e8f9; }
    .ac-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
    .k-income { background: #16a34a; } .k-cogs { background: #ea580c; } .k-expense { background: #dc2626; } .k-loan { background: #7c3aed; }
    .k-owner { background: #2563eb; } .k-transfer { background: #64748b; } .k-other { background: #a3a3a3; } .k-pending { background: #d4d4d4; }
    tr.ac-ticked > td { background: color-mix(in srgb, var(--accent) 10%, transparent) !important; }
    tr.ac-justmoved > td { background: color-mix(in srgb, #16a34a 14%, transparent) !important; transition: background 1s; }
    .ac-result { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 8px 12px; margin: 0 0 8px; border-radius: 8px;
      background: color-mix(in srgb, #16a34a 12%, var(--surface)); border: 1px solid color-mix(in srgb, #16a34a 45%, transparent); font-size: 13px; }
    .ac-lnote { margin-top: 4px; } .ac-lnote textarea { width: 100%; font-size: 12.5px; min-height: 30px; }
    .ac-empty { text-align: center; padding: 22px 10px !important; color: var(--muted); } .ac-empty .ico { width: 26px; height: 26px; opacity: .55; display: block; margin: 0 auto 6px; }
    .ac-pick-head { padding: 8px 12px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); margin-bottom: 8px; font-size: 13px; }
    .ac-pick-sum { position: sticky; bottom: 0; background: var(--surface); padding: 6px 0 2px; font-size: 12.5px; border-top: 1px solid var(--border); margin-top: 6px; }
    th .ac-amtf { cursor: pointer; margin-left: 4px; font-size: 10px; color: var(--muted); } th .ac-amtf.on { color: var(--accent); font-weight: 700; }
    .ac-amtpop { position: absolute; z-index: 60; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); padding: 8px; display: grid; gap: 6px; font-size: 12.5px; width: 210px; }
    .ac-amtpop input, .ac-amtpop select { width: 100%; }
    .pj-grid td:nth-child(2) { min-width: 200px; }
    .ac-ask { margin-top: 4px; font-size: 12px; } .ac-chip.ok { background: #dcfce7; color: #166534; } :root[data-theme="dark"] .ac-chip.ok { background: #14361f; color: #86efac; }
    .rb-branch { border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 8px; padding: 8px; margin-bottom: 8px; background: var(--surface-2); }
    .rb-branch .rb-cond { grid-template-columns: 180px 150px 1fr 130px 34px; }
    .ac-story { margin-top: 8px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); font-size: 12.5px; }
    .ac-story mark { padding: 0 2px; border-radius: 3px; }
    .ac-totbar { position: sticky; top: 0; z-index: 3; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 7px 10px; margin: 0 0 8px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-variant-numeric: tabular-nums; box-shadow: var(--shadow); }
    .ac-totbar strong { font-size: 14px; }
    .ac-stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--text-2); margin: -2px 0 8px; }
    .ac-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: -2px 0 8px; }
    .ac-fchip { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; padding: 2px 8px; border-radius: 12px; background: var(--surface-3); }
    .ac-fchip a { cursor: pointer; color: var(--muted); }
    .ac-adv { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px 12px; margin: 8px 0; }
    .ac-adv label { font-size: 12px; font-weight: 600; color: var(--text-2); display: block; }
    .ac-adv input, .ac-adv select { width: 100%; }
    .ac-comment { padding: 6px 10px; border-left: 3px solid var(--border); margin: 6px 0; background: var(--surface-2); border-radius: 4px; }
    .ac-comment-new textarea { width: 100%; margin: 6px 0; }
    .pj-grid input, .pj-grid select { width: 100%; min-width: 0; font-size: 12.5px; padding: 3px 6px; }
    .rec-accs { max-height: 260px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
    .ac-chip.back { background: #fee2e2; color: #991b1b; } :root[data-theme="dark"] .ac-chip.back { background: #5f1e1e; color: #fecaca; }
  </style>
</head>
<body>
  <div class="app-shell">
  <div id="sidebar"></div>
  <main>
    <div class="card page-toolbar ac-top">
      <h1 class="page-title">Accounting</h1>
      <div class="tabs" id="ac-tabs"></div>
      <span class="ac-period" id="ac-period"></span>
      <button class="small-btn" onclick="recentChanges()" title="Every change to the books — undo any of them" style="order:2;">Recent Changes</button>
    </div>
    <div id="ac-view"><div class="card"><p class="muted">Loading…</p></div></div>
  </main>
  </div>
  <script>
    AuthGuard.requirePerm("accounting");
    document.getElementById("sidebar").innerHTML = renderSidebar("accounting.html");
    const TAB_ICONS = { Work: "clipboard", Reports: "chart", Check: "checkCircle", Plan: "calendar", Setup: "gear" };
    const TAB_ICON = { review: "listTodo", txns: "list", statements: "upload", ignored: "eyeOff", overview: "dashboard", pnl: "chart", cash: "dollar", payees: "users",
      partneraccts: "user", partners: "scissors", loans: "anchor", apar: "receipt", tax: "fileCheck", recurring: "clock", check: "checkCircle", reconcile: "layers",
      projections: "calendar", accounts: "sliders", notes: "notePen" };
    const TAB_GROUPS = [["Work", [["review", "Review"], ["txns", "Transactions"], ["statements", "Statements"], ["ignored", "Ignored"]]],
      ["Reports", [["overview", "Overview"], ["pnl", "P&L"], ["cash", "Cash Flow"], ["payees", "Payees"], ["partneraccts", "Partner Accounts"], ["partners", "Partners Split"],
        ["loans", "Loans"], ["apar", "AP / AR"], ["tax", "1099"], ["recurring", "Recurring"]]],
      ["Check", [["check", "Check My Books"], ["reconcile", "Reconcile"]]], ["Plan", [["projections", "Projections"]]], ["Setup", [["accounts", "Accounts & Rules"], ["notes", "Notes"]]]];
    const TABS = TAB_GROUPS.flatMap(g => g[1]);
    window.TAB_LIST = TABS;
    let META = null, TAB = "overview", PERIOD = { start: null, end: null, key: null };
    const store = { get(k, d) { try { return JSON.parse(localStorage.getItem("ac." + k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem("ac." + k, JSON.stringify(v)); } catch {} } };
    const $ = id => document.getElementById(id);
    const view = () => $("ac-view");
    const money = v => `<span class="${v < -0.004 ? "neg" : v > 0.004 ? "pos" : ""}">${fmtMoney(v)}</span>`;
    const money0 = v => { const r = Math.round(v || 0); return r === 0 ? `<span class="muted">–</span>` : `<span class="${r < 0 ? "neg" : ""}" title="${fmtMoney(v)}">${r < 0 ? "-" : ""}$${Math.abs(r).toLocaleString("en-US")}</span>`; };
    const day = s => s ? new Date(s + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "";
    const monthLabel = k => { const [y, m] = k.split("-"); return new Date(+y, +m - 1, 1).toLocaleDateString(undefined, { month: "short", year: "2-digit" }); };
    const colLabel = k => /^\d{4}-\d\d$/.test(k) ? monthLabel(k) : k;
    const qs = extra => new URLSearchParams({ start: PERIOD.start, end: PERIOD.end, ...(extra || {}) }).toString();
    const KIND_LABEL = () => Object.fromEntries(META.kinds.map(k => [k.key, k.label]));
    const acc = id => META.accounts.find(a => a.id === id);

    // ---- account picker: grouped by type, active ones only (plus the current one) ----
    function accountOptions(selected, { blank = "— Pick an account —", sign = 0 } = {}) {
      const order = sign > 0 ? ["income", "loan", "transfer", "owner", "other", "pending", "cogs", "expense"] : ["cogs", "expense", "owner", "loan", "transfer", "income", "other", "pending"];
      const kl = KIND_LABEL();
      return `<option value="">${blank}</option>` + order.map(k => {
        const list = META.accounts.filter(a => a.kind === k && (a.is_active || a.id === selected));  // the server sends them parents-first
        return list.length ? `<optgroup label="${escapeHtml(kl[k])}">${list.map(a => `<option value="${a.id}" ${a.id === selected ? "selected" : ""}>${"\u00a0\u00a0\u00a0".repeat(a.depth || 0)}${escapeHtml(a.path || a.name)}</option>`).join("")}</optgroup>` : "";
      }).join("") + `<option value="new">+ New account…</option>`;
    }
    async function pickNew(sel, sign) {  // "+ New account…" in any picker
      const a = await accountDialog(null, sign > 0 ? "income" : "expense");
      if (!a) { sel.value = ""; return null; }
      await loadMeta();
      sel.innerHTML = accountOptions(a.id, { sign });
      return a.id;
    }

    // ---- period: a fiscal year or any range ----
    function drawPeriod() {
      const yrs = META.years;
      const saved = store.get("period", null);
      if (!PERIOD.start) {
        if (saved && saved.start) PERIOD = saved;
        else { const y = yrs.find(y => META.today >= y.start && META.today <= y.end) || yrs[0]; PERIOD = { start: y.start, end: y.end, key: y.label }; }
      }
      const custom = !yrs.some(y => y.start === PERIOD.start && y.end === PERIOD.end);
      $("ac-period").innerHTML = `<select id="ac-fy" onchange="pickFy(this.value)" title="Fiscal year (${["", "Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][META.settings.fy_start_month]} – )">
          ${yrs.map(y => `<option value="${y.label}" ${!custom && y.start === PERIOD.start ? "selected" : ""}>${y.label}</option>`).join("")}
          <option value="custom" ${custom ? "selected" : ""}>Dates…</option></select>
        ${custom ? `<input type="date" id="ac-s" value="${PERIOD.start}" onchange="pickDates()"><span class="muted">to</span><input type="date" id="ac-e" value="${PERIOD.end}" onchange="pickDates()">` : ""}`;
    }
    function pickFy(v) {
      if (v === "custom") { PERIOD = { ...PERIOD, key: "custom" }; drawPeriodCustom(); return; }
      const y = META.years.find(y => y.label === v); PERIOD = { start: y.start, end: y.end, key: y.label }; store.set("period", PERIOD); drawPeriod(); show(TAB);
    }
    function drawPeriodCustom() {
      $("ac-period").innerHTML = `<select id="ac-fy" onchange="pickFy(this.value)">${META.years.map(y => `<option value="${y.label}">${y.label}</option>`).join("")}<option value="custom" selected>Dates…</option></select>
        <input type="date" id="ac-s" value="${PERIOD.start}" onchange="pickDates()"><span class="muted">to</span><input type="date" id="ac-e" value="${PERIOD.end}" onchange="pickDates()">`;
    }
    function pickDates() { const s = $("ac-s").value, e = $("ac-e").value; if (s && e) { PERIOD = { start: s, end: e, key: "custom" }; store.set("period", PERIOD); show(TAB); } }

    async function loadMeta() { META = await apiFetch("/api/accounting/meta"); }
    function drawTabs() {
      $("ac-tabs").innerHTML = TAB_GROUPS.map(([g, tabs]) => `<div class="ac-tabbox ${tabs.some(([k]) => k === TAB) ? "has-active" : ""}"><span class="ac-tabgrp">${icon(TAB_ICONS[g] || "list")}${g}</span>

    function lineRow(t, { inbox = false } = {}) {
      const chips = [howBadge(t), !t.reviewed && t.account_id ? `<span class="ac-chip auto" title="${t.how === "rule" ? "Filed by your rule" : "AT-HUB filed it from earlier lines"} -- nobody has looked yet">Not Looked At</span>` : "",

          : `<div style="margin-top:4px;"><button class="small-btn ac-sugg" onclick="fileTo(${t.id}, ${t.suggest.account_id})" title="${escapeHtml(t.suggest.why)}">${icon("check")} ${escapeHtml(t.suggest.account)}</button>

      const clash = (t.conflict || []).length ? `<div class="ac-conflict small"><strong class="neg">Rules disagree</strong> — pick one (or an account above):
          ${t.conflict.map(c => `<div style="margin-top:3px;"><button class="small-btn" onclick="useRule(${c.rule_id}, ${t.id})">${escapeHtml(c.name)} → ${escapeHtml(c.splits && c.splits.length ? "split" : c.account)}</button></div>`).join("")}

        <td class="ac-amt">${money(t.amount)}${t.in_account != null ? `<div class="small" title="Only this part of the split line is in the account shown — that's what the totals count">in this account: <strong>${fmtMoney(t.in_account)}</strong></div>` : ""}${t.balance != null ? `<div class="muted small" title="Bank balance after this line">${fmtMoney(t.balance)}</div>` : ""}</td>

          <button class="small-btn icon-only" title="Open: split, note${t.origin === "manual" ? ", change, delete" : ""}" onclick="editLine(${t.id})">${icon("pencil")}</button></td></tr>`;

    const FLAG_LABEL = { conflict: "Rules Disagree", check: "Filed By Rule — Check", qb_split: "Split In QuickBooks", reconcile: "Flagged", split_memory: "Check Split",

    function howBadge(t) {

    let JUST_MOVED = new Set();
    function askChip(t) {

        ${rows.map(a => `<tr><td class="nowrap">${day(a.txn.date)}</td><td><span class="ac-who">${escapeHtml(a.txn.payee || "")}</span><div class="ac-desc">${escapeHtml(a.txn.description)}</div><div class="muted small">${escapeHtml(a.txn.account || "not filed")}</div></td>

    async function useRule(ruleId, txnId) {

    async function splitLikeLast(id) {
      const t = TXDATA.rows.find(x => x.id === id);
      const parts = t.suggest.split.map(x => ({ account_id: x.account_id, amount: Math.round(t.amount * x.pct) / 100, note: x.note || "" }));
      const diff = Math.round((t.amount - parts.reduce((a, x) => a + x.amount, 0)) * 100) / 100;
      parts[parts.length - 1].amount = Math.round((parts[parts.length - 1].amount + diff) * 100) / 100;
      try { const r = await apiFetch(`/api/accounting/txns/${id}`, { method: "PUT", body: JSON.stringify({ splits: parts }) }); doneToast("Split like last time", r.change_id, reloadLines); await reloadLines(); refreshCount(); }
      catch (e) { alert(e.message); }

    async function lineRules(id) {

          ${d.txn.qb_memo ? `<div class="ac-memo">QuickBooks added: ${escapeHtml(d.txn.qb_memo)} (rules don't read this unless they ask for the QuickBooks Memo)</div>` : ""}</p>

    // the rule builder: money in / out, bank accounts, ALL / ANY conditions, then account / split / payee / note, files or suggests
    async function newRule(r = {}) {
      const M = await ruleMeta();
      const fields = { ...M.text_fields, ...M.num_fields, ...(M.date_fields || {}) };
      const conds = r.conditions && r.conditions.length ? r.conditions : [{ field: "text", op: "contains", value: r.contains || "" }];
      const opsFor = f => f in M.num_fields ? M.num_ops : (M.date_fields || {})[f] ? M.date_ops : M.text_ops;
      const ph = f => f in M.num_fields ? "number" : f === "weekday" ? "MON, FRI" : f === "memo" ? "QuickBooks' pasted text" : 'words, or "a phrase"';
      const condRow = (c = { field: "text", op: "contains", value: "" }) => {
        if (c.field === "group") return groupRow(c);
        const between = c.op === "between", v = between && Array.isArray(c.value) ? c.value : [c.value ?? "", ""], typ = (M.date_fields || {})[c.field] ? "date" : "text";
        return `<div class="rb-cond"><select class="rb-f">${Object.entries(fields).map(([k, l]) => `<option value="${k}" ${k === c.field ? "selected" : ""}>${escapeHtml(l)}</option>`).join("")}</select>
          <select class="rb-op">${Object.entries(opsFor(c.field)).map(([k, l]) => `<option value="${k}" ${k === c.op ? "selected" : ""}>${escapeHtml(l)}</option>`).join("")}</select>
          <input class="rb-v" type="${typ}" value="${escapeHtml(between ? v[0] : (Array.isArray(c.value) ? "" : c.value ?? ""))}" placeholder="${ph(c.field)}">
          <input class="rb-v2" type="${typ}" value="${escapeHtml(between ? v[1] : "")}" placeholder="and" style="${between ? "" : "visibility:hidden;"}">
          <button type="button" class="small-btn icon-only rb-x" title="Remove">${icon("x")}</button></div>`;
      };
      const groupRow = (g = { field: "group", match: "any", conditions: [{ field: "text", op: "contains", value: "" }, { field: "text", op: "contains", value: "" }] }) =>
        `<div class="rb-group"><div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;">
          <select class="rb-gnot" style="width:auto;"><option value="">Group —</option><option value="not" ${g.not ? "selected" : ""}>NOT this group —</option></select>
          <select class="rb-gmatch" style="width:auto;"><option value="any" ${g.match !== "all" ? "selected" : ""}>ANY of these (or)</option><option value="all" ${g.match === "all" ? "selected" : ""}>ALL of these (and)</option></select>
          <span style="flex:1"></span><button type="button" class="small-btn rb-gadd">${icon("plus")} Condition</button><button type="button" class="small-btn icon-only rb-x" title="Remove the group">${icon("x")}</button></div>
          <div class="rb-gconds">${(g.conditions || []).map(condRow).join("")}</div></div>`;
      const splitRow = (x = {}) => `<div class="rb-split"><select class="rb-sa">${accountOptions(x.account_id || null)}</select>
        <input class="rb-sv" type="number" step="0.01" value="${x.pct ?? x.amount ?? ""}" placeholder="0"><select class="rb-st"><option value="pct" ${x.amount != null && x.pct == null ? "" : "selected"}>%</option><option value="amount" ${x.amount != null && x.pct == null ? "selected" : ""}>$</option></select>

      const banks = META.sources.filter(s => s.kind !== "book");
      const branchRow = (b = { match: "all", conditions: [{ field: "text", op: "contains", value: "" }] }) => `<div class="rb-branch">
          <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;"><strong class="rb-bno"></strong>
            <select class="rb-bmatch" style="width:auto;"><option value="all" ${b.match !== "any" ? "selected" : ""}>ALL of these</option><option value="any" ${b.match === "any" ? "selected" : ""}>ANY of these</option></select>
            <label class="inline-check small"><input type="checkbox" class="rb-other" ${(b.conditions || []).length ? "" : "checked"}> Otherwise (everything else the rule catches)</label>
            <span style="flex:1"></span><button type="button" class="small-btn icon-only rb-bup" title="Move up">↑</button><button type="button" class="small-btn rb-badd">${icon("plus")} Condition</button>
            <button type="button" class="small-btn icon-only rb-bx" title="Remove branch">${icon("x")}</button></div>
          <div class="rb-bconds">${(b.conditions || []).map(condRow).join("")}</div>
          <div class="ac-form" style="margin-top:6px;"><label>Then Put It In</label><select class="rb-bacc">${accountOptions(b.account_id || null)}</select>
            <label>Add Note</label><input class="rb-bnote" value="${escapeHtml(b.set_note || "")}" placeholder="optional"></div></div>`;
      const body = `${r._intro || ""}<div class="ac-form">
          <label>Name</label><input id="rb-name" value="${escapeHtml(r.name || "")}" placeholder="optional, e.g. Saul's pay">
          <label>Money</label><select id="rb-sign"><option value="">In or out</option><option value="out" ${r.sign === "out" ? "selected" : ""}>Money out</option><option value="in" ${r.sign === "in" ? "selected" : ""}>Money in</option></select>
          <label>Bank Accounts</label><div>${banks.map(s => `<label class="inline-check" style="margin-right:10px;"><input type="checkbox" class="rb-src" value="${s.id}" ${(r.source_ids || []).includes(s.id) ? "checked" : ""}> ${escapeHtml(s.name)}</label>`).join("")}<span class="muted small">none ticked = all</span></div>
          <label>When</label><select id="rb-match"><option value="all" ${r.match !== "any" ? "selected" : ""}>ALL of these are true (and)</option><option value="any" ${r.match === "any" ? "selected" : ""}>ANY of these is true (or)</option></select>
        </div>
        <div id="rb-conds" style="margin:8px 0 4px;">${conds.map(condRow).join("")}</div>
        <button type="button" class="small-btn" id="rb-addc">${icon("plus")} Condition</button> <button type="button" class="small-btn" id="rb-addg" title="(A or B) and not C">${icon("plus")} Group</button>
        <p class="muted small" style="margin:6px 0 10px;">Whole words, any order — "SAUL" won't match "SAULT". Put words in "quotes" to need them side by side. "Contains any of / none of" take a comma list:
          SAUL, FAUSTINO. "Anywhere" and "Bank Description" never read QuickBooks' pasted text — pick <em>QuickBooks Memo</em> for that. A group has its own ANY / ALL (and can be a NOT).</p>
        <div style="margin:4px 0 10px;"><strong>Branches</strong> <span class="muted small">— different accounts for different words: the first branch that matches decides

          <div id="rb-branches" style="margin-top:6px;">${(r.branches || []).map(branchRow).join("")}</div>
          <button type="button" class="small-btn" id="rb-addb">${icon("plus")} Branch</button></div>
        <div class="ac-form" id="rb-plain" style="${(r.branches || []).length ? "display:none;" : ""}">
          <label>Put It In</label><select id="rb-acc">${accountOptions(r.account_id || null)}</select>
          <label>Split</label><div><div id="rb-splits">${(r.splits || []).map(splitRow).join("")}</div><button type="button" class="small-btn" id="rb-adds">${icon("plus")} Split Part</button>
            <span class="muted small">% or $ of the line; the rest goes in "Put It In"</span></div>
        </div><div class="ac-form">
          <label>Set Payee</label><input id="rb-payee" value="${escapeHtml(r.set_payee || "")}" placeholder="optional">
          <label>Add Note</label><input id="rb-note" value="${escapeHtml(r.set_note || "")}" placeholder="optional (only on lines without a note)">
          <label>Then</label><div><label class="inline-check"><input type="radio" name="rb-action" value="file" ${r.action !== "suggest" ? "checked" : ""}> File the line by itself</label>
            <label class="inline-check" style="margin-left:12px;"><input type="radio" name="rb-action" value="suggest" ${r.action === "suggest" ? "checked" : ""}> Only suggest it (one click in Review)</label>
            <div><label class="inline-check"><input type="checkbox" id="rb-review" ${r.review ? "checked" : ""}> Still needs review — files it, but the line waits in Review until someone says it's right</label></div>
            <div><label class="inline-check"><input type="checkbox" id="rb-wins" ${r.wins ? "checked" : ""}> Wins when rules disagree (otherwise those lines wait in Review)</label></div></div>
          <label></label><label class="inline-check"><input type="checkbox" id="rb-on" ${r.enabled === false ? "" : "checked"}> Rule switched on</label>
        </div><div id="rb-count" class="muted small">…</div><div id="rb-story"></div>`;
      const dlg = askDialog({ title: r.id ? "Change Rule" : "New Rule", body, buttons: [{ label: "Save & See Matches", value: true, cls: "primary" }, { label: "Cancel", value: null }], wide: true });
      const readCond = d => {
        if (d.classList.contains("rb-group")) {
          const subs = [...d.querySelector(".rb-gconds").children].map(readCond).filter(Boolean);
          return subs.length ? { field: "group", match: d.querySelector(".rb-gmatch").value, not: d.querySelector(".rb-gnot").value === "not", conditions: subs } : null;
        }
        const f = d.querySelector(".rb-f").value, op = d.querySelector(".rb-op").value, v1 = d.querySelector(".rb-v").value.trim(), v2 = d.querySelector(".rb-v2").value.trim();
        const c = { field: f, op, value: op === "between" ? (v1 && v2 ? [v1, v2] : "") : v1 };
        return c.value !== "" ? c : null;
      };
      const read = (root = document) => {
        const q = s => root.querySelector(s);
        const a = q("#rb-acc").value;
        return {
          name: q("#rb-name").value.trim(), match: q("#rb-match").value, sign: q("#rb-sign").value || null,
          source_ids: [...root.querySelectorAll(".rb-src:checked")].map(c => +c.value),
          conditions: [...q("#rb-conds").children].map(readCond).filter(Boolean),
          review: q("#rb-review").checked, wins: q("#rb-wins").checked,
          account_id: a && a !== "new" ? +a : null,
          splits: [...root.querySelectorAll(".rb-split")].map(d => { const a2 = d.querySelector(".rb-sa").value, v = d.querySelector(".rb-sv").value, t = d.querySelector(".rb-st").value;
            return a2 && a2 !== "new" && v !== "" ? { account_id: +a2, [t]: parseFloat(v) } : null; }).filter(Boolean),
          set_payee: q("#rb-payee").value.trim() || null, set_note: q("#rb-note").value.trim() || null,
          action: (root.querySelector('input[name="rb-action"]:checked') || {}).value || "file", enabled: q("#rb-on").checked,
          branches: [...root.querySelectorAll("#rb-branches .rb-branch")].map(b => {
            const other = b.querySelector(".rb-other").checked, a2 = b.querySelector(".rb-bacc").value;
            return { match: b.querySelector(".rb-bmatch").value, conditions: other ? [] : [...b.querySelector(".rb-bconds").children].map(readCond).filter(Boolean),
                     account_id: a2 && a2 !== "new" ? +a2 : null, set_note: b.querySelector(".rb-bnote").value.trim() || null };
          }),
          replaces: r.replaces || null, id: r.id || null,
        };
      };
      const hl = (text, words) => { let h = escapeHtml(text); (words || []).forEach(w => { h = h.replace(new RegExp(`\\b(${w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})\\b`, "gi"), "<mark>$1</mark>"); }); return h; };
      let timer = null;
      const count = () => {
        clearTimeout(timer);
        timer = setTimeout(async () => {
          const box = document.getElementById("rb-count"); if (!box) return;
          const b = read();
          document.getElementById("rb-plain").style.display = b.branches.length ? "none" : "";
          document.querySelectorAll("#rb-branches .rb-branch").forEach((x, k) => { x.querySelector(".rb-bno").textContent = `${k === 0 ? "If" : "Else If"} ${k + 1}`; x.querySelector(".rb-bconds").style.display = x.querySelector(".rb-other").checked ? "none" : ""; });
          if (!b.conditions.length && !b.branches.length) { box.textContent = "Add a condition to see how many lines match."; document.getElementById("rb-story").innerHTML = ""; return; }
          apiFetch("/api/accounting/rules/story", { method: "POST", body: JSON.stringify(b) }).then(st => {
            const sb = document.getElementById("rb-story"); if (!sb) return;
            sb.innerHTML = `<div class="ac-story"><div><strong>What it will do:</strong> ${escapeHtml(st.sentence)}</div>
              <div style="margin-top:4px;">${st.counts.map(c_ => `<span class="ac-chip ${c_.key === "conflict" || c_.key === "over_limit" ? "flag" : c_.key === "filed" ? "ok" : ""}">${c_.count} ${escapeHtml(c_.label)}</span>`).join(" ") || "No line matches yet."}</div>
              ${st.examples.length ? `<table class="compact-table no-table-tools" style="margin-top:6px;"><thead><tr><th>Example Line</th><th class="num">Amount</th><th>What Happens</th></tr></thead><tbody>
                ${st.examples.map(x => `<tr><td><span class="muted small">${day(x.date)}</span> ${hl(x.description, x.hit_words)}${x.branch ? `<div class="muted small">${escapeHtml(x.branch)} → ${escapeHtml(x.goes_to)}</div>` : ""}</td>
                  <td class="ac-amt">${money(x.amount)}</td><td class="small">${escapeHtml(x.outcome_label)}${x.account ? `<div class="muted">now: ${escapeHtml(x.account)}</div>` : ""}</td></tr>`).join("")}</tbody></table>` : ""}</div>`;
          }).catch(() => {});
          try {
            const d = await apiFetch("/api/accounting/rules/preview", { method: "POST", body: JSON.stringify({ ...b, id: r.id }) });
            const g = d.groups;
            box.innerHTML = `<strong>${d.count}</strong> line(s) match: ${g.unfiled.length} not filed, ${g.auto.length} filed by AT-HUB, ${g.elsewhere.length} filed elsewhere by a person, ${g.here.length} already there${g.split.length ? `, ${g.split.length} split (left alone)` : ""}.`
              + ((d.overlaps || []).filter(o => o.id !== r.id).length ? `<div class="ac-conflict" style="margin-top:6px;"><strong class="neg">Other rules also match some of these lines and say something else:</strong>
                  ${d.overlaps.filter(o => o.id !== r.id).map(o => `<div>${escapeHtml(o.name)} → ${escapeHtml(o.account)} — ${o.lines} line(s)${o.wins ? " (that rule wins)" : ""}</div>`).join("")}
                  <div class="muted">Those lines will wait in Review (red flag) unless one rule wins — add a "doesn't contain" here or there, or tick "Wins".</div></div>` : "");
          } catch (e) { box.textContent = e.message; }
        }, 350);
      };
      setTimeout(() => {
        const box = [...document.querySelectorAll(".ask-dialog")].pop();
        if (!box) return;
        const wire = () => {
          box.querySelectorAll(".rb-cond").forEach(d => {
            const f = d.querySelector(".rb-f"), op = d.querySelector(".rb-op"), v1 = d.querySelector(".rb-v"), v2 = d.querySelector(".rb-v2");
            f.onchange = () => { op.innerHTML = Object.entries(opsFor(f.value)).map(([k, l]) => `<option value="${k}">${escapeHtml(l)}</option>`).join(""); v1.placeholder = ph(f.value);
              const typ = (M.date_fields || {})[f.value] ? "date" : "text"; v1.type = v2.type = typ; v2.style.visibility = "hidden"; count(); };
            op.onchange = () => { v2.style.visibility = op.value === "between" ? "" : "hidden"; count(); };
          });
          box.querySelectorAll(".rb-gadd").forEach(b => b.onclick = () => { b.closest(".rb-group").querySelector(".rb-gconds").insertAdjacentHTML("beforeend", condRow()); wire(); });
          box.querySelectorAll(".rb-x").forEach(x => x.onclick = () => { (x.closest(".rb-cond") ? x.closest(".rb-cond") : x.closest(".rb-group")).remove(); count(); });
          box.querySelectorAll("select.rb-sa, #rb-acc, select.rb-bacc").forEach(s => s.onchange = async () => { if (s.value === "new") await pickNew(s, -1); count(); });
          box.querySelectorAll(".rb-badd").forEach(b => b.onclick = () => { const br = b.closest(".rb-branch"); br.querySelector(".rb-other").checked = false; br.querySelector(".rb-bconds").insertAdjacentHTML("beforeend", condRow()); wire(); count(); });
          box.querySelectorAll(".rb-bx").forEach(b => b.onclick = () => { b.closest(".rb-branch").remove(); count(); });
          box.querySelectorAll(".rb-bup").forEach(b => b.onclick = () => { const br = b.closest(".rb-branch"); if (br.previousElementSibling) br.parentNode.insertBefore(br, br.previousElementSibling); count(); });
        };
        box.querySelector("#rb-addb").onclick = () => { box.querySelector("#rb-branches").insertAdjacentHTML("beforeend", branchRow()); wire(); count(); };
        box.querySelector("#rb-addc").onclick = () => { box.querySelector("#rb-conds").insertAdjacentHTML("beforeend", condRow()); wire(); };
        box.querySelector("#rb-addg").onclick = () => { box.querySelector("#rb-conds").insertAdjacentHTML("beforeend", groupRow()); wire(); count(); };
        box.querySelector("#rb-adds").onclick = () => { box.querySelector("#rb-splits").insertAdjacentHTML("beforeend", splitRow()); wire(); };
        box.addEventListener("input", count);
        box.addEventListener("change", count);
        wire(); count();
      }, 0);
      const { value, el } = await dlg;
      if (!value) return;
      try {
        const out = await apiFetch(`/api/accounting/rules${r.id ? "/" + r.id : ""}`, { method: r.id ? "PUT" : "POST", body: JSON.stringify(read(el)) });
        doneToast(r.id ? "Rule saved" : "Rule made", out.change_id);
        await rulePreview(out.id);
      } catch (e) { alert(e.message); newRule({ ...r, ...read(el) }); }
    }
    // every line a rule matches, grouped; tick all / some / one and put them where the rule says
    async function rulePreview(ruleId) {
      let d, rule;
      try { [d, rule] = await Promise.all([apiFetch(`/api/accounting/rules/${ruleId}/lines`), apiFetch("/api/accounting/rules").then(rs => rs.find(x => x.id === ruleId))]); }
      catch (e) { alert(e.message); return; }
      const where = (rule.branches || []).length ? "each line's branch account" : rule.splits.length ? "the rule's split" : rule.account;
      let story = null;
      try { story = await apiFetch("/api/accounting/rules/story", { method: "POST", body: JSON.stringify({ ...rule, splits: rule.splits.map(x => ({ account_id: x.account_id, pct: x.pct, amount: x.amount })) }) }); } catch {}
      const res = await pickLines({ title: "Apply Rule", dest: rule.splits.length || (rule.branches || []).length ? null : rule.account_id,
        intro: `${story ? `<div class="ac-story" style="margin:0 0 8px;"><strong>What it does:</strong> ${escapeHtml(story.sentence)}<div style="margin-top:4px;">${story.counts.map(c_ => `<span class="ac-chip ${c_.key === "conflict" || c_.key === "over_limit" ? "flag" : c_.key === "filed" ? "ok" : ""}">${c_.count} ${escapeHtml(c_.label)}</span>`).join(" ")}</div></div>` : ""}
          ${rule.name ? `<strong>${escapeHtml(rule.name)}</strong> · ` : ""}${escapeHtml(rule.summary)} → <strong>${escapeHtml(where)}</strong> · ${d.count} line(s) match (every date).
          Tick the ones to put there.${rule.enabled ? "" : " <span class='neg'>This rule is switched off — new lines won't be filed by it.</span>"}`,
        groups: [{ label: "Not Filed", lines: d.groups.unfiled, ticked: true }, { label: "Filed By AT-HUB, Not Looked At", lines: d.groups.auto, ticked: true },
          { label: "Filed Elsewhere By A Person", lines: d.groups.elsewhere, ticked: false, hint: "someone put these in another account — tick only the ones this rule should move" },
          { label: `Already ${rule.splits.length ? "Split This Way" : "In " + rule.account}`, lines: d.groups.here, ticked: null },
          { label: "Split Over Accounts (Left Alone)", lines: d.groups.split, ticked: null }], apply: "Apply To" });
      if (res && res.ids.length) {
        try { const r = await apiFetch(`/api/accounting/rules/${ruleId}/apply`, { method: "POST", body: JSON.stringify({ ids: res.ids }) }); doneToast(`${r.filed} line(s) put in ${where}`, r.change_id); }
        catch (e) { alert(e.message); }
      }
      refreshCount();
      show(TAB);
    }
    async function deleteRule(id) {
      if (!(await askDialog({ title: "Delete this rule?", body: "<p>Lines it already filed stay where they are.</p>", buttons: [{ label: "Delete", value: true, cls: "danger" }, { label: "Cancel", value: null }] })).value) return;
      const r = await apiFetch(`/api/accounting/rules/${id}`, { method: "DELETE" }); doneToast("Rule deleted", r.change_id); show("accounts");
    }

    // ---- suggested rules (repeated lines AT-HUB spotted, filed or not)
    function suggHtml(max = 50) {
      const list = SUGG.filter(s => !SUGG_HIDE.has(s.key));
      return `<div class="ac-filters"><h3 style="margin:0;">Suggested Rules</h3><span class="muted small">${list.length ? `${list.length} pattern(s) AT-HUB spotted in your lines` : ""}</span></div>
        ${list.length ? `<p class="ac-help">Lines that keep coming back with the same words. Check the words and the account, then <strong>Add Rule & Apply</strong> — you'll tick which lines it files.</p>
        ${list.length > max ? `<p class="muted small" style="margin-top:-4px;">Showing ${max} of ${list.length} — <a class="link" href="#" onclick="show('accounts');return false;">all on Accounts &amp; Rules</a></p>` : ""}
        <div class="ac-sugg-list">${list.slice(0, max).map(s => { const i = SUGG.indexOf(s); return `<div class="ac-sugg-card">
          <div class="ac-sugg-head"><strong>${s.lines}</strong> lines${s.unfiled ? ` · <span class="neg">${s.unfiled} not filed</span>` : ""}${s.already ? ` · ${s.already} already there` : ""}${s.elsewhere ? ` · ${s.elsewhere} elsewhere` : ""}
            <span class="muted small">${s.sign ? (s.sign === "out" ? "money out" : "money in") : ""}</span></div>
          <div class="ac-desc" title="${escapeHtml(s.sample)}">e.g. ${escapeHtml(s.sample.slice(0, 80))}</div>
          <div class="ac-sugg-row"><input id="sg-w-${i}" value="${escapeHtml(s.words)}" title="The words a line must have (whole words)">
            <select id="sg-a-${i}">${accountOptions(s.account_id, { sign: s.sign === "in" ? 1 : -1 })}</select></div>
          <div class="muted small">${escapeHtml(s.source)}</div>
          <div class="btn-row" style="margin-top:6px;"><button class="small-btn primary" onclick="addSugg(${i})">${icon("check")} Add Rule & Apply</button>
            <button class="small-btn" onclick="editSugg(${i})">More…</button><button class="small-btn" onclick="SUGG_HIDE.add(SUGG[${i}].key);redrawSugg()">Not Now</button>
            <button class="small-btn" onclick="neverSugg(${i})">Never</button></div></div>`; }).join("")}</div>`
        : `<p class="muted small">Nothing to suggest right now — no repeated lines that a rule doesn't already cover.</p>`}`;
    }
    function redrawSugg() { const c = document.getElementById("sugg-card"); if (c) c.innerHTML = suggHtml(TAB === "inbox" ? 4 : 50); wireSuggPickers(); }
    function wireSuggPickers() { document.querySelectorAll('[id^="sg-a-"]').forEach(s => s.onchange = async () => { if (s.value === "new") await pickNew(s, -1); }); }
    async function addSugg(i) {
      const s = SUGG[i], words = document.getElementById(`sg-w-${i}`).value.trim(), a = document.getElementById(`sg-a-${i}`).value;
      if (!a || a === "new") { alert("Pick the account"); return; }
      try { const r = await apiFetch("/api/accounting/rules", { method: "POST", body: JSON.stringify({ contains: words, sign: s.sign, account_id: +a }) }); SUGG_HIDE.add(s.key); await rulePreview(r.id); }
      catch (e) { alert(e.message); }
    }
    function editSugg(i) { const s = SUGG[i], a = document.getElementById(`sg-a-${i}`).value; newRule({ contains: document.getElementById(`sg-w-${i}`).value.trim(), sign: s.sign, account_id: a && a !== "new" ? +a : null }); }
    async function neverSugg(i) { await apiFetch("/api/accounting/rule-suggestions/dismiss", { method: "POST", body: JSON.stringify({ key: SUGG[i].key }) }); SUGG_HIDE.add(SUGG[i].key); redrawSugg(); }

      const r = key ? APAR.items.find(x => x.key === key) : null;
      const manual = !r || r.source === "manual";
      const body = `<div class="ac-form">
        ${manual ? `<label>Side</label><select id="it-side"><option value="ap" ${r?.side === "ap" ? "selected" : ""}>Payable — we owe</option><option value="ar" ${r?.side === "ar" ? "selected" : ""}>Receivable — owed to us</option></select>

          <label>Date</label><input type="date" id="it-date" value="${r?.date || META.today}">
          <label>Due</label><input type="date" id="it-due" value="${r?.due_date || ""}">`
          : `<label>From AT-HUB</label><div><strong>${escapeHtml(r.party || "")}</strong> · ${escapeHtml(r.ref || "")}<div class="muted small">AT-HUB says ${fmtMoney(r.athub_amount)}</div></div>`}
        <label>Amount</label><input type="number" step="0.01" id="it-amt" value="${r ? r.amount : ""}" placeholder="${manual ? "0.00" : "AT-HUB's figure"}">
        <label>Status</label><select id="it-status">${[["open", "Open"], ["paid", "Paid already"], ["left_out", "Leave out"]].map(([k, l]) => `<option value="${k}" ${(r?.status || "open") === k ? "selected" : ""}>${l}</option>`).join("")}</select>
        <label>Paid On</label><input type="date" id="it-paid" value="${r?.paid_date || ""}">
        <label>Note</label><input id="it-note" value="${escapeHtml(r?.note || "")}" placeholder="${manual ? "" : "e.g. paid by wire 10/3, not in AT-HUB yet"}">
      </div>`;
      const buttons = [{ label: "Save", value: "save", cls: "primary" }, { label: "Cancel", value: null }];
      if (r && r.override_id) buttons.push({ label: manual ? "Delete" : "Back To AT-HUB's Figure", value: "drop", cls: manual ? "danger" : "" });
      const { value, el } = await askDialog({ title: manual ? (r ? "Typed-In Item" : "Type In An AP / AR Item") : "AT-HUB Item", body, buttons, wide: true });
      if (!value) return;
      try {
        if (value === "drop") await apiFetch(`/api/accounting/open-items/${r.override_id}`, { method: "DELETE" });
        else {
          const q = s => el.querySelector(s);
          const data = { status: q("#it-status").value, paid_date: q("#it-paid").value || null, note: q("#it-note").value };
          const amt = q("#it-amt").value;
          if (manual) Object.assign(data, { id: r?.id, source: "manual", side: q("#it-side").value, party: q("#it-party").value, ref: q("#it-ref").value, item_date: q("#it-date").value, due_date: q("#it-due").value || null, amount: amt === "" ? null : parseFloat(amt) });
          else Object.assign(data, { source: r.source, source_id: r.source_id, side: r.side, amount: amt === "" || Math.abs(parseFloat(amt) - r.athub_amount) < 0.005 ? null : parseFloat(amt) });
          await apiFetch("/api/accounting/open-items", { method: "POST", body: JSON.stringify(data) });
        }
        toast("Saved"); tabApar();
      } catch (e) { alert(e.message); }
    }

      if (!value) return;
      const ids = [...el.querySelectorAll(".tl-t:checked")].map(c => +c.value);
      try { const r = await apiFetch("/api/accounting/qb-tails/apply", { method: "POST", body: JSON.stringify({ ids }) }); doneToast(`${r.cleaned} line(s) cleaned${r.back_to_review ? `, ${r.back_to_review} back to Review` : ""}`, r.change_id); refreshCount(); }
      catch (e) { alert(e.message); }
    }
    document.addEventListener("change", e => { if (e.target.id === "tl-all") document.querySelectorAll(".tl-t").forEach(c => c.checked = e.target.checked); });
    async function sourceDialog(id) {
      const s = id ? META.sources.find(x => x.id === id) : null;
      const body = `<div class="ac-form">
        <label>Name</label><input id="sd-name" value="${escapeHtml(s?.name || "")}" placeholder="e.g. Wells Fargo Checking">
        <label>Type</label><select id="sd-kind"><option value="bank" ${s?.kind !== "card" ? "selected" : ""}>Bank account</option><option value="card" ${s?.kind === "card" ? "selected" : ""}>Credit card</option></select>
        <label>Last 4</label><input id="sd-last4" value="${escapeHtml(s?.last4 || "")}" maxlength="4">
        <label>Opening Balance</label><input type="number" step="0.01" id="sd-open" value="${s?.opening_balance || ""}">
        <label>On Date</label><input type="date" id="sd-date" value="${s?.opening_date || ""}">
        ${s ? `<label></label><label class="inline-check"><input type="checkbox" id="sd-active" ${s.is_active ? "checked" : ""}> In use</label>` : ""}
      </div><p class="ac-help" style="margin-top:8px;">Opening balance = the balance at the start of that day; lines from that day on are added to it.</p>`;
      const buttons = [{ label: "Save", value: "save", cls: "primary" }, { label: "Cancel", value: null }];
      if (s && !s.lines) buttons.push({ label: "Delete", value: "delete", cls: "danger" });
      const { value, el } = await askDialog({ title: s ? s.name : "Add Bank Account / Card", body, buttons });
      if (!value) return;
      const q = x => el.querySelector(x);
      try {
        if (value === "delete") await apiFetch(`/api/accounting/sources/${id}`, { method: "DELETE" });
        else await apiFetch(`/api/accounting/sources${s ? "/" + id : ""}`, { method: s ? "PUT" : "POST", body: JSON.stringify({ name: q("#sd-name").value, kind: q("#sd-kind").value, last4: q("#sd-last4").value,
          opening_balance: parseFloat(q("#sd-open").value || 0), opening_date: q("#sd-date").value || "", ...(s ? { is_active: q("#sd-active").checked } : {}) }) });
        await loadMeta(); show("statements");
      } catch (e) { alert(e.message); }
    }
    async function qbExport(id) {
      const s = META.sources.find(x => x.id === id);
      try { await downloadFile(`/api/accounting/export/quickbooks.csv?${qs({ source_id: id })}`, `${s.name} QuickBooks.csv`); } catch (e) { alert(e.message); }
    }
    async function undoImport(id, n) {
      if (!(await askDialog({ title: "Undo this import?", body: `<p>${n} line(s) from this file are removed (typed-in lines it matched stay).</p>`, buttons: [{ label: "Undo Import", value: true, cls: "danger" }, { label: "Cancel", value: null }] })).value) return;
      try { const r = await apiFetch(`/api/accounting/imports/${id}`, { method: "DELETE" }); toast(`${r.removed} line(s) removed`); await loadMeta(); show("statements"); refreshCount(); } catch (e) { alert(e.message); }
    }
    // pick a file -> AT-HUB reads it and shows which column it thinks is which -> change any -> bring it in
    let IMP = null;
    async function importDialog(sourceId) {
      const pick = Object.assign(document.createElement("input"), { type: "file", accept: ".csv,.xlsx,.xlsm,.txt" });
      pick.onchange = async () => {
        const file = pick.files[0]; if (!file) return;
        IMP = { file, sourceId, layout: null };
        await previewImport();
      };
      pick.click();
    }
    function impForm(withLayout = true) {
      const fd = new FormData(); fd.append("source_id", IMP.sourceId); fd.append("file", IMP.file);
      if (withLayout && IMP.layout) fd.append("layout", JSON.stringify(IMP.layout));
      if (IMP.from) fd.append("date_from", IMP.from);
      if (IMP.to) fd.append("date_to", IMP.to);
      if (IMP.replace) fd.append("replace", "true");
      return fd;
    }
    async function previewImport() {
      let p;
      try { p = await apiUpload("/api/accounting/import/preview", impForm()); } catch (e) { alert(e.message); return; }
      IMP.layout = p.layout;
      IMP.first = p.first; IMP.last = p.last;
      const col = (key, label, optional) => `<div><label>${label}</label><select class="mp" data-k="${key}">${optional ? `<option value="">—</option>` : `<option value="">— pick —</option>`}${p.headers.map((h, i) => `<option value="${i}" ${p.layout[key] === i ? "selected" : ""}>${escapeHtml(h)}</option>`).join("")}</select></div>`;
      const src = META.sources.find(s => s.id === IMP.sourceId);
      const dayBefore = d => { if (!d) return ""; const x = new Date(d + "T00:00:00"); x.setDate(x.getDate() - 1); return x.toISOString().slice(0, 10); };
      const st = { exact: "already in", possible: "possible duplicate", expected: "typed in earlier", estimate: "estimate", new: "new" };
      const body = `<p class="ac-help">${escapeHtml(IMP.file.name)} → <strong>${escapeHtml(src.name)}</strong>. Check AT-HUB read the columns right — the In / Out totals and the signs below.</p>
        ${p.warning ? `<p class="neg" style="padding:8px 10px;border:1px solid #fca5a5;border-radius:8px;"><strong>Check the amounts:</strong> ${escapeHtml(p.warning)}</p>` : ""}
        <label class="inline-check"><input type="checkbox" id="mp-head" ${p.layout.has_header ? "checked" : ""}> The first row is column names</label>
        <div class="ac-map">${col("date", "Date")}${col("description", "Description")}${col("amount", "Amount (+ in, − out)", true)}${col("debit", "Or: Money Out (Debit / Payment)", true)}${col("credit", "And: Money In (Credit / Deposit)", true)}
          ${col("hint", "Their Category (a hint, e.g. QuickBooks Account)", true)}${col("account", "Account (your workbook)", true)}${col("category", "Category (your workbook)", true)}</div>
        <h4 style="margin:10px 0 4px;">Which Dates</h4>
        <div class="ac-map"><div><label>From</label><input type="date" id="mp-from" value="${IMP.from || ""}"></div><div><label>To</label><input type="date" id="mp-to" value="${IMP.to || ""}"></div>
          <div style="grid-column: span 2;"><label>&nbsp;</label><span class="small">File: ${day(p.file_first)} – ${day(p.file_last)}.
            ${p.books_from ? `This account's books: ${day(p.books_from)} – ${day(p.books_to)}. <a class="link" href="#" id="mp-before">Only lines before the books start</a>` : ""}</span></div></div>
        <label class="inline-check" style="margin-top:4px;"><input type="checkbox" id="mp-replace" ${IMP.replace ? "checked" : ""}> <strong>Replace</strong> the lines already in the books for these dates with this file's lines — keeping how each was filed
          (account, split, note). Lines in the books that aren't on this file move to Book Entries. Undo puts everything back.</label>
        <div class="ac-tiles" style="margin-top:10px;"><div class="ac-tile"><div class="l">Lines Read</div><div class="v">${p.rows}</div><div class="s">${day(p.first)} – ${day(p.last)}${p.outside ? ` · ${p.outside} outside the dates` : ""}</div></div>
          <div class="ac-tile"><div class="l">New</div><div class="v">${p.new}</div><div class="s">come in</div></div>
          ${p.replace ? `<div class="ac-tile"><div class="l">Replace, Filing Kept</div><div class="v pos">${p.replace_keep}</div><div class="s">the file's line takes their place</div></div>
            <div class="ac-tile"><div class="l">Not On This File</div><div class="v">${p.replace_unmatched}</div><div class="s">move to Book Entries</div></div>`
          : `<div class="ac-tile"><div class="l">Already In</div><div class="v">${p.already}</div><div class="s">ignored (listed on Ignored)</div></div>
          ${p.possible ? `<div class="ac-tile"><div class="l">Possible Duplicates</div><div class="v neg">${p.possible}</div><div class="s">you decide on Ignored</div></div>` : ""}`}
          ${p.expected ? `<div class="ac-tile"><div class="l">Typed In Earlier</div><div class="v">${p.expected}</div><div class="s">matched, not doubled</div></div>` : ""}
          ${p.estimate ? `<div class="ac-tile"><div class="l">AR / AP Estimates</div><div class="v">${p.estimate}</div><div class="s">not brought in</div></div>` : ""}
          <div class="ac-tile"><div class="l">In / Out</div><div class="v" style="font-size:15px;"><span class="pos">${fmtMoney(p.money_in)}</span><br><span class="neg">${fmtMoney(p.money_out)}</span></div></div></div>
        ${p.hints ? `<p class="muted small">${p.hints} line(s) carry the file's own category — shown as a hint in Review.</p>` : ""}
        ${p.memos ? `<details class="small" style="margin:6px 0;"><summary><strong>${p.memos}</strong> line(s) have QuickBooks' own text pasted after the bank's — it comes off (kept greyed under the line, not used by rules or search)</summary>
          <table class="compact-table no-table-tools" style="margin-top:4px;"><tbody>${(p.memo_examples || []).map(x => `<tr><td class="nowrap">${x.date}</td><td>${escapeHtml(x.kept)}<div class="ac-memo">${escapeHtml(x.removed)}</div></td></tr>`).join("")}</tbody></table></details>` : ""}
        ${p.qb_splits ? `<p class="small"><span class="ac-chip flag">Split In QuickBooks</span> ${p.qb_splits} line(s) have no single account in QuickBooks — they come in flagged, to be split the same way:
          ${(p.split_lines || []).slice(0, 4).map(x => `${x.date} ${fmtMoney(x.amount)}`).join(", ")}</p>` : ""}
        ${p.remembered ? `<p class="small pos">${p.remembered} line(s) were split / filed by a person before — they come in filed the same way.</p>` : ""}
        ${p.workbook ? `<p class="ac-help"><strong>Your workbook:</strong> every line comes in already filed under its Account. This also teaches AT-HUB how you file.</p>` : ""}
        ${p.bad_count ? `<p class="muted small">${p.bad_count} row(s) without a date or amount are left out: ${p.bad.slice(0, 3).map(escapeHtml).join(" · ")}</p>` : ""}
        <div class="table-scroll" style="max-height:220px;"><table class="compact-table ac-sample"><thead><tr><th>Date</th><th class="num">Amount</th><th>Description</th><th>Will Be</th></tr></thead>
          <tbody>${p.parsed.map(r => `<tr><td>${r.date}</td><td class="ac-amt">${money(r.amount)}</td><td>${escapeHtml(r.description)}${r.hint ? `<div class="muted small">${escapeHtml(r.hint)}</div>` : ""}</td>
            <td class="small">${p.replace && ["exact", "possible"].includes(r.status) ? "replaces a line (filing kept)" : escapeHtml(st[r.status] || r.status)}</td></tr>`).join("")}</tbody></table></div>`;
      const goLabel = p.replace ? `Replace ${p.replace_keep} · Add ${p.new}` : `Bring In ${p.new + (p.possible ? 0 : 0)} New Line(s)`;
      const dlg = askDialog({ title: "Bring In Statement", body, buttons: [{ label: goLabel, value: "go", cls: "primary" }, { label: "Cancel", value: null }], wide: true });
      setTimeout(() => {
        const again = () => { IMP.again = true; [...document.querySelectorAll(".ask-dialog button")].find(b => b.textContent === "Cancel")?.click(); };
        document.querySelectorAll(".mp, #mp-head").forEach(s => s.onchange = () => {
          const lay = { has_header: document.getElementById("mp-head").checked };
          document.querySelectorAll(".mp").forEach(x => { if (x.value !== "") lay[x.dataset.k] = +x.value; });
          if (lay.amount != null) { delete lay.debit; delete lay.credit; }
          IMP.layout = lay; again();
        });
        const f = document.getElementById("mp-from"), t = document.getElementById("mp-to"), rp = document.getElementById("mp-replace"), b4 = document.getElementById("mp-before");
        if (f) f.onchange = () => { IMP.from = f.value; again(); };
        if (t) t.onchange = () => { IMP.to = t.value; again(); };
        if (rp) rp.onchange = () => { IMP.replace = rp.checked; again(); };
        if (b4) b4.onclick = e => { e.preventDefault(); IMP.from = ""; IMP.to = dayBefore(p.books_from); IMP.replace = false; again(); };
      }, 0);
      const { value } = await dlg;
      if (IMP.again) { IMP.again = false; return previewImport(); }
      if (value !== "go") return;
      if (p.replace && !(await askDialog({ title: "Replace These Lines?", body: `<p>${p.replace_keep} line(s) in the books are replaced by this file's lines (their accounts / splits / notes move across),
          ${p.new} new line(s) come in, ${p.replace_unmatched} line(s) not on this file move to Book Entries. <strong>Undo</strong> on Statements puts it all back.</p>`,
          buttons: [{ label: "Replace", value: true, cls: "primary" }, { label: "Cancel", value: null }] })).value) return;
      try {
        const r = await apiUpload("/api/accounting/import", impForm());
        await askDialog({ title: "Brought In", body: `<p><strong>${r.added}</strong> new line(s)${r.replaced ? `, <strong>${r.replaced}</strong> replaced (filing kept)` : ""}${r.moved_to_book ? `, ${r.moved_to_book} not on the file moved to Book Entries` : ""}${r.skipped ? `, ${r.skipped} already in (ignored)` : ""}${r.matched ? `, ${r.matched} typed-in line(s) matched` : ""}${r.outside ? `, ${r.outside} outside the dates` : ""}.</p>
          ${r.possible ? `<p class="neg"><strong>${r.possible}</strong> look like lines already in — waiting on the <a class="link" href="#" onclick="document.querySelector('.ask-dialog button[data-i]').click();setTimeout(()=>show('ignored'),50);return false;">Ignored</a> tab for you to decide.</p>` : ""}
          ${r.estimates ? `<p>${r.estimates} AR / AP estimate row(s) weren't brought in (listed on Ignored).</p>` : ""}
          ${r.remembered ? `<p class="pos">${r.remembered} filed the way a person filed them before (remembered splits / filings).</p>` : ""}
          ${r.memos ? `<p>QuickBooks' pasted text taken off ${r.memos} line(s).</p>` : ""}${r.flagged ? `<p class="neg">${r.flagged} line(s) wait in Review with a flag (rules disagree / split in QuickBooks / a rule's check).</p>` : ""}
          ${r.auto ? `<p>${r.auto} filed by AT-HUB from earlier lines (marked Auto).</p>` : ""}${r.left ? `<p><strong>${r.left}</strong> to file.</p>` : ""}`,
          buttons: [...(r.left || r.flagged ? [{ label: "Review Them Now", value: "file", cls: "primary" }] : []), { label: "Close", value: null }] })
          .then(x => { if (x.value === "file") show("review"); else show("statements"); });
        IMP.from = IMP.to = ""; IMP.replace = false;
        await loadMeta(); refreshCount();
      } catch (e) { alert(e.message); }
    }

    window.addEventListener("popstate", () => { const h = location.hash.slice(1); if (h && LOADERS[h]) show(h, true); });
    const LOADERS = { overview: tabOverview, review: tabInbox, inbox: tabInbox, txns: tabTxns, pnl: tabPnl, accounts: tabAccounts, loans: tabLoans, partners: tabPartners,
      apar: tabApar, cash: tabCash, statements: tabStatements, ...(window.MORE_LOADERS || {}) };
    (async () => {
      try { await loadMeta(); } catch (e) { view().innerHTML = `<div class="card error">${escapeHtml(e.message)}</div>`; return; }
      drawPeriod();
      const h = location.hash.slice(1);
      TAB = LOADERS[h] ? h : store.get("tab", "review");
      if (!LOADERS[TAB]) TAB = "overview";
      await refreshCount();
      show(TAB);
    })();
  </script>
</body>
</html>
