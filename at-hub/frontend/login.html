<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AT-HUB — Login</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth-guard.js"></script>
</head>
<body>
  <main style="max-width: 360px; margin-top: 80px;">
    <div class="card">
      <h2 style="margin-top:0;">AT-HUB</h2>
      <form id="login-form">
        <label>Username</label>
        <input type="text" id="username" required autofocus>
        <label>Password</label>
        <input type="password" id="password" required>
        <div id="code-box" style="display:none;">
          <label>Code from your authenticator app</label>
          <input type="text" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="6 digits">
        </div>
        <div style="margin-top:16px;">
          <button type="submit">Log in</button>
        </div>
        <div id="error" class="error"></div>
      </form>
    </div>
  </main>

  <script>
    if (AuthGuard.getToken()) {
      window.location.href = homePage();
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const errorEl = document.getElementById("error");
      errorEl.textContent = "";
      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password, code: document.getElementById("code").value.trim() || null }),
        });
        const data = await response.json();
        if (response.status === 401 && data.detail === "TOTP_REQUIRED") {  // two-step login: ask for the app's code
          document.getElementById("code-box").style.display = "";
          document.getElementById("code").focus();
          errorEl.textContent = "Enter the 6-digit code from your authenticator app.";
          return;
        }
        if (!response.ok) throw new Error(data.detail || "Login failed");
        AuthGuard.setSession(data.access_token, data.user);
        window.location.href = data.user.must_change_password ? "account.html" : homePage();
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });
  </script>
</body>
</html>
