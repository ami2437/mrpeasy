<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AT-HUB — My Account</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth-guard.js"></script>
</head>
<body>
  <div class="app-shell">
  <div id="sidebar"></div>
  <main>
    <div class="card" style="max-width:520px;">
      <h3 style="margin-top:0;">My Account</h3>
      <div id="force-notice" class="notice" style="display:none;">
        <strong>Choose your own password.</strong> Your account was just created or its password was reset — set a new one to continue.
      </div>
      <p id="who" class="muted"></p>
      <h4>Change password</h4>
      <label>Current password</label><input type="password" id="p-current" autocomplete="current-password">
      <label>New password <span class="muted small">(at least 8 characters)</span></label><input type="password" id="p-new" autocomplete="new-password">
      <label>Confirm new password</label><input type="password" id="p-confirm" autocomplete="new-password">
      <button onclick="changePassword()" style="margin-top:12px;">Change Password</button>
      <span id="saved" class="muted" style="margin-left:10px;"></span>
      <div id="error" class="error"></div>
    </div>
  </main>

  <script>
    const user = AuthGuard.requireLogin();
    document.getElementById("sidebar").innerHTML = renderSidebar("account.html");
    if (user) {
      document.getElementById("who").textContent = `Signed in as ${user.username}${user.full_name ? ` (${user.full_name})` : ""} · ${ROLE_LABELS[user.role] || user.role}`;
      if (user.must_change_password) document.getElementById("force-notice").style.display = "block";
    }

    async function changePassword() {
      const errorEl = document.getElementById("error");
      errorEl.textContent = "";
      document.getElementById("saved").textContent = "";
      const current = document.getElementById("p-current").value;
      const next = document.getElementById("p-new").value;
      if (next !== document.getElementById("p-confirm").value) {
        errorEl.textContent = "The new passwords don't match.";
        return;
      }
      try {
        const updated = await apiFetch("/api/auth/change-password", {
          method: "POST", body: JSON.stringify({ current_password: current, new_password: next }),
        });
        AuthGuard.setSession(AuthGuard.getToken(), updated);
        if (user && user.must_change_password) {
          window.location.href = "dashboard.html";
          return;
        }
        ["p-current", "p-new", "p-confirm"].forEach(id => { document.getElementById(id).value = ""; });
        document.getElementById("saved").textContent = "Password changed.";
      } catch (err) {
        errorEl.textContent = err.message;
      }
    }
  </script>
  </div>
</body>
</html>
