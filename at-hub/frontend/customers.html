<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AT-HUB — Customers</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth-guard.js"></script>
</head>
<body>
  <div class="app-shell">
  <div id="sidebar"></div>
  <main>
    <div class="card">
      <div class="row" style="align-items:center;">
        <input type="text" id="search" placeholder="Search customers...">
        <button onclick="toggleForm()">+ New Customer</button>
      </div>
    </div>

    <div class="card" id="form-card" style="display:none;">
      <h3>New Customer</h3>
      <div class="row">
        <div><label>Name</label><input type="text" id="f-name"></div>
        <div><label>Contact name</label><input type="text" id="f-contact"></div>
      </div>
      <div class="row">
        <div><label>Email</label><input type="text" id="f-email"></div>
        <div><label>Phone</label><input type="text" id="f-phone"></div>
      </div>
      <label>Address</label><textarea id="f-address" rows="2"></textarea>
      <div style="margin-top:14px;">
        <button onclick="save()">Save</button>
        <button class="secondary" onclick="toggleForm(false)">Cancel</button>
      </div>
      <div id="form-error" class="error"></div>
    </div>

    <div class="card">
      <table>
        <thead><tr><th>Name</th><th>Contact</th><th>Email</th><th>Phone</th><th>Orders</th></tr></thead>
        <tbody id="body"><tr><td colspan="5">Loading...</td></tr></tbody>
      </table>
    </div>

    <div class="card" id="detail-card" style="display:none;"></div>
  </main>

  <script>
    AuthGuard.requireLogin();
    document.getElementById("sidebar").innerHTML = renderSidebar("customers.html");
    const ENDPOINT = "/api/customers/";

    let rows = [];
    let orders = [];

    function toggleForm(show = true) {
      document.getElementById("form-card").style.display = show ? "block" : "none";
      if (!show) ["name", "contact", "email", "phone", "address"].forEach(f => document.getElementById(`f-${f}`).value = "");
    }

    async function save() {
      const errorEl = document.getElementById("form-error");
      errorEl.textContent = "";
      try {
        await apiFetch(ENDPOINT, {
          method: "POST",
          body: JSON.stringify({
            name: document.getElementById("f-name").value,
            contact_name: document.getElementById("f-contact").value,
            email: document.getElementById("f-email").value,
            phone: document.getElementById("f-phone").value,
            address: document.getElementById("f-address").value,
          }),
        });
        toggleForm(false);
        load();
      } catch (err) {
        errorEl.textContent = err.message;
      }
    }

    function render() {
      const tbody = document.getElementById("body");
      const q = document.getElementById("search").value.trim().toLowerCase();
      const filtered = rows.filter(r => !q || r.name.toLowerCase().includes(q) || (r.contact_name || "").toLowerCase().includes(q));
      if (!filtered.length) {
        tbody.innerHTML = `<tr><td colspan="5" class="muted">${rows.length ? "No customers match your search." : "None yet."}</td></tr>`;
        return;
      }
      tbody.innerHTML = filtered.map(r => {
        const orderCount = orders.filter(o => o.customer_id === r.id).length;
        return `
        <tr>
          <td><a class="link" onclick="showDetail(${r.id})">${r.name}</a></td>
          <td>${r.contact_name || ""}</td>
          <td>${r.email || ""}</td>
          <td>${r.phone || ""}</td>
          <td class="muted">${orderCount}</td>
        </tr>
      `;
      }).join("");
    }

    function fmtDate(d) { return d ? new Date(d).toLocaleDateString() : ""; }

    async function showDetail(id) {
      const customer = rows.find(r => r.id === id);
      const card = document.getElementById("detail-card");
      card.style.display = "block";
      const customerOrders = orders.filter(o => o.customer_id === id);
      const totalSales = customerOrders.reduce((sum, o) => sum + o.lines.reduce((s, l) => s + l.quantity * l.unit_price, 0), 0);

      card.innerHTML = `
        <h3>${customer.name}</h3>
        <div class="row">
          <div><label>Name</label><input type="text" id="e-name" value="${customer.name}"></div>
          <div><label>Contact name</label><input type="text" id="e-contact" value="${customer.contact_name || ''}"></div>
        </div>
        <div class="row">
          <div><label>Email</label><input type="text" id="e-email" value="${customer.email || ''}"></div>
          <div><label>Phone</label><input type="text" id="e-phone" value="${customer.phone || ''}"></div>
        </div>
        <label>Address</label><textarea id="e-address" rows="2">${customer.address || ''}</textarea>
        <button onclick="saveDetail(${customer.id})" style="margin-top:8px;">Save Changes</button>
        <div id="detail-error" class="error"></div>

        <h4 style="margin-top:20px;">Order history (${customerOrders.length} orders, $${totalSales.toFixed(2)} total)</h4>
        ${customerOrders.length ? `
          <table>
            <thead><tr><th>Code</th><th>Date</th><th>Status</th><th>Total</th></tr></thead>
            <tbody>${customerOrders.map(o => `
              <tr>
                <td><a class="link" href="customer-orders.html?id=${o.id}">${o.code}</a></td>
                <td>${fmtDate(o.order_date)}</td>
                <td><span class="tag ${o.status}">${o.status}</span></td>
                <td>$${o.lines.reduce((s, l) => s + l.quantity * l.unit_price, 0).toFixed(2)}</td>
              </tr>
            `).join("")}</tbody>
          </table>
        ` : `<p class="muted">No orders yet.</p>`}
        <button class="secondary" onclick="document.getElementById('detail-card').style.display='none';" style="margin-top:12px;">Close</button>
      `;
    }

    async function saveDetail(id) {
      const errorEl = document.getElementById("detail-error");
      errorEl.textContent = "";
      try {
        await apiFetch(`${ENDPOINT}${id}`, {
          method: "PUT",
          body: JSON.stringify({
            name: document.getElementById("e-name").value,
            contact_name: document.getElementById("e-contact").value,
            email: document.getElementById("e-email").value,
            phone: document.getElementById("e-phone").value,
            address: document.getElementById("e-address").value,
          }),
        });
        await load();
        showDetail(id);
      } catch (err) {
        errorEl.textContent = err.message;
      }
    }

    async function load() {
      try {
        [rows, orders] = await Promise.all([
          apiFetch(ENDPOINT),
          apiFetch("/api/customer-orders/"),
        ]);
        render();
      } catch (err) {
        document.getElementById("body").innerHTML = `<tr><td colspan="5" class="error">${err.message}</td></tr>`;
      }
    }
    document.getElementById("search").addEventListener("input", render);
    load();
  </script>
  </div>
</body>
</html>
