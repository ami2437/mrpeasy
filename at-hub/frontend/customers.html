<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AT-HUB — Customers</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth-guard.js"></script>
  <script src="contact-card.js"></script>
</head>
<body>
  <div class="app-shell">
  <div id="sidebar"></div>
  <main>
    <div class="card page-toolbar">
      <h1 class="page-title">Customers</h1>
      <div class="row toolbar-row">
        <button class="secondary" onclick="ContactCards.exportCsv()">Export CSV</button>
        <button class="secondary" onclick="openImport('customers', () => ContactCards.load())">Import CSV</button>
        <button onclick="ContactCards.create()">+ New Customer</button>
      </div>
    </div>
    <div id="contacts"></div>
  </main>

  <script>
    AuthGuard.requirePerm("customers.view");
    document.getElementById("sidebar").innerHTML = renderSidebar("customers.html");
    document.getElementById("contacts").innerHTML = contactCardShell("+ New Customer");

    let orders = [];
    const orderTotal = o => o.lines.reduce((s, l) => s + lineAmount(l.quantity, l.unit_price), 0);

    ContactCards.init({
      endpoint: "/api/customers/",
      labels: {
        phones: ["work", "main", "mobile", "receiving", "accounts payable", "fax", "other"],
        emails: ["work", "invoices / AP", "purchasing", "quality / MTRs", "receiving", "other"],
        addresses: ["billing", "shipping", "plant", "other"],
        websites: ["website", "supplier portal", "other"],
        roles: ["buyer", "accounts payable", "receiving", "quality", "engineering", "owner"],
      },
      hints: {
        emails: 'label one "invoices / AP" or "quality / MTRs" to send those there',
        addresses: '"billing" = bill to, "shipping" = default ship-to',
        phones: "the first one is printed on documents",
      },
      newDraft: () => ({ tags: [], phones: [{ label: "work", value: "" }], emails: [{ label: "work", value: "" }],
        addresses: [{ label: "billing", value: "" }, { label: "shipping", value: "" }], websites: [],
        people: [{ name: "", role: "buyer", phone: "", email: "" }], notes: "" }),
      // what in the app reads each entry, so it's clear what a label does
      usedFor(c, key, r, i) {
        const n = [];
        if (key === "emails" && r.value === c.invoice_email) n.push("invoices go here");
        if (key === "emails" && r.value === c.mtr_email) n.push("MTRs go here");
        if (key === "addresses" && r.value === c.address) n.push("bill to");
        if (key === "addresses" && r.value === c.shipping_address) n.push("default ship-to");
        if ((key === "phones" || key === "emails") && i === 0) n.push("main");
        return n;
      },
      loadExtra: async () => { orders = await apiFetch("/api/customer-orders/"); },
      quickExtra: c => `<a href="customer-orders.html?new=${c.id}"><b>＋</b>order</a>`,
      // payment terms set each invoice's due date (invoice date + the terms)
      headExtra: c => `<div class="muted small" style="margin:-4px 0 6px;" title="Invoices for this customer fall due this long after the invoice date">Terms: <strong>${escapeHtml(c.payment_terms || "Net 30")}</strong>${c.expedited ? ` · <span class="tag overdue" title="New orders start as expedited; their invoices remind you to charge the extra">Expedited Shipping</span>` : ""}</div>`,
      editExtra: d => `<div class="grp"><div class="grp-title">Payment Terms <span class="used-for">sets each invoice's due date</span></div>
        <div class="ent" style="grid-template-columns:1fr;"><select onchange="ContactCards.set('payment_terms', null, null, this.value)" style="max-width:220px;">
          ${["Due on Receipt", "Net 15", "Net 30", "Net 45", "Net 60"].map(t => `<option ${(d.payment_terms || "Net 30") === t ? "selected" : ""}>${t}</option>`).join("")}</select></div></div>
        <div class="grp"><div class="grp-title">Shipping <span class="used-for">new orders start with this</span></div>
        <div class="ent" style="grid-template-columns:1fr;"><label class="check-label" style="margin:0;"><input type="checkbox" ${d.expedited ? "checked" : ""} onchange="ContactCards.set('expedited', null, null, this.checked)" style="width:auto;">
          Expedited Shipping (Charge Extra) — its invoices remind you to add the expedite charge</label></div></div>`,
      body(c) {
        const mine = orders.filter(o => o.customer_id === c.id).sort((a, b) => b.id - a.id);
        const open = mine.filter(o => !["shipped", "invoiced", "cancelled"].includes(o.status));
        return `
          <div class="stats">
            <div><strong>${mine.length}</strong><span>orders</span></div>
            <div><strong>${open.length}</strong><span>open now</span></div>
            <div><strong>${fmtMoney(mine.filter(o => o.status !== "cancelled").reduce((s, o) => s + orderTotal(o), 0))}</strong><span>total sales</span></div>
            <div><strong>${mine[0] ? fmtDate(mine[0].created_at || mine[0].order_date) : "—"}</strong><span>last order</span></div>
          </div>
          <h4 style="margin-top:20px;">Orders</h4>
          ${mine.length ? `<div class="table-scroll"><table>
            <thead><tr><th>Code</th><th>PO #</th><th>Created</th><th>Status</th><th class="num sum">Total</th></tr></thead>
            <tbody>${mine.map(o => `<tr><td><a class="link" href="customer-orders.html?id=${o.id}">${escapeHtml(o.code)}</a></td><td>${escapeHtml(o.po_number || "")}</td>
              <td>${fmtDate(o.created_at || o.order_date)}</td><td><span class="tag ${o.status}">${o.status}</span></td><td class="num">${fmtMoney(orderTotal(o))}</td></tr>`).join("")}</tbody>
          </table></div>` : `<p class="muted">No orders yet.</p>`}`;
      },
    });
  </script>
  </div>
</body>
</html>
