<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AT-HUB — Simulate</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth-guard.js"></script>
  <style>
    /* the notebook: two pages side by side with a binding down the middle */
    .sim-book { display: grid; grid-template-columns: minmax(0, 1fr) 14px minmax(0, 1fr); margin-bottom: 16px; border-radius: 14px;
      border: 1px solid var(--border); background: var(--surface); box-shadow: 0 8px 24px rgba(15, 23, 42, .07); overflow: hidden; }
    .sim-page { padding: 14px 14px 18px; min-width: 0;
      background-image: repeating-linear-gradient(to bottom, transparent 0 31px, color-mix(in srgb, var(--border) 45%, transparent) 31px 32px); }
    .sim-left { border-left: 4px solid color-mix(in srgb, #16a34a 55%, transparent); }
    .sim-right { border-right: 4px solid color-mix(in srgb, #2563eb 55%, transparent); }
    .sim-binding { background: linear-gradient(to right, rgba(0,0,0,.10), rgba(0,0,0,.02) 40%, rgba(0,0,0,.02) 60%, rgba(0,0,0,.10));
      background-color: var(--bg); position: relative; }
    .sim-binding::before { content: ""; position: absolute; inset: 18px 4px; background: radial-gradient(circle, var(--border) 2px, transparent 2.5px) center top / 6px 26px repeat-y; }
    .sim-page-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .sim-page-head h3 { margin: 0; flex: 1; min-width: 150px; }
    .sim-add { display: flex; gap: 6px; flex-wrap: wrap; }
    .sim-block { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 12px; }
    .sim-block.is-demand { border-top: 3px solid #16a34a; }
    .sim-block.is-source { border-top: 3px solid #2563eb; }
    .sim-block.is-shared { border-top: 3px dashed var(--border); }
    .sim-bhead, .sim-bfoot, .sim-party, .sim-bactions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .sim-bhead .sim-label { font-weight: 700; flex: 1; min-width: 120px; border-color: transparent; background: transparent; padding-left: 2px; }
    .sim-bhead .sim-label:hover, .sim-bhead .sim-label:focus { border-color: var(--border); background: var(--surface); }
    .sim-party { margin: 6px 0; } .sim-party select { width: auto; max-width: 100%; min-width: 180px; }
    .sim-mult { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; }
    .sim-mult input { width: 58px; }
    .sim-lines { width: 100%; table-layout: fixed; }
    .sim-lines th:nth-child(1) { width: auto; }
    .sim-lines th:nth-child(2) { width: 74px; } .sim-lines th:nth-child(3) { width: 86px; }
    .is-source .sim-lines th:nth-child(4) { width: 62px; }
    .sim-lines th.num:nth-last-child(2) { width: 82px; } .sim-lines th:last-child { width: 20px; }
    .sim-lines td { vertical-align: top; }
    .sim-item { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .sim-code { width: 110px !important; font-weight: 600; } .sim-desc { flex: 1; min-width: 100px; }
    .sim-num { width: 100%; text-align: right; }
    .sim-cand { width: 100%; font-size: 12px; }
    .sim-x { cursor: pointer; color: var(--muted); font-size: 16px; line-height: 1; padding: 0 3px; text-decoration: none; }
    .sim-x:hover { color: #dc2626; }
    .sim-bfoot { margin-top: 6px; } .sim-bprofit { margin-top: 6px; padding: 6px 8px; border-radius: 8px; background: var(--bg); }
    .sim-bactions { margin-top: 8px; justify-content: flex-end; }
    .sim-costs { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border); }
    .sim-costs-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-bottom: 4px; }
    .sim-costs table { width: 100%; } .sim-costs td { padding: 3px 4px; }
    .sim-costs td:nth-child(2) select { min-width: 112px; } .sim-costs td:nth-child(4) select { min-width: 100px; }
    .sim-costs td:nth-child(3) { width: 90px; } .sim-costs td:last-child { width: 18px; }
    .sim-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .sim-chips .pack-chip { cursor: pointer; font-size: 11.5px; }
    /* not in our database: a mild amber glow */
    tr.sim-unknown > td { background: color-mix(in srgb, #f59e0b 9%, transparent); }
    tr.sim-unknown > td:first-child { box-shadow: inset 3px 0 0 #f59e0b; }
    tr.sim-unknown .sim-code { box-shadow: 0 0 0 2px color-mix(in srgb, #f59e0b 35%, transparent), 0 0 10px color-mix(in srgb, #f59e0b 35%, transparent); }
    .sim-tag { font-size: 10.5px; font-weight: 700; color: #92400e; background: #fef3c7; border-radius: 999px; padding: 1px 7px; white-space: nowrap; }
    .sim-warn { color: #b45309; }
    /* generic bulk nuts (58-NUT) and the specific nuts they stand in for */
    .sim-gen { font-size: 10.5px; font-weight: 700; color: #5b21b6; background: #ede9fe; border-radius: 999px; padding: 1px 7px; }
    .sim-gen-txt { color: #6d28d9; }
    .sim-stock { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; white-space: nowrap; }
    .sim-stock input { width: auto; margin: 0; }
    .sim-stock.off { color: var(--muted); text-decoration: line-through; }
    .pos { color: #15803d; } .neg { color: #dc2626; }
    .sim-compare { width: 100%; }
    /* frozen header: the table scrolls in its own box, the header row stays put */
    /* frozen headers: the page scrolls, the header row sticks to the top of the window while its table is on screen */
    table.sim-compare thead th, table.sim-track thead th { position: sticky; top: 0; z-index: 3; background: var(--surface-3, var(--bg)); box-shadow: inset 0 -1px 0 var(--border); }
    table.sim-compare tfoot td, table.sim-track tfoot td { position: sticky; bottom: 0; z-index: 2; background: var(--surface-3, var(--bg)); box-shadow: inset 0 1px 0 var(--border); }
    /* cost with no vendor price: blue = last purchase price, red = typed with no history to go on */
    .sim-est.est-hist { color: #1e3a8a; background: #dbeafe; font-weight: 700; box-shadow: 0 0 0 2px #93c5fd; }
    .sim-est.est-red { color: #991b1b; background: #fee2e2; font-weight: 700; box-shadow: 0 0 0 2px #fca5a5; }
    .sim-est.est-own { color: #92400e; background: #fef3c7; font-weight: 700; box-shadow: 0 0 0 2px #fcd34d; }
    .sim-src { display: block; font-size: 11px; font-weight: 600; line-height: 1.25; margin-top: 3px; white-space: normal; }
    .sim-src.hist { color: #1e3a8a; } .sim-src.red { color: #b91c1c; } .sim-src.own { color: #92400e; }
    html[data-theme="dark"] .sim-est.est-hist { color: #dbeafe; background: #1e3a8a; box-shadow: 0 0 0 2px #3b82f6; }
    html[data-theme="dark"] .sim-est.est-red { color: #fee2e2; background: #7f1d1d; box-shadow: 0 0 0 2px #ef4444; }
    html[data-theme="dark"] .sim-est.est-own { color: #fef3c7; background: #78350f; box-shadow: 0 0 0 2px #f59e0b; }
    html[data-theme="dark"] .sim-src.hist { color: #93c5fd; } html[data-theme="dark"] .sim-src.red { color: #fca5a5; } html[data-theme="dark"] .sim-src.own { color: #fcd34d; }
    .sim-allnone { display: none; font-size: 10.5px; font-weight: 600; margin-top: 2px; }
    .sim-allnone a { cursor: pointer; color: var(--accent); }
    .stock-ticks .sim-allnone { display: block; }
    .sim-stock-help { max-width: 360px; }
    .sim-mystock { width: 66px; }
    table.sim-compare .sim-est { width: 84px; }
    table.sim-compare td { padding-left: 5px; padding-right: 5px; }
    .sim-track-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    .sim-plan { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin: 10px 0; padding: 8px 10px; border-radius: 10px; background: var(--bg); }
    .sim-plan label { display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
    .sim-plan select, .sim-plan input[type=number] { width: auto; }
    table.sim-track { width: 100%; }
    table.sim-track select { min-width: 120px; max-width: 170px; }
    table.sim-track input.sim-num { width: 80px; }
    table.sim-track tr.trk-group td { background: var(--bg); font-weight: 700; }
    table.sim-track .trk-c { width: 28px; text-align: center; }
    table.sim-track .trk-tick { width: 16px; height: 16px; margin: 0; cursor: pointer; }
    table.sim-track tr.trk-picked td { background: var(--accent-soft); }
    .trk-progress { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin: 4px 0 10px; }
    .trk-bar { flex: 0 0 220px; height: 10px; border-radius: 999px; background: var(--surface-2, #e5e7eb); overflow: hidden; border: 1px solid var(--border); }
    .trk-bar span { display: block; height: 100%; background: #16a34a; }
    .trk-st { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
    .trk-st.todo { background: #fef3c7; color: #92400e; } .trk-st.ordered { background: #dcfce7; color: #166534; }
    .trk-st.draft { background: #dbeafe; color: #1e40af; } .trk-st.onpo { background: #e0e7ff; color: #3730a3; }
    .sim-chips-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .sim-chips-row .pack-chip { cursor: pointer; }
    .sim-chips-row .pack-chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .sim-est { width: 92px; box-shadow: 0 0 0 2px color-mix(in srgb, #f59e0b 30%, transparent); }
    #sim-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    /* spreadsheet */
    .sim-sheet-modal { width: min(1200px, 96vw); max-width: none; max-height: 92vh; display: flex; flex-direction: column; }
    .sim-sheet-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
    .sim-ai { display: flex; gap: 6px; align-items: center; padding: 6px; border-radius: 10px; flex-wrap: wrap;
      background: linear-gradient(90deg, color-mix(in srgb, #7c3aed 10%, transparent), color-mix(in srgb, #2563eb 8%, transparent)); }
    .sim-ai input { flex: 1; min-width: 220px; }
    .sim-ai-badge { font-weight: 800; font-size: 11px; color: #fff; background: linear-gradient(135deg, #7c3aed, #2563eb); border-radius: 6px; padding: 3px 6px; }
    #sim-ai-note { min-height: 18px; margin: 4px 2px; }
    .sim-sheet-wrap { overflow: auto; flex: 1; border: 1px solid var(--border); border-radius: 8px; }
    .sim-grid { border-collapse: collapse; font-size: 13px; min-width: 100%; }
    .sim-grid th { position: sticky; top: 0; background: var(--bg); z-index: 1; text-align: left; white-space: nowrap; }
    .sim-grid th, .sim-grid td { border: 1px solid var(--border); padding: 4px 6px; }
    .sim-grid td[contenteditable] { min-width: 70px; outline: none; }
    .sim-grid td[contenteditable]:focus { box-shadow: inset 0 0 0 2px var(--accent); background: var(--surface); }
    .sim-grid .sim-rn { color: var(--muted); font-size: 11px; text-align: right; width: 28px; background: var(--bg); }
    @media (max-width: 1100px) { .sim-book { grid-template-columns: 1fr; } .sim-binding { height: 10px; } .sim-binding::before { display: none; } }
  </style>
</head>
<body>
  <div class="app-shell">
  <div id="sidebar"></div>
  <main>
    <div class="card page-toolbar" id="sim-bar"><h1 class="page-title">Simulate</h1></div>
    <p class="muted small" style="margin:-4px 0 12px 4px;">What would this make? Put what customers want on the left, where it comes from on the right.
      Nothing here changes real orders, stock or money until you press a <b>Create</b> button.</p>
    <div id="sim-main"><div class="card"><p class="muted">Loading...</p></div></div>
  </main>
  </div>
  <script src="simulate.js"></script>
</body>
</html>
