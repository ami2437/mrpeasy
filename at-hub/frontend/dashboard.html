<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AT-HUB — Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth-guard.js"></script>
</head>
<body>
  <div class="app-shell">
  <div id="sidebar"></div>
  <main>
    <div class="card">
      <h2 style="margin-top:0;">Welcome to AT-HUB</h2>
      <p class="muted">Stock items, lot tracking, customer orders, and purchase orders — standalone, no MRP dependency.</p>
    </div>
    <div class="card" id="summary">Loading summary...</div>
  </main>

  <script>
    AuthGuard.requireLogin();
    document.getElementById("sidebar").innerHTML = renderSidebar("dashboard.html");

    async function loadSummary() {
      try {
        const [items, lowStock, customerOrders, purchaseOrders] = await Promise.all([
          apiFetch("/api/stock-items/"),
          apiFetch("/api/stock-items/?low_stock_only=true"),
          apiFetch("/api/customer-orders/"),
          apiFetch("/api/purchase-orders/"),
        ]);
        const openCO = customerOrders.filter(o => !["shipped", "invoiced", "cancelled"].includes(o.status)).length;
        const openPO = purchaseOrders.filter(o => !["received", "cancelled"].includes(o.status)).length;
        document.getElementById("summary").innerHTML = `
          <div class="row">
            <div><div style="font-size:28px;font-weight:700;">${items.length}</div><div class="muted">Stock items</div></div>
            <div><div style="font-size:28px;font-weight:700;color:${lowStock.length ? '#dc2626' : '#111'};">${lowStock.length}</div><div class="muted">Low stock</div></div>
            <div><div style="font-size:28px;font-weight:700;">${openCO}</div><div class="muted">Open customer orders</div></div>
            <div><div style="font-size:28px;font-weight:700;">${openPO}</div><div class="muted">Open purchase orders</div></div>
          </div>
        `;
      } catch (err) {
        document.getElementById("summary").innerHTML = `<div class="error">${err.message}</div>`;
      }
    }
    loadSummary();
  </script>
  </div>
</body>
</html>
