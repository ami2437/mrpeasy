<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AT-HUB — Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth-guard.js"></script>
</head>
<body>
  <div class="app-shell">
  <div id="sidebar"></div>
  <main>
    <div class="card">
      <h2 style="margin:0;" id="greeting">Welcome</h2>
      <p class="muted" style="margin:4px 0 0;">What needs attention today. <span class="kbd-hint">Press <kbd>Ctrl</kbd>+<kbd>K</kbd> to find any order, PO, item, customer or vendor.</span></p>
    </div>
    <div class="card" id="summary">Loading summary...</div>

    <div class="card"><h3 style="margin-top:0;">Needs Attention</h3><div id="dash-actions" class="muted">Loading…</div></div>

    <div class="card m-hide">
      <h3 style="margin-top:0;">Recent Activity</h3>
      <table>
        <thead><tr><th>When</th><th>Item</th><th>Type</th><th>Qty</th><th>Reference</th><th>By</th></tr></thead>
        <tbody id="activity-body"><tr><td colspan="6" class="muted">Loading...</td></tr></tbody>
      </table>
    </div>
  </main>

  <script>
    if (AuthGuard.requireLogin() && homePage() !== "dashboard.html") location.replace(homePage());  // e.g. drivers: straight to POD
    document.getElementById("sidebar").innerHTML = renderSidebar("dashboard.html");


    async function loadSummary() {
      try {
        const [items, lowStock, customerOrders, purchaseOrders] = await Promise.all([
          apiFetch("/api/stock-items/"),
          apiFetch("/api/stock-items/?low_stock_only=true"),
          apiFetch("/api/customer-orders/"),
          AuthGuard.can("purchasing") ? apiFetch("/api/purchase-orders/") : Promise.resolve(null),
        ]);
        const openCO = customerOrders.filter(o => !["shipped", "invoiced", "cancelled"].includes(o.status)).length;
        const openPO = (purchaseOrders || []).filter(o => !["received", "cancelled"].includes(o.status)).length;
        const t = await apiFetch("/api/reports/today").catch(() => ({}));
        // tile(label, value, sub, link, tone): tone pos / warn / neg colours the number
        const tile = (label, value, sub, link, tone = "") => `<a class="today-tile ${tone}" href="${link}"><span>${label}</span><strong>${value}</strong><small>${sub}</small></a>`;
        const groups = [];
        if (t.floor) groups.push(["Shipping floor", [
          tile("To pick", t.floor.to_pick, "booked, not picked", "pack-shipments.html?stage=pick", t.floor.to_pick ? "warn" : ""),
          tile("To pack", t.floor.to_pack, "picked, packing not accepted", "pack-shipments.html?stage=pack", t.floor.to_pack ? "warn" : ""),
          tile("Ready to ship", t.floor.ready_to_ship, "picked and packed", "pack-shipments.html?stage=ship", t.floor.ready_to_ship ? "pos" : ""),
          tile("Shipped today", t.floor.shipped_today, "left the building", "pack-shipments.html?stage=shipped")]]);
        if (t.orders || t.purchasing) groups.push(["Coming up", [
          ...(t.orders ? [tile("Deliveries due", t.orders.due_this_week, "next 7 days", "customer-orders.html"),
                          tile("Orders overdue", t.orders.overdue, "past delivery date", "customer-orders.html", t.orders.overdue ? "neg" : "")] : []),
          ...(t.purchasing ? [tile("POs arriving", t.purchasing.arriving_this_week, "next 7 days", "purchase-orders.html"),
                              tile("POs late", t.purchasing.late, "past expected date", "purchase-orders.html", t.purchasing.late ? "neg" : "")] : [])]]);
        if (t.money) groups.push(["Money", [
          tile("Due to us this week", fmtMoney(t.money.due_this_week), "sent invoices", "invoices.html"),
          tile("Overdue", fmtMoney(t.money.overdue), `${t.money.overdue_count} invoice${t.money.overdue_count === 1 ? "" : "s"}`, "reports.html?tab=statements", t.money.overdue ? "neg" : "pos"),
          tile("Collected this week", fmtMoney(t.money.collected_this_week), "payments recorded", "invoices.html", "pos"),
          ...(t.money.paid_out_this_week != null ? [tile("Paid to vendors", fmtMoney(t.money.paid_out_this_week), "this week", "purchase-orders.html")] : [])]]);
        if (!groups.length) groups.push(["Today", [tile("Stock items", items.length, `${lowStock.length} low`, "stock-items.html", lowStock.length ? "warn" : ""),
          tile("Open orders", openCO, "not fully shipped", "customer-orders.html")]]);
        const b = t.backups;
        const backupNote = b && !b.error && (b.hours == null || b.hours > Math.max(24, (b.every_hours || 6) * 2) || b.copies_missing)
          ? `<div class="notice" style="margin-top:10px;">${b.hours == null ? "No backups yet." : `Last backup ${Math.round(b.hours)} hours ago.`}
              ${b.copies_missing ? ` ${b.copies_missing} backup cop${b.copies_missing === 1 ? "y is" : "ies are"} missing.` : ""} <a class="link" href="backups.html">Check Backups</a></div>` : "";
        document.getElementById("summary").innerHTML = groups.map(([title, tiles]) =>
          `<div class="today-group"><div class="today-head">${title}</div><div class="today-tiles">${tiles.join("")}</div></div>`).join("") + backupNote;

        const activity = await apiFetch("/api/stock-items/activity/recent?limit=15");
        const itemsById = Object.fromEntries(items.map(i => [i.id, i]));
        document.getElementById("activity-body").innerHTML = activity.length ? activity.map(t => `
          <tr>
            <td>${fmtDateTime(t.created_at)}</td>
            <td>${escapeHtml(itemsById[t.item_id] ? itemsById[t.item_id].code : t.item_id)}</td>
            <td>${t.type}</td>
            <td style="color:${t.quantity_delta < 0 ? '#dc2626' : '#166534'};font-weight:600;">${t.quantity_delta > 0 ? '+' : ''}${t.quantity_delta}</td>
            <td>${escapeHtml(t.reference || '')}</td>
            <td class="muted">${escapeHtml(t.created_by || '')}</td>
          </tr>
        `).join("") : `<tr><td colspan="6" class="muted">No activity yet.</td></tr>`;
      } catch (err) {
        document.getElementById("summary").innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
      }
    }
    const hr = new Date().getHours();
    document.getElementById("greeting").textContent = `Good ${hr < 12 ? "morning" : hr < 18 ? "afternoon" : "evening"}${(AuthGuard.getUser() || {}).full_name ? `, ${AuthGuard.getUser().full_name.split(" ")[0]}` : ""}`;
    loadSummary();
    renderActionItems("dash-actions");
  </script>
  </div>
</body>
</html>
